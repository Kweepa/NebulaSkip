/** Front-3/4 of editor +Z, a little above — rest pose, not the layout walk cycle. */
const ENEMY_ICON_YAW = Math.PI - 0.45;
const ENEMY_ICON_PITCH = -0.3;

let paletteIconRo = null;

function bindPaletteIconResize(root) {
  paletteIconRo?.disconnect();
  paletteIconRo = new ResizeObserver(() => paintEnemyPaletteIcons());
  paletteIconRo.observe(root);
}

function paintEnemyPaletteIcons() {
  for (const canvas of document.querySelectorAll(".palette-enemy-icon")) {
    paintEnemyIcon(canvas, findEnemyTemplate(doc, canvas.dataset.enemy));
  }
}

function paintEnemyIcon(canvas, template) {
  const cssW = canvas.clientWidth >= 8 ? canvas.clientWidth : 96;
  const cssH = canvas.clientHeight >= 8 ? canvas.clientHeight : 36;
  const dpr = window.devicePixelRatio || 1;
  const w = Math.max(1, Math.round(cssW * dpr));
  const h = Math.max(1, Math.round(cssH * dpr));
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w;
    canvas.height = h;
  }
  const ctx = canvas.getContext("2d");
  ctx.clearRect(0, 0, w, h);
  const frame = enemyPreviewFrame(template);
  const lines = template?.lines;
  if (!frame?.length || !lines?.length) return;

  let minX = Infinity;
  let minY = Infinity;
  let minZ = Infinity;
  let maxX = -Infinity;
  let maxY = -Infinity;
  let maxZ = -Infinity;
  for (const v of frame) {
    if (v.x < minX) minX = v.x;
    if (v.y < minY) minY = v.y;
    if (v.z < minZ) minZ = v.z;
    if (v.x > maxX) maxX = v.x;
    if (v.y > maxY) maxY = v.y;
    if (v.z > maxZ) maxZ = v.z;
  }
  const cx = (minX + maxX) / 2;
  const cy = (minY + maxY) / 2;
  const cz = (minZ + maxZ) / 2;
  const radius = Math.max(1, Math.hypot(maxX - minX, maxY - minY, maxZ - minZ) * 0.5);
  const { forward } = lookVectors(ENEMY_ICON_YAW, ENEMY_ICON_PITCH);
  const dist = radius * 3.2;
  const cam = {
    x: cx - forward.x * dist,
    y: cy - forward.y * dist,
    z: cz - forward.z * dist,
    yaw: ENEMY_ICON_YAW,
    pitch: ENEMY_ICON_PITCH,
  };
  const focal = Math.min(w, h) * 0.9;
  const segs = [];
  for (const [i, j] of lines) {
    const a = frame[i];
    const b = frame[j];
    if (!a || !b) continue;
    const seg = projectLine(a, b, cam, w, h, focal);
    if (seg) segs.push(seg);
  }
  if (!segs.length) return;

  let sx0 = Infinity;
  let sy0 = Infinity;
  let sx1 = -Infinity;
  let sy1 = -Infinity;
  for (const s of segs) {
    sx0 = Math.min(sx0, s.ax, s.bx);
    sy0 = Math.min(sy0, s.ay, s.by);
    sx1 = Math.max(sx1, s.ax, s.bx);
    sy1 = Math.max(sy1, s.ay, s.by);
  }
  const bw = Math.max(1, sx1 - sx0);
  const bh = Math.max(1, sy1 - sy0);
  const pad = Math.max(2 * dpr, Math.round(Math.min(w, h) * 0.08));
  const scale = Math.min((w - pad * 2) / bw, (h - pad * 2) / bh);
  const ox = (w - bw * scale) / 2 - sx0 * scale;
  const oy = (h - bh * scale) / 2 - sy0 * scale;

  ctx.strokeStyle = KINDS.enemy.color;
  ctx.lineWidth = Math.max(1, dpr);
  ctx.lineJoin = "round";
  ctx.lineCap = "round";
  ctx.beginPath();
  for (const s of segs) {
    ctx.moveTo(s.ax * scale + ox, s.ay * scale + oy);
    ctx.lineTo(s.bx * scale + ox, s.by * scale + oy);
  }
  ctx.stroke();
}

function paletteButton(label, color, payload) {
  const el = document.createElement("button");
  el.type = "button";
  el.className = "palette-item";
  el.style.borderColor = color;
  if (payload.enemy) {
    el.classList.add("palette-enemy");
    const icon = document.createElement("canvas");
    icon.className = "palette-enemy-icon";
    icon.dataset.enemy = payload.enemy;
    icon.setAttribute("aria-hidden", "true");
    const name = document.createElement("span");
    name.className = "palette-enemy-name";
    name.textContent = label;
    el.append(icon, name);
  } else if (payload.pickup || payload.doorType) {
    el.classList.add("palette-thing");
    const icon = document.createElement("img");
    icon.className = "palette-thing-icon";
    icon.alt = "";
    icon.draggable = false;
    icon.src = thingIconUrl(payload.pickup ?? payload.doorType);
    const name = document.createElement("span");
    name.className = "palette-thing-name";
    name.textContent = label;
    el.append(icon, name);
  } else if (KIND_ICON[payload.kind]) {
    const icon = document.createElement("img");
    icon.className = "palette-thing-icon";
    icon.alt = "";
    icon.draggable = false;
    icon.src = `thingicons/${KIND_ICON[payload.kind]}.png`;
    const name = document.createElement("span");
    name.className = "palette-thing-name";
    name.textContent = label;
    el.append(icon, name);
  } else {
    el.textContent = label;
  }
  el.title = payload.pickup || payload.doorType ? label : "Drag onto the map to place";
  el.addEventListener("pointerdown", (e) => {
    if (e.button !== 0) return;
    e.preventDefault();
    pendingPlace = { ...payload, pointerId: e.pointerId };
    el.setPointerCapture(e.pointerId);
    document.body.classList.add("palette-dragging");
    setStatus(`Drop ${label} on the map…`);
  });
  el.addEventListener("pointermove", (e) => {
    updatePaletteDrag(e);
  });
  el.addEventListener("pointerup", (e) => {
    if (!pendingPlace || pendingPlace.pointerId !== e.pointerId) return;
    finishPaletteDrop(e);
  });
  el.addEventListener("pointercancel", (e) => {
    if (pendingPlace?.pointerId === e.pointerId) clearPaletteDrag();
  });
  return el;
}

function finishPaletteDrop(e) {
  const place = pendingPlace;
  document.body.classList.remove("palette-dragging");
  layoutView.clearPlacePreview();
  pendingPlace = null;
  if (!place || editorMode !== "layout") return;
  const { over, mx, my } = canvasClientToScreen(e);
  if (!over) {
    layoutView.draw();
    setStatus("Place cancelled", true);
    return;
  }
  const kind = place.kind;
  const p = layoutView.placeAtScreen(mx, my, kind);
  const owner = placeOwner(kind, p.room);
  if (kind === "room" && roomsOf(doc).length >= ROOM_MAX) {
    layoutView.draw();
    setStatus(`Max ${ROOM_MAX} rooms`, true);
    return;
  }
  if (kind === "enemy" && activeMap(doc).objects.filter((o) => o.kind === "enemy").length >= ENEMY_MAX) {
    layoutView.draw();
    setStatus(`Max ${ENEMY_MAX} enemies`, true);
    return;
  }
  if (kind === "enemy" && !canAddEnemyType(activeMap(doc), place.enemy, owner?.id)) {
    layoutView.draw();
    setStatus(`Max ${ROOM_MAX_TYPES} enemy types per room`, true);
    return;
  }
  pushUndo();
  const obj = previewObjectAtScreen(place, mx, my);
  activeMap(doc).objects.push(obj);
  if (kind === "doorway") {
    assignDoorRooms(doc, obj, owner, false);
    clampObject(obj);
  }
  if (kind === "room") lastRoomId = obj.id;
  selectedIds = [obj.id];
  rememberSelectedRoom();
  markDirty();
  refreshAll();
  setStatus(place.enemy ? `Placed ${place.enemy}` : `Placed ${KINDS[kind].label}`);
}

function selectedObject() {
  if (selectedIds.length !== 1) return null;
  return activeMap(doc).objects.find((o) => o.id === selectedIds[0]) || null;
}

function selectedLayoutObjects() {
  const map = activeMap(doc);
  return selectedIds.map((id) => map.objects.find((o) => o.id === id)).filter(Boolean);
}

function unanimous(objs, get) {
  if (!objs.length) return undefined;
  const v0 = get(objs[0]);
  for (let i = 1; i < objs.length; i++) {
    if (get(objs[i]) !== v0) return undefined;
  }
  return v0;
}

function rememberSelectedRoom() {
  for (let i = selectedIds.length - 1; i >= 0; i--) {
    const obj = activeMap(doc).objects.find((o) => o.id === selectedIds[i]);
    if (!obj) continue;
    if (obj.kind === "room") {
      lastRoomId = obj.id;
      break;
    }
    if (obj.roomId) {
      lastRoomId = obj.roomId;
      break;
    }
  }
  if (localDraw && !applyingEditor) {
    const msg = drawModeStatus();
    setStatus(msg, msg.startsWith("Local: no"));
  }
}

function placementRoom() {
  const obj = selectedObject();
  if (obj?.kind === "room") return obj;
  if (obj?.roomId) {
    const r = roomById(doc, obj.roomId);
    if (r) return r;
  }
  return roomById(doc, lastRoomId);
}

function deleteSelected() {
  if (editorMode === "layout") {
    if (!selectedIds.length) return;
    pushUndo();
    const drop = new Set(selectedIds);
    for (const o of activeMap(doc).objects) {
      if (o.kind === "room") continue;
      if (o.roomId && drop.has(o.roomId)) o.roomId = null;
      if (o.otherRoomId && drop.has(o.otherRoomId)) o.otherRoomId = null;
    }
    activeMap(doc).objects = activeMap(doc).objects.filter((o) => !drop.has(o.id));
    ensureSpawnExclusive(activeMap(doc).objects);
    selectedIds = [];
    markDirty();
    refreshAll();
    return;
  }
}

function duplicateSelected() {
  if (!selectedIds.length || editorMode !== "layout") return;
  pushUndo();
  const created = [];
  let skipped = 0;
  let skipReason = "";
  for (const id of selectedIds) {
    const obj = activeMap(doc).objects.find((o) => o.id === id);
    if (!obj) continue;
    if (obj.kind === "room" && roomsOf(doc).length >= ROOM_MAX) {
      skipped++;
      skipReason = `Max ${ROOM_MAX} rooms`;
      continue;
    }
    if (obj.kind === "enemy" && activeMap(doc).objects.filter((o) => o.kind === "enemy").length >= ENEMY_MAX) {
      skipped++;
      skipReason = `Max ${ENEMY_MAX} enemies`;
      continue;
    }
    if (obj.kind === "enemy" && !canAddEnemyType(activeMap(doc), obj.enemy, obj.roomId)) {
      skipped++;
      skipReason = `Max ${ROOM_MAX_TYPES} enemy types per room`;
      continue;
    }
    const copy = clampObject({
      ...obj,
      id: uid(),
      x: obj.x + 2,
      z: obj.z + 2,
    });
    if (copy.kind === "spawn") copy.enabled = false;
    activeMap(doc).objects.push(copy);
    created.push(copy.id);
  }
  if (!created.length) {
    endUndo();
    undoStack.pop();
    updateUndoButtons();
    setStatus(skipped ? skipReason : "Nothing to duplicate", true);
    return;
  }
  selectedIds = created;
  markDirty();
  refreshAll();
  setStatus(skipped ? `Duplicated ${created.length} (${skipped} skipped)` : `Duplicated ${created.length}`);
}

function dropSelectedToFloor() {
  if (!selectedIds.length || editorMode !== "layout") return;
  pushUndo();
  let n = 0;
  for (const id of selectedIds) {
    const obj = activeMap(doc).objects.find((o) => o.id === id);
    if (!obj || obj.kind === "room" || obj.kind === "doorway") continue;
    const room = roomUnderObject(doc, obj);
    obj.y = room ? roomFloorY(room, obj.x + obj.sx / 2, obj.z + obj.sz / 2) : 0;
    clampObject(obj);
    n++;
  }
  if (!n) {
    endUndo();
    undoStack.pop();
    updateUndoButtons();
    setStatus("Nothing to drop", true);
    return;
  }
  markDirty();
  refreshAll();
  setStatus(`Dropped ${n} to floor`);
}

function switchLevel(name) {
  if (!LEVEL_NAMES.includes(name) || name === doc.activeLevel) return;
  layoutCamerasByLevel[doc.activeLevel] = snapshotLayoutCamera();
  doc.activeLevel = name;
  restoreLayoutCameraForLevel(name);
  selectedIds = [];
  lastRoomId = null;
  collapsedRooms.clear();
  markUi();
  refreshAll();
  setStatus(name);
}

function addLevelAndSwitch() {
  if (LEVEL_NAMES.length >= MAX_LEVELS) return;
  pushUndo();
  const name = addLevel(doc);
  if (!name) return;
  markDirty();
  switchLevel(name);
  setStatus(`Added ${name}`);
}

function updateCenterChrome() {
  const titleEl = document.getElementById("center-title");
  const statsEl = document.getElementById("map-stats");
  if (editorMode === "layout") {
    const map = activeMap(doc);
    titleEl.textContent = map.name
      ? `Map ${doc.activeLevel} — ${map.name}`
      : `Map ${doc.activeLevel}`;
    if (statsEl) {
      const stats = mapStats(doc);
      statsEl.hidden = false;
      statsEl.replaceChildren();
      formatMapStats(stats).forEach((part, i) => {
        if (i) statsEl.append(" · ");
        if (part.over) {
          const span = document.createElement("span");
          span.className = "over";
          span.textContent = part.text;
          statsEl.append(span);
        } else {
          statsEl.append(part.text);
        }
      });
      statsEl.title = formatMapLoadTitle(stats);
      statsEl.classList.toggle("error", !!stats.overBudget);
    }
    return;
  }
  titleEl.textContent =
    editorMode === "items"
        ? itemMeshKey
        : editorMode === "build"
          ? "Build"
          : editorMode === "font"
            ? "Font"
            : "Enemy";
  if (statsEl) {
    statsEl.hidden = true;
    statsEl.textContent = "";
    statsEl.title = "";
    statsEl.classList.remove("error");
  }
}

function renderLevelList() {
  const root = document.getElementById("level-list");
  if (!root) return;
  root.classList.add("level-list");
  root.innerHTML = "";
  const title = document.createElement("h2");
  title.textContent = "Levels";
  root.appendChild(title);
  const ul = document.createElement("ul");
  const terms = layoutSearchTerms(layoutSearch);
  for (const name of LEVEL_NAMES) {
    const li = document.createElement("li");
    const btn = document.createElement("button");
    btn.type = "button";
    const map = doc.maps[name];
    const display = clampName(map?.name);
    btn.textContent = name;
    btn.title = display ? `${name} — ${display}` : name;
    if (name === doc.activeLevel) btn.classList.add("active");
    if (mapMatchesLayoutSearch(map, terms)) btn.classList.add("search-hit");
    btn.addEventListener("click", () => switchLevel(name));
    li.appendChild(btn);
    ul.appendChild(li);
  }
  if (LEVEL_NAMES.length < MAX_LEVELS) {
    const li = document.createElement("li");
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "level-add";
    btn.textContent = "+";
    btn.title = "Add a map";
    btn.addEventListener("click", addLevelAndSwitch);
    li.appendChild(btn);
    ul.appendChild(li);
  }
  root.appendChild(ul);
}

function selectObjectIds(ids, additive) {
  const added = [];
  if (additive) {
    for (const id of ids) {
      const i = selectedIds.indexOf(id);
      if (i >= 0) selectedIds.splice(i, 1);
      else {
        selectedIds.push(id);
        added.push(id);
      }
    }
  } else {
    selectedIds = [...ids];
    added.push(...ids);
  }
  rememberSelectedRoom();
  connectUnlinkedDoors(added);
  markDirty();
  refreshPanels();
}

/** Recompute room links of the given doors from touching geometry (never moves them). */
function connectUnlinkedDoors(ids) {
  const map = activeMap(doc);
  const stale = [];
  for (const id of ids) {
    const obj = map.objects.find((o) => o.id === id);
    if (obj?.kind !== "doorway") continue;
    if (relinkDoor(doc, { ...obj })) stale.push(obj);
  }
  if (!stale.length) return false;
  pushUndo();
  for (const door of stale) relinkDoor(doc, door);
  markDirty();
  setStatus(stale.length === 1 ? "Relinked doorway" : `Relinked ${stale.length} doorways`);
  return true;
}

function makeObjectListButton(obj, terms, outside) {
  const btn = document.createElement("button");
  btn.type = "button";
  btn.textContent = objectLabel(obj);
  btn.classList.add(obj.kind === "room" ? "tree-label-wrap" : "tree-label-elide");
  if (selectedIds.includes(obj.id)) btn.classList.add("active");
  if (objectMatchesLayoutSearch(obj, terms)) btn.classList.add("search-hit");
  if (obj.kind === "doorway" && !doorDoublyConnected(doc, obj)) {
    btn.classList.add("door-unlinked");
    btn.title = "Not connected to two rooms";
  }
  if (outside?.has(obj.id)) {
    btn.classList.add("outside-room");
    btn.title = "Geometry outside its room's bounding box";
  }
  btn.addEventListener("click", (e) => {
    selectObjectIds([obj.id], e.shiftKey);
  });
  return btn;
}

function renderObjectList() {
  const ul = document.getElementById("object-list");
  ul.innerHTML = "";
  ul.classList.add("object-tree");
  const { nodes, orphans } = objectTree(doc);
  const outside = outsideRoomBoxMap(doc);
  const terms = layoutSearchTerms(layoutSearch);
  const searching = terms.length > 0;

  for (const { room, children } of nodes) {
    const li = document.createElement("li");
    li.className = "tree-room";
    const row = document.createElement("div");
    row.className = "tree-row";
    const twist = document.createElement("button");
    twist.type = "button";
    twist.className = "tree-twist";
    const roomHit = objectMatchesLayoutSearch(room, terms);
    const childHit = children.some((obj) => objectMatchesLayoutSearch(obj, terms));
    const collapsed = !(searching && (roomHit || childHit)) && collapsedRooms.has(room.id);
    twist.textContent = collapsed ? "▸" : "▾";
    twist.title = collapsed ? "Expand" : "Collapse";
    twist.addEventListener("click", (e) => {
      e.stopPropagation();
      if (collapsedRooms.has(room.id)) collapsedRooms.delete(room.id);
      else collapsedRooms.add(room.id);
      markUi();
      renderObjectList();
    });
    const roomBtn = makeObjectListButton(room, terms, outside);
    roomBtn.classList.add("tree-room-btn");
    row.append(twist, roomBtn);
    li.appendChild(row);
    if (!collapsed) {
      const childUl = document.createElement("ul");
      childUl.className = "tree-children";
      if (!children.length) {
        const empty = document.createElement("li");
        empty.className = "tree-empty";
        empty.textContent = "(empty)";
        childUl.appendChild(empty);
      } else {
        for (const obj of children) {
          const cli = document.createElement("li");
          cli.appendChild(makeObjectListButton(obj, terms, outside));
          childUl.appendChild(cli);
        }
      }
      li.appendChild(childUl);
    }
    ul.appendChild(li);
  }

  if (orphans.length) {
    const li = document.createElement("li");
    li.className = "tree-orphans";
    const label = document.createElement("div");
    label.className = "tree-orphan-label";
    label.textContent = "Outside rooms";
    li.appendChild(label);
    const childUl = document.createElement("ul");
    childUl.className = "tree-children";
    for (const obj of orphans) {
      const cli = document.createElement("li");
      cli.appendChild(makeObjectListButton(obj, terms, outside));
      childUl.appendChild(cli);
    }
    li.appendChild(childUl);
    ul.appendChild(li);
  }
}

function renderEnemyList() {
  const ul = document.getElementById("enemy-list");
  ul.innerHTML = "";
  enemiesByHp(doc.enemies).forEach((e) => {
    const i = doc.enemies.indexOf(e);
    const li = document.createElement("li");

    btn.textContent = `${e.name}  ${e.hp}`;
    if (i === enemyIndex) btn.className = "active";
    btn.addEventListener("click", () => {
      const prevClip = activeTimelineClip()?.name;
      enemyIndex = i;
      selectedVerts = [];
      selectedLines = [];
      pendingBind = null;
      clampFrameIndex(activeEnemy());
      const timeline = getTimeline(activeEnemy());
      if (prevClip) {
        const idx = timeline.findIndex((c) => c.name === prevClip);
        clipIndex = idx >= 0 ? idx : 0;
      } else clipIndex = 0;
      frameLocal = 0;
      applyFrameLocal();
      markUi();
      refreshAll();
    });
    li.appendChild(btn);
    ul.appendChild(li);
  });
}

/** How many placed objects (all maps) use this item. */
function itemUseCount(name) {
  let n = 0;
  for (const m of Object.values(doc.maps || {})) {
    for (const o of m.objects || []) {
      if (o.kind === "pickup" && o.pickup === name) n++;
      if (o.kind === "doorway" && o.doorType === name) n++;
    }
  }
  return n;
}

function addCustomItem() {
  let name = "new item";
  for (let n = 2; itemNameProblem(name); n++) name = `new item ${n}`;
  pushUndo();
  if (!doc.customItems) doc.customItems = [];
  doc.customItems.push(name);
  setCustomItemNames(doc.customItems);
  if (!doc.items) doc.items = {};
  doc.items[name] = { verts: [], lines: [] };
  setItemMeta(doc, name, { rotating: true, pickup: false, icon: null });
  markDirty();
  buildPalette();
  selectItemKey(name);
  setStatus(`Added item "${name}" (TH ${BUILTIN_ITEM_COUNT + doc.customItems.length - 1}). Name it in the inspector.`);
}

/**
 * Inspector name field, any item or door. Custom items are their own key (placed copies are
 * rewritten); everything else keeps its internal key and just gets a new display name.
 * Returns the name now in effect (the old one if refused).
 */
function renameItem(raw) {
  const old = itemMeshKey;
  const cur = itemLabel(old);
  const name = clampItemName(raw);
  if (name === cur) return cur;
  const bad = itemNameProblem(name, old);
  if (bad) {
    setStatus(bad, true);
    return cur;
  }
  pushUndo();
  if (!isCustomItem(old)) {
    setItemMeta(doc, old, { label: name });
    markDirty();
    buildPalette();
    refreshAll();
    setStatus(`Renamed "${cur}" to "${name}"`);
    return itemLabel(old);
  }
  doc.customItems[doc.customItems.indexOf(old)] = name;
  setCustomItemNames(doc.customItems);
  doc.items[name] = doc.items[old];
  delete doc.items[old];
  if (doc.itemMeta?.[old]) {
    doc.itemMeta[name] = doc.itemMeta[old];
    delete doc.itemMeta[old];
  }
  let moved = 0;
  for (const m of Object.values(doc.maps || {})) {
    for (const o of m.objects || []) {
      if (o.kind === "pickup" && o.pickup === old) {
        o.pickup = name;
        moved++;
      }
      if (o.kind === "doorway" && o.doorType === old) {
        o.doorType = name;
        moved++;
      }
    }
  }
  itemMeshKey = name;
  markDirty();
  buildPalette();
  persistEditorSettings();
  refreshAll();
  setStatus(`Renamed "${old}" to "${name}"${moved ? ` (${moved} placed)` : ""}`);
  return name;
}

function removeCustomItem() {
  const old = itemMeshKey;
  if (!isCustomItem(old)) return;
  const n = itemUseCount(old);
  if (n) {
    setStatus(`"${old}" is placed ${n}× in maps. Remove those objects first.`, true);
    return;
  }
  if (!window.confirm(`Remove item "${old}"?`)) return;
  pushUndo();
  doc.customItems = doc.customItems.filter((k) => k !== old);
  setCustomItemNames(doc.customItems);
  delete doc.items[old];
  if (doc.itemMeta) delete doc.itemMeta[old];
  itemMeshKey = "backpack";
  itemView.clearSelection();
  markDirty();
  buildPalette();
  persistEditorSettings();
  refreshAll();
  setStatus(`Removed item "${old}"`);
}

const iconUrlCache = new Map();

/** 8 rows of 0-f / . -> data URL (8×8 PNG). */
function iconRowsToUrl(rows) {
  const k = rows.join("|");
  const hit = iconUrlCache.get(k);
  if (hit) return hit;
  const c = document.createElement("canvas");
  c.width = ITEM_ICON_SIZE;
  c.height = ITEM_ICON_SIZE;
  const g = c.getContext("2d");
  paintIconRows(g, rows, 1);
  const url = c.toDataURL("image/png");
  iconUrlCache.set(k, url);
  return url;
}

function paintIconRows(g, rows, px) {
  for (let y = 0; y < ITEM_ICON_SIZE; y++) {
    for (let x = 0; x < ITEM_ICON_SIZE; x++) {
      const ch = rows[y][x];
      if (ch === ".") continue;
      g.fillStyle = C64_HEX[parseInt(ch, 16)];
      g.fillRect(x * px, y * px, px, px);
    }
  }
}

/** Palette icon for an item: its 8×8 icon (shipped default or edited), blank when none. */
function thingIconUrl(key) {
  return iconRowsToUrl(itemMeta(doc, key).icon ?? emptyItemIcon());
}

function setItemIcon(key, rows) {
  setItemMeta(doc, key, { icon: rows });
  markDirty();
}

function buildIconEditor(root, key) {
  const h = document.createElement("h2");
  h.textContent = "Icon";
  root.appendChild(h);
  const meta = itemMeta(doc, key);
  let rows = meta.icon ? [...meta.icon] : emptyItemIcon();
  const wrap = document.createElement("div");
  wrap.className = "icon-editor";
  const grid = document.createElement("canvas");
  const CELL = 16;
  grid.width = ITEM_ICON_SIZE * CELL;
  grid.height = ITEM_ICON_SIZE * CELL;
  grid.className = "icon-grid";
  grid.addEventListener("contextmenu", (e) => e.preventDefault());
  const prev = document.createElement("canvas");
  prev.width = ITEM_ICON_SIZE;
  prev.height = ITEM_ICON_SIZE;
  prev.className = "icon-preview";
  const sw = document.createElement("div");
  sw.className = "icon-swatches";
  const swBtns = [];

  const paint = () => {
    const g = grid.getContext("2d");
    for (let y = 0; y < ITEM_ICON_SIZE; y++) {
      for (let x = 0; x < ITEM_ICON_SIZE; x++) {
        g.fillStyle = (x + y) % 2 ? "#1c1f26" : "#242831";
        g.fillRect(x * CELL, y * CELL, CELL, CELL);
      }
    }
    paintIconRows(g, rows, CELL);
    g.strokeStyle = "rgba(255,255,255,0.12)";
    g.lineWidth = 1;
    for (let i = 0; i <= ITEM_ICON_SIZE; i++) {
      g.beginPath();
      g.moveTo(i * CELL + 0.5, 0);
      g.lineTo(i * CELL + 0.5, grid.height);
      g.moveTo(0, i * CELL + 0.5);
      g.lineTo(grid.width, i * CELL + 0.5);
      g.stroke();
    }
    const pg = prev.getContext("2d");
    pg.clearRect(0, 0, ITEM_ICON_SIZE, ITEM_ICON_SIZE);
    paintIconRows(pg, rows, 1);
  };
  const syncSwatches = () => swBtns.forEach((b, i) => b.classList.toggle("active", i === iconPaintColor));

  C64_HEX.forEach((hex, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "icon-swatch";
    b.style.background = hex;
    b.title = `C64 colour ${i}`;
    b.addEventListener("click", () => {
      iconPaintColor = i;
      syncSwatches();
    });
    swBtns.push(b);
    sw.appendChild(b);
  });
  syncSwatches();

  let painting = false;
  let eraseStroke = false;
  const applyAt = (e, erase) => {
    const r = grid.getBoundingClientRect();
    const x = Math.floor(((e.clientX - r.left) / r.width) * ITEM_ICON_SIZE);
    const y = Math.floor(((e.clientY - r.top) / r.height) * ITEM_ICON_SIZE);
    if (x < 0 || y < 0 || x >= ITEM_ICON_SIZE || y >= ITEM_ICON_SIZE) return;
    const ch = erase ? "." : iconPaintColor.toString(16);
    if (rows[y][x] === ch) return;
    rows[y] = rows[y].slice(0, x) + ch + rows[y].slice(x + 1);
    setItemIcon(key, rows);
    paint();
  };
  grid.addEventListener("pointerdown", (e) => {
    if (e.button !== 0 && e.button !== 2) return;
    e.preventDefault();
    beginUndo();
    painting = true;
    eraseStroke = e.button === 2;
    grid.setPointerCapture(e.pointerId);
    applyAt(e, eraseStroke);
  });
  grid.addEventListener("pointermove", (e) => {
    if (painting) applyAt(e, eraseStroke);
  });
  const endStroke = (e) => {
    if (!painting) return;
    painting = false;
    endUndo();
    try {
      grid.releasePointerCapture(e.pointerId);
    } catch {
      /* ignore */
    }
    buildPalette();
    renderInspector();
  };
  grid.addEventListener("pointerup", endStroke);
  grid.addEventListener("pointercancel", endStroke);

  const row = document.createElement("div");
  row.className = "btn-row";
  const mk = (label, title, fn) => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = label;
    b.title = title;
    b.addEventListener("click", fn);
    return b;
  };
  const shipped = !isCustomItem(key);
  row.append(
    mk(
      shipped ? "Reset" : "Clear",
      shipped ? "Back to the shipped icon" : "Blank the icon",
      () => {
        pushUndo();
        setItemIcon(key, emptyItemIcon());
        buildPalette();
        renderInspector();
      }
    )
  );

  const side = document.createElement("div");
  side.className = "icon-side";
  side.append(prev, row);
  wrap.append(grid, side);
  root.appendChild(wrap);
  root.appendChild(sw);
  const hint = document.createElement("p");
  hint.className = "muted";
  hint.textContent = "Left paint · right erase · shown in the Maps placement picker.";
  root.appendChild(hint);
  paint();
}

/** Flip the door flag. Placed pickups of the item (or doorways of a un-doored type) block it. */
function toggleItemDoor(key) {
  const meta = itemMeta(doc, key);
  const want = !meta.door;
  const placed = itemUseCount(key);
  if (placed) {
    setStatus(
      want
        ? `"${itemLabel(key)}" is placed ${placed}× as a pickup/prop. Remove those first.`
        : `"${itemLabel(key)}" is used by ${placed} doorway(s). Retype or remove them first.`,
      true
    );
    return;
  }
  pushUndo();
  const base = defaultItemMeta(key);
  setItemMeta(doc, key, want ? { door: true } : { door: false, rotating: base.rotating, pickup: base.pickup });
  markDirty();
  buildPalette();
  refreshAll();
  setStatus(want ? `"${itemLabel(key)}" is now a door type` : `"${itemLabel(key)}" is no longer a door type`);
}

function buildItemFlags(root, key) {
  const meta = itemMeta(doc, key);
  const custom = isCustomItem(key);
  const door = meta.door;
  const shippedDoor = DOOR_MESH_KEYS.includes(key);
  const flag = (label, active, locked, title, onToggle) => {
    const f = toggleField(label, active, onToggle);
    const b = f.querySelector("button");
    b.disabled = locked;
    f.title = title;
    b.title = title;
    return f;
  };
  root.appendChild(
    flag(
      "Door",
      door,
      shippedDoor,
      shippedDoor
        ? "Shipped door style: the game's bump crack and fallbacks use it"
        : "Door type: appears under Doors in the Maps picker and in the doorway Type list. Mesh origin = bottom-centre of the face, X across, Z out.",
      () => toggleItemDoor(key)
    )
  );
  if (door) return;
  root.appendChild(
    flag("Rotating", meta.rotating, false, "Yaw-spins in the editor and in game", () => {
      pushUndo();
      setItemMeta(doc, key, { rotating: !meta.rotating });
      markDirty();
      renderInspector();
      itemView.draw();
    })
  );
  root.appendChild(
    flag(
      "Pickup",
      meta.pickup,
      !custom,
      custom
        ? "Pickup behaviour has to exist in the asm (grant tables); custom items cannot cook as pickups yet"
        : "Built-in: fixed by the game grant tables",
      () => {
        pushUndo();
        setItemMeta(doc, key, { pickup: !meta.pickup });
        markDirty();
        renderInspector();
      }
    )
  );
  if (custom && meta.pickup) {
    const w = document.createElement("p");
    w.className = "error";
    w.textContent = "Flagged pickup: no grant behaviour in the asm, genitems.py will refuse to cook it.";
    root.appendChild(w);
  }
}
