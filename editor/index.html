      const ho = i === this.hoverVert;
      ctx.fillStyle = sel ? "#d4a017" : ho ? "#fff" : "#6ec4a8";
      const r = sel || ho ? 5 : 4;
      ctx.beginPath();
      ctx.arc(pr.sx, pr.sy, r, 0, Math.PI * 2);
      ctx.fill();
    });

    const prim = this.#selectionAnchor();
    if (prim) this.#drawGizmo(ctx, cam, w, h, prim.v);

    if (this.drag?.kind === "box") {
      const r = this.#boxRect();
      ctx.fillStyle = "rgba(212, 160, 23, 0.12)";
      ctx.fillRect(r.x0, r.y0, r.w, r.h);
      ctx.strokeStyle = "#d4a017";
      ctx.lineWidth = 1;
      ctx.setLineDash([4, 3]);
      ctx.strokeRect(r.x0 + 0.5, r.y0 + 0.5, r.w, r.h);
      ctx.setLineDash([]);
    }
  }
}


// ---- js/fontView.js ----
const FONT_INK = "#e8e4d8";
const FONT_BG = "#0a0a0c";
const FONT_GRID = "rgba(255, 255, 255, 0.09)";
const FONT_CELL_PX = 32;
const FONT_SLOT_COUNT = 4;
const FONT_DRAG_THRESHOLD = 4;
const FONT_SAMPLE = "Nebula Skip: the quick brown fox\njumps over the lazy dog 0123456789 !?";

function fontEl(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

/**
 * Font tab: overview of 96 glyphs (left), four 8x8 workspace grids (center), live text preview.
 * Glyph data lives in doc.font; this view reads it through opts.getFont() and never caches it.
 * opts: left, panel (DOM roots), getFont, beginUndo, endUndo, markDirty,
 *       onChange (inspector needs a rebuild), onUiChange (slots/active changed), onStatus.
 */
class FontView {
  constructor(opts) {
    this.opts = opts;
    this.enabled = false;
    this.slots = new Array(FONT_SLOT_COUNT).fill(null);
    this.active = 0;
    this.clip = null;
    this.stroke = null;
    this.drag = null;
    this.proportional = true;
    this.sample = FONT_SAMPLE;
    this.cells = [];
    this.slotEls = [];
    this.#buildOverview(opts.left);
    this.#buildPanel(opts.panel);
  }

  // ---- state ----

  getState() {
    return { slots: this.slots.slice(), active: this.active };
  }

  setState(s) {
    const slots = new Array(FONT_SLOT_COUNT).fill(null);
    if (Array.isArray(s?.slots)) {
      for (let i = 0; i < FONT_SLOT_COUNT; i++) {
        const c = s.slots[i];
        if (Number.isInteger(c) && c >= FONT_FIRST && c < FONT_FIRST + FONT_COUNT) slots[i] = c;
      }
    }
    this.slots = slots;
    const a = Number(s?.active) | 0;
    this.active = a >= 0 && a < FONT_SLOT_COUNT ? a : 0;
  }

  activeCode() {
    return this.slots[this.active];
  }

  hasClip() {
    return !!this.clip;
  }

  #font() {
    return this.opts.getFont();
  }

  #rowsFor(code) {
    return this.#font()[code - FONT_FIRST];
  }

  // ---- DOM ----

  #buildOverview(root) {
    root.textContent = "";
    root.append(fontEl("h2", "", "Font"));
    const grid = fontEl("div", "font-overview");
    for (let i = 0; i < FONT_COUNT; i++) {
      const code = FONT_FIRST + i;
      const btn = fontEl("button", "font-cell");
      btn.type = "button";
      btn.dataset.code = String(code);
      btn.title = `${code} · 0x${fontHex2(code)}`;
      const cv = document.createElement("canvas");
      cv.width = FONT_W;
      cv.height = FONT_H;
      btn.append(cv, fontEl("span", "font-cell-label", fontCharLabel(code)));
      grid.append(btn);
      this.cells.push({ btn, cv });
    }
    grid.addEventListener("pointerdown", (e) => this.#onCellDown(e));
    grid.addEventListener("pointermove", (e) => this.#onCellMove(e));
    grid.addEventListener("pointerup", (e) => this.#onCellUp(e, true));
    grid.addEventListener("pointercancel", (e) => this.#onCellUp(e, false));
    grid.addEventListener("contextmenu", (e) => e.preventDefault());
    root.append(grid);
    root.append(fontEl("p", "muted font-left-hint", "Drag a glyph onto a grid · click to load into the active grid"));
  }

  #buildPanel(root) {
    root.textContent = "";
    const slots = fontEl("div", "font-slots");
    for (let i = 0; i < FONT_SLOT_COUNT; i++) {
      const el = fontEl("div", "font-slot");
      const head = fontEl("div", "font-slot-head");
      const title = fontEl("span", "font-slot-title");
      const close = fontEl("button", "font-slot-x", "×");
      close.type = "button";
      close.title = "Close this grid";
      close.addEventListener("click", () => this.#closeSlot(i));
      head.append(title, close);
      const cv = document.createElement("canvas");
      cv.className = "font-grid";
      cv.width = FONT_W * FONT_CELL_PX;
      cv.height = FONT_H * FONT_CELL_PX;
      const hex = fontEl("div", "font-slot-hex muted");
      el.append(head, cv, hex);
      el.addEventListener("pointerdown", () => this.#setActive(i), true);
      cv.addEventListener("pointerdown", (e) => this.#onGridDown(e, i));
      cv.addEventListener("pointermove", (e) => this.#onGridMove(e));
      cv.addEventListener("pointerup", (e) => this.#endStroke(e));
      cv.addEventListener("pointercancel", (e) => this.#endStroke(e));
      cv.addEventListener("lostpointercapture", (e) => this.#endStroke(e));
      cv.addEventListener("contextmenu", (e) => e.preventDefault());
      cv.addEventListener("mousedown", (e) => {
        if (e.button === 1) e.preventDefault();
      });
      cv.addEventListener("auxclick", (e) => {
        if (e.button === 1) e.preventDefault();
      });
      slots.append(el);
      this.slotEls.push({ el, title, cv, hex });
    }
    root.append(slots);

    const prev = fontEl("div", "font-preview");
    const bar = fontEl("div", "font-preview-bar");
    const input = document.createElement("textarea");
    input.className = "font-preview-input";
    input.value = this.sample;
    input.rows = 3;
    input.maxLength = 600;
    input.spellcheck = false;
    input.placeholder = "Preview text (Enter = new line)";
    input.addEventListener("input", () => {
      this.sample = input.value;
      this.#drawPreview();
    });
    const prop = fontEl("button", "toggle active", "Proportional");
    prop.type = "button";
    prop.title = "Menu text: glyphs trimmed to their ink width (src/menu.asm). Off = fixed 8px.";
    prop.addEventListener("click", () => {
      this.proportional = !this.proportional;
      prop.classList.toggle("active", this.proportional);
      this.#drawPreview();
    });
    bar.append(input, prop);
    // No scrolling: the large copy picks the biggest integer scale (<= 4) that fits the panel.
    const wrap = fontEl("div", "font-preview-wrap");
    this.previewA = document.createElement("canvas");
    this.previewB = document.createElement("canvas");
    this.previewA.className = this.previewB.className = "font-preview-canvas";
    this.previewCap = fontEl("div", "font-preview-cap muted");
    wrap.append(this.previewA, this.previewCap, this.previewB);
    prev.append(bar, wrap);
    root.append(prev);
    this.previewInput = input;
    this.previewWrap = wrap;
    this.previewWidth = 0;
    new ResizeObserver(() => {
      const w = wrap.clientWidth;
      if (w === this.previewWidth) return;
      this.previewWidth = w;
      this.#drawPreview();
    }).observe(wrap);
  }

  // ---- drawing ----

  refresh() {
    if (!this.enabled) return;
    for (let i = 0; i < FONT_COUNT; i++) this.#drawCell(FONT_FIRST + i);
    for (let i = 0; i < FONT_SLOT_COUNT; i++) this.#drawSlot(i);
    this.#drawPreview();
  }

  #drawGlyphEverywhere(code) {
    this.#drawCell(code);
    for (let i = 0; i < FONT_SLOT_COUNT; i++) if (this.slots[i] === code) this.#drawSlot(i);
    this.#drawPreview();
  }

  #drawCell(code) {
    const { btn, cv } = this.cells[code - FONT_FIRST];
    const rows = this.#rowsFor(code);
    const ctx = cv.getContext("2d");
    ctx.fillStyle = FONT_BG;
    ctx.fillRect(0, 0, FONT_W, FONT_H);
    ctx.fillStyle = FONT_INK;
    for (let y = 0; y < FONT_H; y++) {
      for (let x = 0; x < FONT_W; x++) if (fontGetPixel(rows, x, y)) ctx.fillRect(x, y, 1, 1);
    }
    const inSlot = this.slots.includes(code);
    btn.classList.toggle("in-slot", inSlot);
    btn.classList.toggle("active", this.slots[this.active] === code);
    btn.classList.toggle("empty", rows.every((r) => r === 0));
  }

  #drawSlot(i) {
    const { el, title, cv, hex } = this.slotEls[i];
    const code = this.slots[i];
    el.classList.toggle("active", i === this.active);
    el.classList.toggle("empty", code == null);
    const ctx = cv.getContext("2d");
    const S = FONT_W * FONT_CELL_PX;
    ctx.fillStyle = FONT_BG;
    ctx.fillRect(0, 0, S, S);
    if (code == null) {
      title.textContent = `Grid ${i + 1}`;
      hex.textContent = "";
      this.#drawGridLines(ctx, S);
      ctx.fillStyle = "#8b91a0";
      ctx.font = "22px Segoe UI, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("drop a glyph here", S / 2, S / 2);
      return;
    }
    const rows = this.#rowsFor(code);
    ctx.fillStyle = FONT_INK;
    for (let y = 0; y < FONT_H; y++) {
      for (let x = 0; x < FONT_W; x++) {
        if (fontGetPixel(rows, x, y)) {
          ctx.fillRect(x * FONT_CELL_PX + 1, y * FONT_CELL_PX + 1, FONT_CELL_PX - 1, FONT_CELL_PX - 1);
        }
      }
    }
    this.#drawGridLines(ctx, S);
    title.textContent = `${fontCharLabel(code)}  ${code} · 0x${fontHex2(code)}`;
    hex.textContent = rows.map(fontHex2).join(" ");
  }

  #drawGridLines(ctx, S) {
    ctx.strokeStyle = FONT_GRID;
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 0; i <= FONT_W; i++) {
      const p = i * FONT_CELL_PX + 0.5;
      ctx.moveTo(p, 0);
      ctx.lineTo(p, S);
      ctx.moveTo(0, p);
      ctx.lineTo(S, p);
    }
    ctx.stroke();
  }

  #drawPreview() {
    if (!this.enabled) return;
    const font = this.#font();
    const lays = this.sample.split("\n").map((l) => fontLayoutText(font, l, this.proportional));
    const w = Math.max(1, ...lays.map((l) => l.width));
    const h = lays.length * FONT_H;
    const avail = this.previewWrap.clientWidth || w;
    const fit = Math.max(1, Math.min(4, Math.floor(avail / w)));
    this.previewCap.textContent = `${w}x${h} px · actual size above${fit > 1 ? `, ${fit}x below` : ""}`;
    this.previewB.hidden = fit === 1;
    for (const [cv, scale] of [
      [this.previewA, 1],
      [this.previewB, fit],
    ]) {
      cv.width = w;
      cv.height = h;
      cv.style.width = `${w * scale}px`;
      cv.style.aspectRatio = `${w} / ${h}`;
      const ctx = cv.getContext("2d");
      ctx.fillStyle = FONT_BG;
      ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = FONT_INK;
      lays.forEach((lay, li) => {
        const y0 = li * FONT_H;
        for (const c of lay.cells) {
          const rows = font[c.code - FONT_FIRST];
          for (let y = 0; y < FONT_H; y++) {
            for (let x = 0; x < FONT_W; x++) {
              const px = c.x + x - c.shift;
              if (px >= 0 && fontGetPixel(rows, x, y)) ctx.fillRect(px, y0 + y, 1, 1);
            }
          }
        }
      });
    }
  }

  // ---- slots ----

  #setActive(i) {
    if (this.active === i) return;
    this.active = i;
    this.opts.onUiChange?.();
    this.refresh();
    this.opts.onChange?.();
  }

  #closeSlot(i) {
    if (this.slots[i] == null) return;
    this.slots[i] = null;
    this.opts.onUiChange?.();
    this.refresh();
    this.opts.onChange?.();
  }

  loadSlot(i, code) {
    this.slots[i] = code;
    this.active = i;
    this.opts.onUiChange?.();
    this.refresh();
    this.opts.onChange?.();
  }

  // ---- overview drag ----

  #onCellDown(e) {
    if (!this.enabled || e.button !== 0) return;
    const btn = e.target.closest?.(".font-cell");
    if (!btn) return;
    e.preventDefault();
    this.drag = {
      code: Number(btn.dataset.code),
      pid: e.pointerId,
      sx: e.clientX,
      sy: e.clientY,
      moved: false,
      ghost: null,
      hover: -1,
    };
    btn.setPointerCapture(e.pointerId);
  }

  #slotAt(x, y) {
    for (let i = 0; i < FONT_SLOT_COUNT; i++) {
      const r = this.slotEls[i].el.getBoundingClientRect();
      if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) return i;
    }
    return -1;
  }

  #onCellMove(e) {
    const d = this.drag;
    if (!d || e.pointerId !== d.pid) return;
    if (!d.moved) {
      if (Math.hypot(e.clientX - d.sx, e.clientY - d.sy) < FONT_DRAG_THRESHOLD) return;
      d.moved = true;
      const ghost = fontEl("div", "font-drag-ghost");
      const cv = document.createElement("canvas");
      cv.width = FONT_W;
      cv.height = FONT_H;
      const ctx = cv.getContext("2d");
      ctx.fillStyle = FONT_BG;
      ctx.fillRect(0, 0, FONT_W, FONT_H);
      ctx.fillStyle = FONT_INK;
      const rows = this.#rowsFor(d.code);
      for (let y = 0; y < FONT_H; y++) {
        for (let x = 0; x < FONT_W; x++) if (fontGetPixel(rows, x, y)) ctx.fillRect(x, y, 1, 1);
      }
      ghost.append(cv);
      document.body.append(ghost);
      d.ghost = ghost;
      document.body.classList.add("font-dragging");
    }
    d.ghost.style.transform = `translate(${e.clientX + 10}px, ${e.clientY + 10}px)`;
    const hover = this.#slotAt(e.clientX, e.clientY);
    if (hover !== d.hover) {
      d.hover = hover;
      this.slotEls.forEach((s, i) => s.el.classList.toggle("drop", i === hover));
    }
  }

  #onCellUp(e, commit) {
    const d = this.drag;
    if (!d || e.pointerId !== d.pid) return;
    this.drag = null;
    d.ghost?.remove();
    document.body.classList.remove("font-dragging");
    this.slotEls.forEach((s) => s.el.classList.remove("drop"));
    if (!commit) return;
    if (d.moved) {
      if (d.hover >= 0) this.loadSlot(d.hover, d.code);
      return;
    }
    const existing = this.slots.indexOf(d.code);
    if (existing >= 0) this.#setActive(existing);
    else this.loadSlot(this.active, d.code);
  }

  // ---- painting ----

  #cellAt(canvas, e) {
    const r = canvas.getBoundingClientRect();
    return {
      x: Math.floor(((e.clientX - r.left) / r.width) * FONT_W),
      y: Math.floor(((e.clientY - r.top) / r.height) * FONT_H),
    };
  }

  #onGridDown(e, slot) {
    if (!this.enabled) return;
    if (e.button === 1) e.preventDefault();
    if (e.button !== 0 && e.button !== 2) return;
    const code = this.slots[slot];
    if (code == null) return;
    e.preventDefault();
    const c = this.#cellAt(e.currentTarget, e);
    this.stroke = {
      slot,
      code,
      on: e.button === 0,
      last: c,
      pid: e.pointerId,
      began: false,
    };
    e.currentTarget.setPointerCapture(e.pointerId);
    this.#paintCell(c.x, c.y);
  }

  #onGridMove(e) {
    const s = this.stroke;
    if (!s || e.pointerId !== s.pid) return;
    const c = this.#cellAt(this.slotEls[s.slot].cv, e);
    if (c.x === s.last.x && c.y === s.last.y) return;
    // Bresenham so fast drags leave no gaps.
    let x0 = s.last.x;
    let y0 = s.last.y;
    const dx = Math.abs(c.x - x0);
    const dy = -Math.abs(c.y - y0);
    const sx = x0 < c.x ? 1 : -1;
    const sy = y0 < c.y ? 1 : -1;
    let err = dx + dy;
    for (;;) {
      this.#paintCell(x0, y0);
      if (x0 === c.x && y0 === c.y) break;
      const e2 = 2 * err;
      if (e2 >= dy) {
        err += dy;
        x0 += sx;
      }
      if (e2 <= dx) {
        err += dx;
        y0 += sy;
      }
    }
    s.last = c;
  }

  #paintCell(x, y) {
    const s = this.stroke;
    if (!s || x < 0 || y < 0 || x >= FONT_W || y >= FONT_H) return;
    const rows = this.#rowsFor(s.code);
    if (fontGetPixel(rows, x, y) === s.on) return;
    if (!s.began) {
      s.began = true;
      this.opts.beginUndo();
    }
    fontSetPixel(rows, x, y, s.on);
    this.#drawGlyphEverywhere(s.code);
  }

  #endStroke(e) {
    const s = this.stroke;
    if (!s || (e && e.pointerId !== s.pid)) return;
    this.stroke = null;
    if (!s.began) return;
    this.opts.endUndo();
    this.opts.markDirty();
    this.opts.onChange?.();
  }

  // ---- glyph operations (inspector buttons, shortcuts) ----

  #editActive(fn) {
    const code = this.activeCode();
    if (code == null) return false;
    const font = this.#font();
    const idx = code - FONT_FIRST;
    const next = fn(font[idx].slice());
    if (fontRowsEqual(next, font[idx])) return false;
    this.opts.beginUndo();
    font[idx] = next;
    this.opts.endUndo();
    this.opts.markDirty();
    this.#drawGlyphEverywhere(code);
    this.opts.onChange?.();
    return true;
  }

  shiftActive(dx, dy) {
    return this.#editActive((r) => fontShift(r, dx, dy));
  }
  flipHActive() {
    return this.#editActive(fontFlipH);
  }
  flipVActive() {
    return this.#editActive(fontFlipV);
  }
  invertActive() {
    return this.#editActive(fontInvert);
  }
  clearActive() {
    return this.#editActive(() => new Array(FONT_H).fill(0));
  }

  copyActive() {
    const code = this.activeCode();
    if (code == null) return false;
    this.clip = this.#rowsFor(code).slice();
    this.opts.onStatus?.(`Copied ${fontCharLabel(code)}`);
    this.opts.onChange?.();
    return true;
  }

  pasteActive() {
    if (!this.clip) return false;
    const clip = this.clip.slice();
    return this.#editActive(() => clip);
  }

  /** Returns true when the key was a font shortcut. Caller skips text inputs. */
  handleKey(e) {
    if (e.altKey) return false;
    const mod = e.ctrlKey || e.metaKey;
    const k = e.key.toLowerCase();
    if (mod) {
      if (e.shiftKey) return false;
      if (k === "c") return this.copyActive() || true;
      if (k === "v") return this.pasteActive() || true;
      return false;
    }
    if (k >= "1" && k <= String(FONT_SLOT_COUNT)) {
      this.#setActive(Number(k) - 1);
      return true;
    }
    switch (k) {
      case "arrowleft":
        return this.shiftActive(-1, 0) || true;
      case "arrowright":
        return this.shiftActive(1, 0) || true;
      case "arrowup":
        return this.shiftActive(0, -1) || true;
      case "arrowdown":
        return this.shiftActive(0, 1) || true;
      case "h":
        return this.flipHActive() || true;
      case "v":
        return this.flipVActive() || true;
      case "i":
        return this.invertActive() || true;
      case "delete":
      case "backspace":
        return this.clearActive() || true;
      default:
        return false;
    }
  }

  // ---- PNG sheet import / export ----

  async importSheet(file, invert) {
    let bmp;
    try {
      bmp = await createImageBitmap(file, { colorSpaceConversion: "none" });
    } catch {
      this.opts.onStatus?.("Could not read that image", true);
      return;
    }
    const cv = document.createElement("canvas");
    cv.width = bmp.width;
    cv.height = bmp.height;
    const ctx = cv.getContext("2d", { willReadFrequently: true });
    ctx.drawImage(bmp, 0, 0);
    bmp.close?.();
    const res = fontFromImageData(ctx.getImageData(0, 0, cv.width, cv.height), { invert });
    if (res.error) {
      this.opts.onStatus?.(res.error, true);
      return;
    }
    const font = this.#font();
    const changed = res.glyphs.filter((g) => !fontRowsEqual(g.rows, font[g.index]));
    if (!changed.length) {
      this.opts.onStatus?.(`Imported ${res.glyphs.length} glyphs: no changes`);
      return;
    }
    this.opts.beginUndo();
    for (const g of changed) font[g.index] = g.rows.slice();
    this.opts.endUndo();
    this.opts.markDirty();
    this.refresh();
    this.opts.onChange?.();
    const nonEmpty = res.glyphs.filter((g) => !fontGlyphStats(g.rows).empty).length;
    const extra = res.ignored ? `, ${res.ignored} cells past glyph 96 ignored` : "";
    this.opts.onStatus?.(
      `Imported ${res.glyphs.length} glyphs (${nonEmpty} non-empty, ${changed.length} changed)${extra}`,
    );
  }

  exportSheet() {
    const img = fontToImageData(this.#font());
    const cv = document.createElement("canvas");
    cv.width = img.width;
    cv.height = img.height;
    cv.getContext("2d").putImageData(new ImageData(img.data, img.width, img.height), 0, 0);
    cv.toBlob((blob) => {
      if (!blob) {
        this.opts.onStatus?.("PNG export failed", true);
        return;
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "font.png";
      document.body.append(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      this.opts.onStatus?.("Exported font.png (64x96)");
    }, "image/png");
  }
}


// ---- js/buildView.js ----
const REPORT_NAME = "build-report.json";
const VARIANT_ORDER = ["a8"];
const VARIANT_LABEL = { a8: "A8" };

const panel = document.getElementById("build-panel");

/** @type {FileSystemDirectoryHandle | null} */
let dir = null;
/** @type {object | null} */
let report = null;
let missing = false;
let error = "";
let booted = false;

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text != null) node.textContent = text;
  return node;
}

function hex(n) {
  return "$" + (Number(n) >>> 0).toString(16).toUpperCase().padStart(4, "0");
}

function variantKeys(data) {
  const variants = data?.variants;
  if (!variants || typeof variants !== "object") return [];
  return VARIANT_ORDER.filter((key) => variants[key] && typeof variants[key] === "object");
}

function variantLabel(key) {
  return VARIANT_LABEL[key] || key;
}

function gamesDiffer(data) {
  const keys = variantKeys(data);
  if (keys.length < 2) return false;
  const a = data.variants[keys[0]].game || {};
  const b = data.variants[keys[1]].game || {};
  return a.load !== b.load || a.end !== b.end || a.bytes !== b.bytes || a.heap !== b.heap;
}

function fieldDiffers(data, field) {
  const keys = variantKeys(data);
  if (keys.length < 2) return false;
  const a = data.variants[keys[0]].levels || {};
  const b = data.variants[keys[1]].levels || {};
  const names = new Set([...Object.keys(a), ...Object.keys(b)]);
  for (const name of names) {
    const av = a[name]?.[field] ?? null;
    const bv = b[name]?.[field] ?? null;
    if (JSON.stringify(av) !== JSON.stringify(bv)) return true;
  }
  return false;
}

function tightestOf(levels) {
  let best = null;
  for (const [name, lv] of Object.entries(levels || {})) {
    if (lv == null || !Number.isFinite(Number(lv.slack))) continue;
    if (!best || lv.slack < best.slack) best = { name, ...lv };
  }
  return best;
}

function tightestDiffer(data) {
  const keys = variantKeys(data);
  if (keys.length < 2) return false;
  const a = tightestOf(data.variants[keys[0]].levels);
  const b = tightestOf(data.variants[keys[1]].levels);
  if (!a || !b) return a !== b;
  return a.name !== b.name || a.slack !== b.slack;
}

function slackText(slack) {
  const n = Number(slack);
  if (!Number.isFinite(n)) return "";
  if (n <= 0) return `OVER ${-n}`;
  return String(n);
}

function worstText(lv) {
  if (!lv) return "";
  const types = (lv.worst_types || []).join(", ") || "-";
  const where = lv.where || (lv.worst_room >= 0 ? `room ${lv.worst_room}` : "no enemies");
  return `${where}: ${types}`;
}

function formatTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return String(iso);
  return d.toLocaleString();
}

function addCard(parent, kicker, value, danger) {
  const card = el("div", danger ? "build-card danger" : "build-card");
  card.append(el("div", "k", kicker));
  const body = el("div", "v");
  if (typeof value === "string") body.textContent = value;
  else body.append(value);
  card.append(body);
  parent.append(card);
  return card;
}

function gameValue(game) {
  const wrap = document.createDocumentFragment();
  wrap.append(document.createTextNode(`${hex(game.load)}–${hex(game.end)}`));
  wrap.append(el("div", "sub", `${game.bytes} bytes · heap ${game.heap}`));
  return wrap;
}

function tightValue(hit) {
  if (!hit) return "—";
  return `${hit.name} · ${hit.slack <= 0 ? slackText(hit.slack) : `slack ${hit.slack}`}`;
}

function addCards(parent, data) {
  const keys = variantKeys(data);
  const splitGame = gamesDiffer(data);
  const splitTight = tightestDiffer(data);
  for (const key of keys) {
    const game = data.variants[key].game;
    if (!game) continue;
    if (!splitGame && key !== keys[0]) continue;
    addCard(parent, splitGame ? `GAME ${variantLabel(key)}` : "GAME", gameValue(game), false);
  }
  for (const key of keys) {
    if (!splitTight && key !== keys[0]) continue;
    const hit = tightestOf(data.variants[key].levels);
    addCard(
      parent,
      splitTight ? `Tightest ${variantLabel(key)}` : "Tightest",
      tightValue(hit),
      !!hit && hit.slack <= 0
    );
  }
  const disks = data.disks && typeof data.disks === "object" ? data.disks : {};
  for (const name of Object.keys(disks)) {
    const disk = disks[name];
    if (!disk || disk.free == null) continue;
    addCard(parent, name, `${disk.free} sectors free for ED/1050 disk`, Number(disk.free) <= 0);
  }
}

function fillWidth(bytes, scale) {
  return `${Math.min(100, (bytes / scale) * 100)}%`;
}

function singleBar(bytes, scale) {
  const track = el("span", "build-bar");
  const fill = el("span");
  fill.style.width = fillWidth(bytes, scale);
  track.append(fill);
  return track;
}

function stackedBar(parts, scale) {
  const track = el("span", "build-bar stack");
  for (const part of parts) {
    const bytes = Number(part.bytes) || 0;
    if (bytes <= 0) continue;
    const fill = el("span", part.cls);
    fill.style.width = fillWidth(bytes, scale);
    track.append(fill);
  }
  return track;
}

function pairText(base, other, krillOnly) {
  if (krillOnly) return `krill ${other}`;
  if (other == null || other === base) return String(base);
  return `${base} · krill ${other}`;
}

function moduleAddr(base, other, krillOnly) {
  if (krillOnly) return `${hex(other.start)}–${hex(other.end)}`;
  if (!other || (other.start === base.start && other.end === base.end)) {
    return `${hex(base.start)}–${hex(base.end)}`;
  }
  if (other.start === base.start) {
    return `${hex(base.start)}–${hex(base.end)} · krill ${hex(other.end)}`;
  }
  return `${hex(base.start)}–${hex(base.end)} · krill ${hex(other.start)}–${hex(other.end)}`;
}

function mergedByName(primary, secondary) {
  const byName = new Map((secondary || []).map((item) => [item.name, item]));
  const rows = [];
  const seen = new Set();
  for (const item of primary || []) {
    seen.add(item.name);
    rows.push({ name: item.name, base: item, other: byName.get(item.name) || null, krillOnly: false });
  }
  for (const item of secondary || []) {
    if (seen.has(item.name)) continue;
    rows.push({ name: item.name, base: null, other: item, krillOnly: true });
  }
  return rows;
}

function diskPair(disks) {
  const names = Object.keys(disks || {});
  const krillName = names.find((name) => name.includes("krill"));
  const baseName = names.find((name) => name !== krillName) || null;
  return {
    base: baseName ? disks[baseName] : null,
    krill: krillName ? disks[krillName] : null,
  };
}

function addModules(parent, data) {
  const keys = variantKeys(data);
  if (!keys.length) return;
  const primary = data.variants[keys[0]].modules || [];
  const secondary = keys[1] ? data.variants[keys[1]].modules || [] : [];
  const rows = mergedByName(primary, secondary);
  if (!rows.length) return;
  const scale = rows.reduce((n, row) => {
    const bytes = Number(row.base?.bytes ?? row.other?.bytes) || 0;
    return Math.max(n, bytes);
  }, 1);
  const section = el("section", "build-section");
  section.append(el("h2", null, "Modules"));
  const list = el("div", "build-mods");
  for (const row of rows) {
    const bytes = Number(row.base?.bytes ?? row.other?.bytes) || 0;
    const byteLabel = row.krillOnly
      ? `krill ${row.other.bytes}`
      : pairText(row.base.bytes, row.other ? row.other.bytes : null, false);
    const line = el("div", "build-mod");
    line.append(el("span", "name", row.name || ""));
    line.append(el("span", "addr", moduleAddr(row.base, row.other, row.krillOnly)));
    line.append(singleBar(bytes, scale));
    line.append(el("span", "bytes", byteLabel));
    list.append(line);
  }
  section.append(list);
  parent.append(section);
}

function levelRows(data) {
  const keys = variantKeys(data);
  const names = new Set();
  for (const key of keys) {
    for (const name of Object.keys(data.variants[key].levels || {})) names.add(name);
  }
  const rows = [...names].map((name) => {
    const cells = {};
    for (const key of keys) cells[key] = data.variants[key].levels?.[name] || null;
    return { name, cells };
  });
  rows.sort((a, b) => a.name.localeCompare(b.name));
  return rows;
}

function numCell(text, danger) {
  const td = el("td", danger ? "num danger" : "num", text);
  return td;
}

function addLevels(parent, data) {
  const keys = variantKeys(data);
  const rows = levelRows(data);
  if (!rows.length) return;
  const splitSlack = fieldDiffers(data, "slack");
  const section = el("section", "build-section");
  section.append(el("h2", null, "Levels"));
  const first = keys[0];
  const barScale = rows.reduce((n, row) => {
    const lv = row.cells[first];
    if (!lv) return n;
    return Math.max(n, (Number(lv.map_bytes) || 0) + (Number(lv.room_assets) || 0));
  }, 1);
  const table = el("table", "build-table");
  const head = el("tr");
  head.append(el("th", null, "Level"));
  head.append(el("th", "bar-cell", ""));
  if (splitSlack) {
    for (const key of keys) head.append(el("th", "num", variantLabel(key)));
  } else {
    head.append(el("th", "num", "Slack"));
  }
  head.append(el("th", null, "Worst"));
  head.append(el("th", "num", "Map"));
  head.append(el("th", "num", "Assets"));
  const thead = el("thead");
  thead.append(head);
  table.append(thead);
  const body = el("tbody");
  for (const row of rows) {
    const base = row.cells[first];
    const tr = el("tr");
    tr.append(el("td", null, row.name));
    const barCell = el("td", "bar-cell");
    if (base) {
      barCell.append(
        stackedBar(
          [
            { cls: "seg-map", bytes: base.map_bytes },
            { cls: "seg-assets", bytes: base.room_assets },
          ],
          barScale
        )
      );
    }
    tr.append(barCell);
    if (splitSlack) {
      for (const key of keys) {
        const lv = row.cells[key];
        const slack = lv ? Number(lv.slack) : NaN;
        tr.append(numCell(lv ? slackText(slack) : "", Number.isFinite(slack) && slack <= 0));
      }
    } else {
      const slack = base ? Number(base.slack) : NaN;
      tr.append(numCell(base ? slackText(slack) : "", Number.isFinite(slack) && slack <= 0));
    }
    tr.append(el("td", null, worstText(base)));
    tr.append(numCell(base ? String(base.map_bytes) : ""));
    tr.append(numCell(base ? String(base.room_assets) : ""));
    body.append(tr);
  }
  table.append(body);
  section.append(table);
  parent.append(section);
}

const SMC_NAME = /^smc_\d+$/;

/** Drop smc_N tags. They mark accessor sites, not blocks; keep their bytes on the symbol they split. */
function visibleSymbols(symbols) {
  const ordered = symbols
    .map((sym) => ({
      name: sym.name || "",
      bytes: Number(sym.bytes) || 0,
      start: Number(sym.start) || 0,
    }))
    .sort((a, b) => a.start - b.start);
  const kept = [];
  let lead = 0;
  for (const sym of ordered) {
    const parts = sym.name.split(" / ").filter((part) => part && !SMC_NAME.test(part));
    if (!parts.length) {
      if (kept.length) kept[kept.length - 1].bytes += sym.bytes;
      else lead += sym.bytes;
      continue;
    }
    kept.push({ name: parts.join(" / "), bytes: sym.bytes + lead });
    lead = 0;
  }
  kept.sort((a, b) => b.bytes - a.bytes || a.name.localeCompare(b.name));
  return kept;
}

function addAdvanced(parent, data) {
  const keys = variantKeys(data);
  const variant = keys.length ? data.variants[keys[0]] : null;
  if (!variant || typeof variant !== "object") return;
  const modules = Array.isArray(variant.modules) ? variant.modules : [];
  const section = el("section", "build-section build-advanced");
  section.append(el("h2", null, "Advanced"));
  section.append(el("p", "build-empty", "By size."));
  const hasSymbols = modules.some((mod) => Array.isArray(mod.symbols));
  if (!modules.length || !hasSymbols) {
    section.append(el("p", "build-empty", "Rebuild to list symbols."));
    parent.append(section);
    return;
  }
  const ranked = modules
    .map((mod) => ({
      name: mod.name || "",
      bytes: Number(mod.bytes) || 0,
      symbols: Array.isArray(mod.symbols) ? mod.symbols : [],
    }))
    .sort((a, b) => b.bytes - a.bytes || a.name.localeCompare(b.name));
  const scale = ranked.reduce((n, mod) => Math.max(n, mod.bytes), 1);
  const list = el("div", "build-tree");
  for (const mod of ranked) {
    const block = el("details", "build-mod-block");
    const summary = el("summary");
    summary.append(el("span", "chev"));
    summary.append(el("span", "name", mod.name));
    summary.append(el("span", "bytes", String(mod.bytes)));
    summary.append(singleBar(mod.bytes, scale));
    block.append(summary);
    const syms = visibleSymbols(mod.symbols);
    const body = el("div", "build-syms");
    for (const sym of syms) {
      const line = el("div", "build-sym");
      line.append(el("span", "name", sym.name));
      line.append(el("span", "bytes", String(sym.bytes)));
      line.append(singleBar(sym.bytes, mod.bytes || 1));
      body.append(line);
    }
    block.append(body);
    list.append(block);
  }
  section.append(list);
  parent.append(section);
}

function addBanks(parent, data) {
  const banks = Array.isArray(data.banks) ? data.banks : [];
  if (!banks.length) return;
  const section = el("section", "build-section");
  section.append(el("h2", null, "AI banks"));
  const table = el("table", "build-table");
  const head = el("tr");
  head.append(el("th", null, "Name"));
  head.append(el("th", "bar-cell", ""));
  for (const label of ["Bank", "Code", "Pose"]) head.append(el("th", "num", label));
  const thead = el("thead");
  thead.append(head);
  table.append(thead);
  const scale = banks.reduce((n, bank) => Math.max(n, Number(bank.bank) || 0), 1);
  const body = el("tbody");
  for (const bank of banks) {
    const size = Number(bank.bank) || 0;
    const tr = el("tr");
    tr.append(el("td", null, bank.name || ""));
    const barCell = el("td", "bar-cell");
    barCell.append(
      stackedBar(
        [
          { cls: "seg-code", bytes: bank.code },
          { cls: "seg-pose", bytes: bank.pose },
          { cls: "seg-reloc", bytes: (Number(bank.reloc) || 0) * 2 },
          { cls: "seg-sites", bytes: (Number(bank.map) || 0) * 2 },
        ],
        scale
      )
    );
    tr.append(barCell);
    tr.append(numCell(String(size)));
    tr.append(numCell(String(bank.code ?? "")));
    tr.append(numCell(String(bank.pose ?? "")));
    body.append(tr);
  }
  table.append(body);
  section.append(table);
  parent.append(section);
}

function addDisks(parent, data) {
  const disks = data.disks && typeof data.disks === "object" ? data.disks : null;
  if (!disks || !Object.keys(disks).length) return;
  const { base, krill } = diskPair(disks);
  const rows = mergedByName(base?.files, krill?.files);
  if (!rows.length && base?.free == null && krill?.free == null) return;
  const scale = rows.reduce((n, row) => {
    const a = Number(row.base?.blocks) || 0;
    const b = Number(row.other?.blocks) || 0;
    return Math.max(n, a, b);
  }, 1);
  const section = el("section", "build-section");
  const free = base?.free ?? krill?.free;
  section.append(
    el("h2", null, free == null ? "Disk" : `${free} sectors free for ED/1050 disk`)
  );
  const list = el("div", "build-mods");
  for (const row of rows) {
    const blocks = Math.max(Number(row.base?.blocks) || 0, Number(row.other?.blocks) || 0);
    const label = row.krillOnly
      ? `krill ${row.other.blocks}`
      : pairText(row.base.blocks, row.other ? row.other.blocks : null, false);
    const line = el("div", "build-mod short");
    line.append(el("span", "name", row.name || ""));
    line.append(singleBar(blocks, scale));
    line.append(el("span", "bytes", label));
    list.append(line);
  }
  section.append(list);
  parent.append(section);
}

function render() {
  if (!panel) return;
  panel.replaceChildren();
  const bar = el("div", "build-toolbar");
  const open = el("button", null, "Open repo");
  open.type = "button";
  open.id = "btn-build-open";
  const reloadBtn = el("button", null, "Reload");
  reloadBtn.type = "button";
  reloadBtn.id = "btn-build-reload";
  bar.append(open, reloadBtn);
  const meta = [];
  const folder = repoFolderName();
  if (folder) meta.push(folder);
  if (report?.time) meta.push(formatTime(report.time));
  if (meta.length) bar.append(el("span", "build-meta", meta.join(" · ")));
  panel.append(bar);

  if (!dir) {
    panel.append(el("p", "build-empty", "Open the repo folder to read build-report.json."));
    return;
  }
  if (error) {
    panel.append(el("p", "build-fail", error));
    return;
  }
  if (missing || !report) {
    panel.append(
      el(
        "p",
        "build-empty",
        `No ${REPORT_NAME} in ${folder || "the repo"}. Run the build, then reload.`
      )
    );
    return;
  }
  if (report.ok === false) {
    const step = report.step ? ` during ${report.step}` : "";
    panel.append(el("p", "build-fail", `Build failed${step}`));
  }
  const keys = variantKeys(report);
  const hasDisks = report.disks && Object.keys(report.disks).length;
  const hasBanks = Array.isArray(report.banks) && report.banks.length;
  if (!keys.length && !hasDisks && !hasBanks) {
    panel.append(el("p", "build-empty", "No completed build in this report."));
    return;
  }
  const cards = el("div", "build-cards");
  addCards(cards, report);
  if (cards.childElementCount) panel.append(cards);
  const split = el("div", "build-cols");
  addModules(split, report);
  addDisks(split, report);
  if (split.childElementCount) panel.append(split);
  const tables = el("div", "build-cols");
  addLevels(tables, report);
  addBanks(tables, report);
  if (tables.childElementCount) panel.append(tables);
  addAdvanced(panel, report);
}

async function reload() {
  if (!dir) {
    report = null;
    missing = false;
    error = "";
    render();
    return;
  }
  try {
    const text = await readRepoFile(dir, REPORT_NAME);
    if (text == null) {
      report = null;
      missing = true;
      error = "";
    } else {
      report = JSON.parse(text);
      missing = false;
      error = "";
    }
  } catch (e) {
    report = null;
    missing = false;
    error = e.message || String(e);
  }
  render();
}

async function openRepo() {
  try {
    const handle = await pickRepoDirectory();
    if (!handle) return;
    dir = handle;
    await reload();
  } catch (e) {
    error = e.message || String(e);
    report = null;
    missing = false;
    render();
  }
}

if (panel) {
  panel.addEventListener("click", (e) => {
    const id = e.target?.id;
    if (id === "btn-build-open") void openRepo();
    else if (id === "btn-build-reload") void reload();
  });
}

function showBuildView() {
  if (!booted) {
    booted = true;
    void (async () => {
      try {
        dir = await tryRestoreRepoDir();
      } catch {
        dir = null;
      }
      if (dir) await reload();
      else render();
    })();
    return;
  }
  render();
}


// ---- js/wadSprites.js ----
/** DOOM picture and sprite-rotation index. */

const PREFIXES = ["POSS", "TROO", "SARG", "BOSS"];

function u16(b, o) {
  return b[o] | (b[o + 1] << 8);
}
function u32(b, o) {
  return (b[o] | (b[o + 1] << 8) | (b[o + 2] << 16) | (b[o + 3] << 24)) >>> 0;
}
function i16(b, o) {
  const v = u16(b, o);
  return v & 0x8000 ? v - 0x10000 : v;
}

function lumpName(b, o) {
  let s = "";
  for (let i = 0; i < 8; i++) {
    const c = b[o + i];
    if (!c) break;
    s += String.fromCharCode(c);
  }
  return s.toUpperCase();
}

function decodePatch(blob, pos, size) {
  const width = i16(blob, pos);
  const height = i16(blob, pos + 2);
  const left = i16(blob, pos + 4);
  const top = i16(blob, pos + 6);
  if (width <= 0 || height <= 0 || width > 512 || height > 512) {
    throw new Error("bad doom patch");
  }
  const index = new Uint8Array(width * height);
  index.fill(255);
  for (let x = 0; x < width; x++) {
    let p = pos + u32(blob, pos + 8 + x * 4);
    const end = pos + size;
    while (p < end) {
      const topdelta = blob[p];
      p += 1;
      if (topdelta === 255) break;
      const length = blob[p];
      p += 2;
      for (let i = 0; i < length; i++) {
        const y = topdelta + i;
        if (y >= 0 && y < height && p < end) index[y * width + x] = blob[p];
        p += 1;
      }
      p += 1;
    }
  }
  return { width, height, left, top, index };
}

function install(rot, prefix, frame, rotation, flip, lump) {
  if (rotation === 0) {
    for (let r = 1; r <= 8; r++) {
      const key = prefix + frame + r;
      if (!rot.has(key)) rot.set(key, { lump, flip: false });
    }
    return;
  }
  if (rotation < 1 || rotation > 8) return;
  const key = prefix + frame + rotation;
  if (!rot.has(key)) rot.set(key, { lump, flip });
}

/** Pictures between S_START and S_END, rotations for the four monsters. */
function loadDoomSprites(buffer) {
  const blob = new Uint8Array(buffer);
  const ident = String.fromCharCode(blob[0], blob[1], blob[2], blob[3]);
  if (ident !== "IWAD" && ident !== "PWAD") throw new Error("DOOM.WAD is not a WAD");
  const numlumps = u32(blob, 4);
  const dirofs = u32(blob, 8);
  const lumps = [];
  for (let i = 0; i < numlumps; i++) {
    const o = dirofs + i * 16;
    lumps.push({
      pos: u32(blob, o),
      size: u32(blob, o + 4),
      name: lumpName(blob, o + 8),
    });
  }
  let palPos = -1;
  let s0 = -1;
  let s1 = lumps.length;
  for (let i = 0; i < lumps.length; i++) {
    const name = lumps[i].name;
    if (name === "PLAYPAL" && palPos < 0) palPos = lumps[i].pos;
    if ((name === "S_START" || name === "SS_START") && s0 < 0) s0 = i;
    if ((name === "S_END" || name === "SS_END") && s0 >= 0 && i > s0) {
      s1 = i;
      break;
    }
  }
  if (palPos < 0) throw new Error("DOOM.WAD has no PLAYPAL");
  const palette = blob.subarray(palPos, palPos + 768);
  const byName = new Map();
  const rot = new Map();
  const letters = new Map();
  for (const prefix of PREFIXES) letters.set(prefix, []);
  if (s0 >= 0) {
    for (let i = s0 + 1; i < s1; i++) {
      const lump = lumps[i];
      const name = lump.name;
      if (name.length < 6) continue;
      byName.set(name, lump);
      const prefix = name.slice(0, 4);
      if (!letters.has(prefix)) continue;
      const frame = name[4];
      const rotation = name.charCodeAt(5) - 48;
      install(rot, prefix, frame, rotation, false, name);
      if (name.length >= 8) {
        const frame2 = name[6];
        const rot2 = name.charCodeAt(7) - 48;
        install(rot, prefix, frame2, rot2, true, name);
      }
      const list = letters.get(prefix);
      if (!list.includes(frame)) list.push(frame);
      if (name.length >= 8 && !list.includes(name[6])) list.push(name[6]);
    }
  }
  for (const list of letters.values()) list.sort();
  const cache = new Map();
  return { blob, palette, byName, rot, letters, cache };
}

function spriteLetters(pack, prefix) {
  if (!pack) return [];
  return pack.letters.get(prefix) || [];
}

function canvasFor(pack, lumpName) {
  let canvas = pack.cache.get(lumpName);
  if (canvas) return canvas;
  const lump = pack.byName.get(lumpName);
  if (!lump) return null;
  const pic = decodePatch(pack.blob, lump.pos, lump.size);
  canvas = document.createElement("canvas");
  canvas.width = pic.width;
  canvas.height = pic.height;
  const ctx = canvas.getContext("2d");
  const img = ctx.createImageData(pic.width, pic.height);
  const pal = pack.palette;
  for (let i = 0; i < pic.index.length; i++) {
    const c = pic.index[i];
    const o = i * 4;
    if (c === 255) {
      img.data[o + 3] = 0;
      continue;
    }
    img.data[o] = pal[c * 3];
    img.data[o + 1] = pal[c * 3 + 1];
    img.data[o + 2] = pal[c * 3 + 2];
    img.data[o + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  canvas._left = pic.left;
  canvas._top = pic.top;
  pack.cache.set(lumpName, canvas);
  return canvas;
}

/** Rotation 1 is front. Rotation 7 is the left side, or a mirror of 3. */
function spriteHit(pack, prefix, letter, rot) {
  if (!pack || !prefix || !letter) return null;
  const hit = pack.rot.get(prefix + letter + String(rot));
  if (!hit) return null;
  const canvas = canvasFor(pack, hit.lump);
  if (!canvas) return null;
  return { canvas, flip: hit.flip, left: canvas._left, top: canvas._top };
}


// ---- js/stickOrtho.js ----
/** Orthographic stick pane. Front edits X/Y. Left edits Z/Y. */

const STICK_GROUND_Y = 0.72;

const HIT = 8;

function clampCoord(v, lim) {
  const n = Math.round(v);
  if (n < -lim) return -lim;
  if (n > lim) return lim;
  return n;
}

class StickOrtho {
  constructor(canvas, opts) {
    this.canvas = canvas;
    this.ctx = canvas.getContext("2d");
    this.opts = opts;
    this.drag = null;
    this.px = 4;
    this.panX = 0;
    this.panY = 0;
    this.enabled = false;
    canvas.addEventListener("pointerdown", (e) => this.#onDown(e));
    canvas.addEventListener("pointermove", (e) => this.#onMove(e));
    canvas.addEventListener("pointerup", (e) => this.#onUp(e));
    canvas.addEventListener("pointerleave", (e) => this.#onUp(e));
    canvas.addEventListener("wheel", (e) => this.#onWheel(e), { passive: false });
    canvas.addEventListener("contextmenu", (e) => e.preventDefault());
    canvas.addEventListener("mousedown", (e) => {
      if (e.button === 1) e.preventDefault();
    });
  }

  resize() {
    if (!this.enabled) return;
    const rect = this.canvas.getBoundingClientRect();
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const w = Math.max(32, Math.floor(rect.width));
    const h = Math.max(32, Math.floor(rect.height));
    this.canvas.width = Math.floor(w * dpr);
    this.canvas.height = Math.floor(h * dpr);
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    this.cssW = w;
    this.cssH = h;
    this.draw();
  }

  #enemy() {
    return this.opts.getEnemy?.() || null;
  }

  #verts() {
    const e = this.#enemy();
    const fi = this.opts.getFrame?.() ?? 0;
    return e?.frames?.[fi] || null;
  }

  #groundPan() {
    return this.opts.getGroundPan?.() ?? this.panY;
  }

  #origin() {
    return {
      x: this.cssW * 0.5 + this.panX,
      y: this.cssH * STICK_GROUND_Y + this.#groundPan(),
    };
  }

  // Front looks along -Z, so screen-right is -X, matching the perspective camera.
  // Left looks along +X (180° from the old right view), so screen-right is -Z.
  #sign() {
    return -1;
  }

  #toScreen(v) {
    const o = this.#origin();
    const horiz = this.opts.horiz === "z" ? v.z : v.x;
    return { x: o.x + this.#sign() * horiz * this.px, y: o.y - v.y * this.px };
  }

  #eventPos(e) {
    const rect = this.canvas.getBoundingClientRect();
    return {
      x: ((e.clientX - rect.left) / rect.width) * this.cssW,
      y: ((e.clientY - rect.top) / rect.height) * this.cssH,
    };
  }

  #hitVert(sx, sy) {
    const verts = this.#verts();
    if (!verts) return -1;
    let best = -1;
    let bestD = HIT * HIT;
    for (let i = 0; i < verts.length; i++) {
      const p = this.#toScreen(verts[i]);
      const d = (p.x - sx) ** 2 + (p.y - sy) ** 2;
      if (d <= bestD) {
        bestD = d;
        best = i;
      }
    }
    return best;
  }

  #onDown(e) {
    if (!this.enabled) return;
    const p = this.#eventPos(e);
    if (e.button === 1 || e.button === 2) {
      this.drag = { kind: "pan", x: p.x, y: p.y, panX: this.panX, panY: this.#groundPan() };
      this.canvas.setPointerCapture(e.pointerId);
      return;
    }
    if (e.button !== 0) return;
    if (this.opts.showWire?.() === false) return;
    const hit = this.#hitVert(p.x, p.y);
    if (hit < 0) return;
    const selected = this.opts.getSelected?.() || [];
    const next = e.shiftKey
      ? selected.includes(hit)
        ? selected.filter((i) => i !== hit)
        : [...selected, hit]
      : selected.includes(hit)
        ? selected
        : [hit];
    this.opts.onSelect?.(next);
    const verts = this.#verts();
    this.drag = {
      kind: "vert",
      x: p.x,
      y: p.y,
      indices: next.slice(),
      start: next.map((i) => ({ ...verts[i] })),
      undo: false,
    };
    this.canvas.setPointerCapture(e.pointerId);
  }

  #onMove(e) {
    if (!this.drag) return;
    const p = this.#eventPos(e);
    if (this.drag.kind === "pan") {
      this.panX = this.drag.panX + (p.x - this.drag.x);
      const panY = this.drag.panY + (p.y - this.drag.y);
      if (this.opts.setGroundPan) this.opts.setGroundPan(panY);
      else this.panY = panY;
      this.draw();
      return;
    }
    if (!this.drag.undo) {
      this.opts.beginUndo?.();
      this.drag.undo = true;
    }
    const verts = this.#verts();
    const lim = this.opts.vertLimit?.() ?? 127;
    const quant = this.opts.clampVert;
    const du = (p.x - this.drag.x) / this.px;
    const dy = (this.drag.y - p.y) / this.px;
    const horiz = this.opts.horiz === "z" ? "z" : "x";
    const sign = this.#sign();
    this.drag.indices.forEach((i, n) => {
      const src = this.drag.start[n];
      if (!src || !verts[i]) return;
      const x = src[horiz] + sign * du;
      const y = src.y + dy;
      verts[i][horiz] = quant ? quant(x) : clampCoord(x, lim);
      verts[i].y = quant ? quant(y) : clampCoord(y, lim);
    });
    this.draw();
    this.opts.onPose?.();
  }

  #onUp(e) {
    if (!this.drag) return;
    if (this.drag.undo) this.opts.endUndo?.();
    this.drag = null;
    if (this.canvas.hasPointerCapture?.(e.pointerId)) this.canvas.releasePointerCapture(e.pointerId);
    this.opts.onPose?.();
  }

  setScale(px) {
    this.px = Math.max(0.05, Math.min(800, px));
  }

  #onWheel(e) {
    if (!this.enabled) return;
    e.preventDefault();
    this.opts.onZoom?.(e.deltaY > 0 ? 1.1 : 1 / 1.1);
  }

  draw() {
    if (!this.enabled) return;
    const ctx = this.ctx;
    const w = this.cssW;
    const h = this.cssH;
    if (!w || !h) return;
    ctx.fillStyle = "#0a0a0c";
    ctx.fillRect(0, 0, w, h);
    const e = this.#enemy();
    const verts = this.#verts();
    const o = this.#origin();
    const sprite = this.opts.getSprite?.();
    const scale = this.opts.spriteScale?.() ?? 1;
    if (sprite?.canvas) {
      const k = scale * this.px;
      const dw = sprite.canvas.width * k;
      const dh = sprite.canvas.height * k;
      const left = sprite.flip ? sprite.canvas.width - sprite.left : sprite.left;
      const dx = o.x - left * k;
      const dy = o.y - sprite.top * k;
      ctx.save();
      ctx.imageSmoothingEnabled = false;
      ctx.globalAlpha = 0.85;
      if (sprite.flip) {
        ctx.translate(dx + dw, dy);
        ctx.scale(-1, 1);
        ctx.drawImage(sprite.canvas, 0, 0, dw, dh);
      } else {
        ctx.drawImage(sprite.canvas, dx, dy, dw, dh);
      }
      ctx.restore();
    }
    if (!verts || this.opts.showWire?.() === false) return;
    const selected = new Set(this.opts.getSelected?.() || []);
    ctx.lineWidth = 1.5;
    for (const [a, b] of e.lines || []) {
      const pa = verts[a];
      const pb = verts[b];
      if (!pa || !pb) continue;
      const sa = this.#toScreen(pa);
      const sb = this.#toScreen(pb);
      ctx.strokeStyle = "#9ab";
      ctx.beginPath();
      ctx.moveTo(sa.x, sa.y);
      ctx.lineTo(sb.x, sb.y);
      ctx.stroke();
    }
    for (let i = 0; i < verts.length; i++) {
      const p = this.#toScreen(verts[i]);
      ctx.fillStyle = selected.has(i) ? "#fc6" : "#eee";
      ctx.beginPath();
      ctx.arc(p.x, p.y, selected.has(i) ? 4.5 : 3, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

function orthoSprite(rot) {
  const e = activeEnemy();
  if (!enemyHasSprites(e)) return null;
  const prefix = DOOM_SPRITE_PREFIX[e.name];
  const clip = clipForFrame(e.clips, frameIndex);
  const letter = clip?.sprites?.[frameIndex - clip.start];
  if (!prefix || !letter) return null;
  const hit = spriteHit(doomSprites, prefix, letter, rot);
  if (!hit) return null;
  // Side lumps are the left-side photo. Doom stores that view as the mirror.
  if (rot === 7) return { ...hit, flip: !hit.flip };
  return hit;
}

function syncVertXyz() {
  const row = document.querySelector("#right-editors .vert-xyz");
  if (!row) return;
  const e = activeEnemy();
  if (!e || selectedVerts.length !== 1) return;
  const v = e.frames[frameIndex]?.[selectedVerts[0]];
  if (!v) return;
  for (const axis of ["x", "y", "z"]) {
    const inp = row.querySelector(`input[data-axis="${axis}"]`);
    if (!inp || document.activeElement === inp) continue;
    const next = String(v[axis]);
    if (inp.value !== next) inp.value = next;
  }
}

function mdlRigBackupRaw() {
  try {
    const raw = JSON.parse(localStorage.getItem(MDL_RIG_BACKUP_KEY) || "null");
    return raw && typeof raw === "object" ? raw : null;
  } catch {
    return null;
  }
}

function persistMdlRigBackup() {
  const out = { ...(mdlRigBackupRaw() || {}) };
  for (const e of doc.enemies || []) {
    const jv = e.mdlRig?.jointVerts;
    if (!Array.isArray(jv) || !jv.some((list) => list.length)) {
      delete out[e.name];
      continue;
    }
    out[e.name] = jv.map((list) => [...list]);
  }
  try {
    if (!Object.keys(out).length) localStorage.removeItem(MDL_RIG_BACKUP_KEY);
    else localStorage.setItem(MDL_RIG_BACKUP_KEY, JSON.stringify(out));
  } catch {
    /* private mode / quota */
  }
}

/** Fill empty in-memory rigs from localStorage (survives refresh without doc reload). */
function restoreMdlRigBackup() {
  const raw = mdlRigBackupRaw();
  if (!raw) return false;
  let changed = false;
  for (const e of doc.enemies || []) {
    const jv = e.mdlRig?.jointVerts;
    if (Array.isArray(jv) && jv.some((list) => list.length)) continue;
    const saved = raw[e.name];
    if (!Array.isArray(saved)) continue;
    e.mdlRig = normalizeMdlRig({ jointVerts: saved }, saved.length);
    changed = true;
  }
  return changed;
}

function clearAutosaveTimer() {
  if (autosaveTimer) {
    clearTimeout(autosaveTimer);
    autosaveTimer = null;
  }
}

function isEditingField(el = document.activeElement) {
  return (
    el instanceof HTMLInputElement ||
    el instanceof HTMLTextAreaElement ||
    el instanceof HTMLSelectElement ||
    !!el?.isContentEditable
  );
}

function scheduleAutosave() {
  clearAutosaveTimer();
  if (!dirty || isEditingField()) return;
  autosaveTimer = setTimeout(() => {
    autosaveTimer = null;
    void runAutosave();
  }, AUTOSAVE_MS);
}

async function runAutosave() {
  if (!dirty || saving || !hasDocFileHandle()) return;
  if (isEditingField()) {
    scheduleAutosave();
    return;
  }
  await saveNow("Autosaved");
}

document.addEventListener("focusin", (e) => {
  if (isEditingField(e.target)) clearAutosaveTimer();
});
document.addEventListener("focusout", () => {
  requestAnimationFrame(() => {
    if (dirty && !isEditingField()) scheduleAutosave();
  });
});

function markUi() {
  if (applyingEditor || !editorSettingsReady) return;
  schedulePersistEditor();
}

/** Per-map layout cameras (MAPA …). */
let layoutCamerasByLevel = {};

function snapshotLayoutCamera() {
  const cam = layoutView.camera;
  return {
    x: cam.x,
    y: cam.y,
    z: cam.z,
    yaw: cam.yaw,
    pitch: cam.pitch,
    speed: cam.speed,
  };
}

function applyLayoutCamera(cam) {
  const c = layoutView.camera;
  c.x = cam.x;
  c.y = cam.y;
  c.z = cam.z;
  c.yaw = cam.yaw;
  c.pitch = cam.pitch;
  c.speed = cam.speed;
}

function defaultLayoutCamera() {
  return parseEditorState(null).layoutCamera;
}

function mergeLayoutCamerasFromEditor(ed) {
  layoutCamerasByLevel = { ...(ed.layoutCameras || {}) };
  const level =
    ed.activeLevel && LEVEL_NAMES.includes(ed.activeLevel) ? ed.activeLevel : doc.activeLevel;
  if (ed.layoutCamera && !layoutCamerasByLevel[level]) {
    layoutCamerasByLevel[level] = { ...ed.layoutCamera };
  }
}

function restoreLayoutCameraForLevel(level) {
  applyLayoutCamera(layoutCamerasByLevel[level] || defaultLayoutCamera());
}

function collectEditorState() {
  layoutCamerasByLevel[doc.activeLevel] = snapshotLayoutCamera();
  const cam = layoutCamerasByLevel[doc.activeLevel];
  const orb = animView.orbit;
  const iorb = itemView.orbit;
  const enemy = doc.enemies[enemyIndex];
  return parseEditorState({
    mode: editorMode,
    localDraw,
    neighbourDraw,
    roomsOnlyDraw,
    selectedIds: [...selectedIds],
    enemy: enemy?.name || "Possessed",
    frameIndex,
    clipIndex,
    frameLocal,
    selectedVerts: [...selectedVerts],
    layoutCamera: { ...cam },
    layoutCameras: { ...layoutCamerasByLevel },
    animOrbit: { yaw: orb.yaw, pitch: orb.pitch, dist: orb.dist },
    mdlScale,
    overlayOn,
    orthoMode: overheadView.mode,
    collapsedRooms: [...collapsedRooms],
    activeLevel: doc.activeLevel,
    item: itemMeshKey,
    itemOrbit: {
      yaw: iorb.yaw,
      pitch: iorb.pitch,
      dist: iorb.dist,
      target: { x: iorb.target.x, y: iorb.target.y, z: iorb.target.z },
    },
    fontSlots: fontView.getState().slots,
    fontActive: fontView.getState().active,
  });
}

function persistEditorSettings() {
  if (!editorSettingsReady) return;
  if (editorSaveRaf) {
    cancelAnimationFrame(editorSaveRaf);
    editorSaveRaf = 0;
  }
  saveEditorSettings(docFileName(), collectEditorState());
}

function schedulePersistEditor() {
  if (!editorSettingsReady || applyingEditor) return;
  if (editorSaveRaf) return;
  editorSaveRaf = requestAnimationFrame(() => {
    editorSaveRaf = 0;
    persistEditorSettings();
  });
}

function applyEditorState(ed) {
  ed = parseEditorState(ed);
  applyingEditor = true;
  try {
    mergeLayoutCamerasFromEditor(ed);
    if (ed.activeLevel && LEVEL_NAMES.includes(ed.activeLevel)) doc.activeLevel = ed.activeLevel;
    restoreLayoutCameraForLevel(doc.activeLevel);
    const orb = animView.orbit;
    orb.yaw = ed.animOrbit.yaw;
    orb.pitch = ed.animOrbit.pitch;
    orb.dist = ed.animOrbit.dist;
    syncStickScale();
    const ei = doc.enemies.findIndex((e) => e.name === ed.enemy);
    enemyIndex = ei >= 0 ? ei : 0;
    frameIndex = ed.frameIndex;
    clampFrameIndex(activeEnemy());
    syncClipFromFrameIndex(activeEnemy());
    const have = new Set(activeMap(doc).objects.map((o) => o.id));
    selectedIds = ed.selectedIds.filter((id) => have.has(id));
    rememberSelectedRoom();
    selectedVerts = [...ed.selectedVerts];
    setMdlScale(ed.mdlScale);
    setOverlayOn(ed.overlayOn);
    setOrthoMode(ed.orthoMode);
    collapsedRooms.clear();
    for (const id of ed.collapsedRooms) collapsedRooms.add(id);
    itemMeshKey = allMeshKeys().includes(ed.item) ? ed.item : "backpack";
    const iorb = itemView.orbit;
    iorb.yaw = ed.itemOrbit.yaw;
    iorb.pitch = ed.itemOrbit.pitch;
    iorb.dist = ed.itemOrbit.dist;
    iorb.target.x = ed.itemOrbit.target.x;
    iorb.target.y = ed.itemOrbit.target.y;
    iorb.target.z = ed.itemOrbit.target.z;
    fontView.setState({ slots: ed.fontSlots, active: ed.fontActive });
    setNeighbourDraw(ed.neighbourDraw, false);
    setRoomsOnlyDraw(ed.roomsOnlyDraw, false);
    setDrawMode(ed.localDraw);
    setMode(ed.mode);
  } finally {
    applyingEditor = false;
  }
}

async function saveNow(okMsg = "Saved") {
  if (saving) return;
  if (!hasDocFileHandle()) {
    showFileAccessGate(await getStoredProjectDir());
    setStatus("Open the NebulaSkip folder to save editor/nebula.json", true);
    return;
  }
  saving = true;
  try {
    persistEditorSettings();
    const payload = gameDocument(doc);
    const how = await saveDocJSON(payload);
    if (!how) {
      setStatus("Save cancelled", true);
      return;
    }
    await writeEnemyFiles(enemyFileRecords(doc));
    const mapRecords = mapFileRecords(doc);
    await writeMapFiles(mapRecords);
    if (!fontFileBlocked) await writeFontFile(fontToJson(doc.font));
    markClean();
    persistMdlRigBackup();
    if (mapRecords.namesFilled) refreshAll();
    else if (mapRecords.tagsFilled) renderInspector();
    setStatus(`${okMsg} ${docFileName()}`);
  } catch (err) {
    setStatus(String(err.message || err), true);
    scheduleAutosave();
  } finally {
    saving = false;
  }
}

function snapshot() {
  return JSON.stringify({
    version: doc.version,
    activeLevel: doc.activeLevel,
    maps: doc.maps,
    enemies: doc.enemies,
    items: doc.items,
    customItems: doc.customItems,
    itemMeta: doc.itemMeta,
    font: doc.font,
  });
}

function beginUndo() {
  if (undoGesture) return;
  undoStack.push(snapshot());
  if (undoStack.length > UNDO_LIMIT) undoStack.shift();
  redoStack.length = 0;
  undoGesture = true;
  updateUndoButtons();
}

function endUndo() {
  undoGesture = false;
}

function pushUndo() {
  beginUndo();
  endUndo();
}

function restore(json) {
  doc = normalizeDocument(JSON.parse(json));
  if (!allMeshKeys().includes(itemMeshKey)) itemMeshKey = "backpack";
  deriveAllEnemyFrames();
  const have = new Set(activeMap(doc).objects.map((o) => o.id));
  selectedIds = selectedIds.filter((id) => have.has(id));
  selectedVerts = selectedVerts.filter((i) => i >= 0 && i < stickCount(activeEnemy()));
  selectedLines = selectedLines.filter((i) => i >= 0 && i < (activeEnemy()?.lines.length || 0));
  if (enemyIndex >= doc.enemies.length) enemyIndex = 0;
  clampFrameIndex(activeEnemy());
  syncClipFromFrameIndex(activeEnemy());
  markDirty();
  buildPalette();
  refreshAll();
}

function clearUndoHistory() {
  undoStack.length = 0;
  redoStack.length = 0;
  undoGesture = false;
  updateUndoButtons();
}

function undo() {
  if (!undoStack.length) return;
  endUndo();
  redoStack.push(snapshot());
  restore(undoStack.pop());
  updateUndoButtons();
}

function redo() {
  if (!redoStack.length) return;
  undoStack.push(snapshot());
  restore(redoStack.pop());
  updateUndoButtons();
}

function updateUndoButtons() {
  btnUndo.disabled = undoStack.length === 0;
  btnRedo.disabled = redoStack.length === 0;
}

function activeEnemy() {
  return doc.enemies[enemyIndex];
}

function stickClipFor(e, clip) {
  if (!clip || !e?.clips?.length || !e.frames?.length) return null;
  const stick = e.clips.find((c) => c.name === clip.name);
  if (!stick) return null;
  const start = stick.start | 0;
  const len = stick.len | 0;
  if (start < 0 || len < 1 || start + len > e.frames.length) return null;
  if (!e.frames[start]?.length) return null;
  return stick;
}

function attackCueLabel(cue) {
  return ENEMY_CUE_LABELS[cue];
}

function renderClipSoundFields(root, e, clip) {
  const stick = stickClipFor(e, clip);
  if (!stick) return;
  const sel = document.createElement("select");
  const none = document.createElement("option");
  none.value = "";
  none.textContent = "(none)";
  sel.appendChild(none);
  for (const cue of ENEMY_ATTACK_CUES) {
    const o = document.createElement("option");
    o.value = cue;
    o.textContent = attackCueLabel(cue);
    sel.appendChild(o);
  }
  sel.value = ENEMY_ATTACK_CUES.includes(stick.sound) ? stick.sound : "";
  sel.addEventListener("change", () => {
    pushUndo();
    const next = withClipSound({ name: stick.name, start: stick.start, len: stick.len }, {
      sound: sel.value,
      soundFrame: stick.soundFrame,
    });
    stick.sound = next.sound;
    stick.soundFrame = next.soundFrame;
    if (!next.sound) {
      delete stick.sound;
      delete stick.soundFrame;
    }
    markDirty();
    refreshAll();
  });
  root.appendChild(field("Attack cue", sel));
  const fr = document.createElement("input");
  fr.type = "number";
  fr.min = "0";
  fr.max = String(Math.max(0, stick.len - 1));
  fr.step = "1";
  fr.value = String(stick.sound ? stick.soundFrame | 0 : 0);
  fr.disabled = !stick.sound;
  fr.addEventListener("change", () => {
    if (!stick.sound) return;
    pushUndo();
    const next = withClipSound(stick, { sound: stick.sound, soundFrame: fr.value });
    stick.soundFrame = next.soundFrame;
    fr.value = String(stick.soundFrame);
    markDirty();
    refreshAll();
  });
  root.appendChild(field("Sound frame", fr));
  if (!clipIsAttackRole(e.name, stick.name)) return;
  const atk = document.createElement("input");
  atk.type = "number";
  atk.min = "0";
  atk.max = String(Math.max(0, stick.len - 1));
  atk.step = "1";
  atk.value = String(attackFrameOrDefault(stick.attackFrame, stick.len));
  atk.addEventListener("change", () => {
    pushUndo();
    const next = attackFrameOrDefault(atk.value, stick.len);
    stick.attackFrame = next;
    atk.value = String(next);
    markDirty();
    refreshAll();
  });
  root.appendChild(field("Attack frame", atk));
}

function clipIsExported(e, name) {
  if (!Array.isArray(e?.exportClips)) return true;
  return e.exportClips.includes(name);
}

function setClipExported(e, name, on) {
  const all = (e.clips || []).map((c) => c.name);
  const have = new Set(Array.isArray(e.exportClips) ? e.exportClips : all);
  if (on) have.add(name);
  else have.delete(name);
  e.exportClips = all.filter((n) => have.has(n));
}

function exportClipNames(e, mdl) {
  const mdlNames = new Set((mdl?.clips || []).map((c) => c.name));
  if (Array.isArray(e?.exportClips)) {
    return e.exportClips.filter((n) => !mdlNames.size || mdlNames.has(n));
  }
  if (e?.clips?.length) {
    return e.clips.map((c) => c.name).filter((n) => !mdlNames.size || mdlNames.has(n));
  }
  return filterMdlClips(mdl?.clips).map((c) => c.name);
}

function formatPackedPoseMem(packed) {
  const { bytes, nLogical, nStored } = packed;
  const size =
    bytes >= 1024
      ? `${bytes / 1024 < 10 ? (bytes / 1024).toFixed(1) : Math.round(bytes / 1024)} KB`
      : `${bytes} bytes`;
  const over =
    bytes > ENEMY_POSE_MAX ? ` OVER ${bytes - ENEMY_POSE_MAX}` : "";
  return `≈ ${size} in-game (${nStored} stored / ${nLogical} logical)${over}`;
}

function getTimeline(e) {
  if (enemyHasSprites(e) && e?.clips?.length) {
    return e.clips.map((c) => ({
      name: c.name,
      len: c.len,
      start: c.start,
      frameNames: [],
      mdlFrames: [],
      hasStick: true,
      sprites: c.sprites,
    }));
  }
  const mdl = sharewareModels[e?.name];
  if (mdl?.clips?.length) {
    const byName = new Map((e.clips || []).map((c) => [c.name, c]));
    return mdl.clips.map((c) => {
      const stick = byName.get(c.name);
      return {
        name: c.name,
        len: c.frames.length,
        start: stick ? stick.start : 0,
        frameNames: c.frames.map((fr) => fr.name),
        mdlFrames: c.frames,
        hasStick: !!stick,
      };
    });
  }
  if (e?.clips?.length) {
    return e.clips.map((c) => ({
      name: c.name,
      len: c.len,
      start: c.start,
      frameNames: [],
      mdlFrames: [],
      hasStick: true,
    }));
  }
  return [];
}

function clampFrameIndex(e) {
  if (!e?.frames?.length) {
    frameIndex = 0;
    return;
  }
  if (e.clips?.length) {
    frameIndex = Math.max(0, Math.min(frameIndex, e.frames.length - 1));
  }
}

function syncClipFromFrameIndex(e) {
  const timeline = getTimeline(e);
  if (!timeline.length) {
    clipIndex = 0;
    frameLocal = 0;
    return;
  }
  const mdl = sharewareModels[e?.name];
  if (e?.clips?.length) {
    const stick = clipForFrame(e.clips, frameIndex);
    if (stick) {
      const idx = timeline.findIndex((c) => c.name === stick.name);
      if (idx >= 0) {
        clipIndex = idx;
        frameLocal = frameIndex - stick.start;
        return;
      }
      if (!mdl) {
        clipIndex = Math.max(0, e.clips.indexOf(stick));
        frameLocal = frameIndex - stick.start;
        return;
      }
    }
  }
  if (clipIndex >= timeline.length) clipIndex = 0;
  const clip = timeline[clipIndex];
  frameLocal = Math.max(0, Math.min(frameLocal, clip.len - 1));
}

function frameLabel(e, fi) {
  if (!e?.clips?.length) return "rest";
  const clip = clipForFrame(e.clips, fi);
  if (!clip) return `frame ${fi}`;
  return `${clip.name} ${fi - clip.start}`;
}

function activeTimelineClip() {
  const timeline = getTimeline(activeEnemy());
  if (!timeline.length) return null;
  if (clipIndex >= timeline.length) clipIndex = 0;
  return timeline[clipIndex];
}

function canvasClientToScreen(e) {
  const canvas = document.getElementById("view-canvas");
  const rect = canvas.getBoundingClientRect();
  const over =
    e.clientX >= rect.left &&
    e.clientX <= rect.right &&
    e.clientY >= rect.top &&
    e.clientY <= rect.bottom;
  return {
    over,
    mx: ((e.clientX - rect.left) / rect.width) * layoutView.cssW,
    my: ((e.clientY - rect.top) / rect.height) * layoutView.cssH,
  };
}

/** Owner room for palette drop: ray-hit room, miss → selected/last. */
function placeOwner(kind, hitRoom) {
  if (kind === "room") return null;
  return hitRoom || placementRoom();
}

function previewObjectAtScreen(place, mx, my) {
  const kind = place.kind;
  const p = layoutView.placeAtScreen(mx, my, kind);
  const owner = placeOwner(kind, p.room);
  const extra = {};
  if (place.enemy) extra.enemy = place.enemy;
  if (place.pickup) extra.pickup = place.pickup;
  if (place.doorType) extra.doorType = place.doorType;
  if (owner) extra.roomId = owner.id;
  if (kind === "spawn") {
    extra.enabled = !activeMap(doc).objects.some((o) => o.kind === "spawn");
  }
  const obj = createObject(kind, p.x, p.y, p.z, extra);
  if (kind === "doorway" && p.face) {
    snapDoorToFace(obj, p.face, p.hitY);
  } else if (kind === "switch" && p.face) {
    snapSwitchToFace(obj, p.face, p.hitY);
  } else if (owner && kind !== "room" && p.floorSnap !== false) {
    obj.y = roomFloorY(owner, obj.x + obj.sx / 2, obj.z + obj.sz / 2);
  }
  clampObject(obj);
  return obj;
}

function clearPaletteDrag() {
  document.body.classList.remove("palette-dragging");
  layoutView.clearPlacePreview();
  pendingPlace = null;
  if (editorMode === "layout") layoutView.draw();
}

function updatePaletteDrag(e) {
  if (!pendingPlace || pendingPlace.pointerId !== e.pointerId || editorMode !== "layout") return;
  const { over, mx, my } = canvasClientToScreen(e);
  if (over) layoutView.setPlacePreview(previewObjectAtScreen(pendingPlace, mx, my), true);
  else layoutView.setPlacePreview(null, false);
  layoutView.draw();
}
