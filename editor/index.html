/** Text of a file in the repo root, or null if it is not there. */
/** Bytes of a file under the open NebulaSkip folder, or null. */
async function readProjectBytes(relPath) {
  if (!projectDirHandle) return null;
  const fh = await getFileInDir(projectDirHandle, relPath);
  if (!fh) return null;
  return (await fh.getFile()).arrayBuffer();
}

async function readRepoFile(dirHandle, name) {
  if (!(await ensurePermission(dirHandle, "read"))) {
    throw new Error("No read permission for the repo folder");
  }
  const fh = await getFileInDir(dirHandle, name);
  if (!fh) return null;
  return (await fh.getFile()).text();
}

async function pickSharewareDirectory() {
  if (!window.showDirectoryPicker) {
    throw new Error("This browser cannot open a folder (needs Chromium file access)");
  }
  try {
    const handle = await window.showDirectoryPicker({
      id: "nebulaskip-shareware",
      mode: "read",
    });
    await storeSharewareHandle(handle);
    return handle;
  } catch (e) {
    if (e.name === "AbortError") return null;
    throw e;
  }
}

async function getFileInDir(dir, relPath) {
  const parts = relPath.split("/");
  let cur = dir;
  for (let i = 0; i < parts.length - 1; i++) {
    try {
      cur = await cur.getDirectoryHandle(parts[i]);
    } catch {
      return null;
    }
  }
  try {
    return await cur.getFileHandle(parts[parts.length - 1]);
  } catch {
    return null;
  }
}

/** Load pak0 then pak1 from the folder or an id1/ child. */
async function loadSharewarePakBuffers(dirHandle) {
  const buffers = [];
  const seen = new Set();
  const candidates = ["pak0.pak", "id1/pak0.pak", "pak1.pak", "id1/pak1.pak"];
  for (const rel of candidates) {
    const fh = await getFileInDir(dirHandle, rel);
    if (!fh) continue;
    const file = await fh.getFile();
    const key = `${file.name}:${file.size}:${file.lastModified}`;
    if (seen.has(key)) continue;
    seen.add(key);
    buffers.push(await file.arrayBuffer());
  }
  return buffers;
}

function downloadJSON(doc, filename = DEFAULT_DOC_PATH) {
  const blob = new Blob([JSON.stringify(withoutEditor(doc), null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}


// ---- js/pak.js ----
const PAK_ENTRY = 64;
const PAK_NAME = 56;

/** Parse a Doom PACK buffer into a Map of lowercase path → ArrayBuffer. */
function parsePak(buffer) {
  const view = new DataView(buffer);
  if (buffer.byteLength < 12) throw new Error("PAK too small");
  const magic = String.fromCharCode(
    view.getUint8(0),
    view.getUint8(1),
    view.getUint8(2),
    view.getUint8(3)
  );
  if (magic !== "PACK") throw new Error("Not a PACK file");
  const dirOfs = view.getInt32(4, true);
  const dirSize = view.getInt32(8, true);
  if (dirOfs < 0 || dirSize < 0 || dirOfs + dirSize > buffer.byteLength) {
    throw new Error("PAK directory out of range");
  }
  const n = (dirSize / PAK_ENTRY) | 0;
  const files = new Map();
  for (let i = 0; i < n; i++) {
    const off = dirOfs + i * PAK_ENTRY;
    let name = "";
    for (let j = 0; j < PAK_NAME; j++) {
      const c = view.getUint8(off + j);
      if (!c) break;
      name += String.fromCharCode(c);
    }
    const dataOfs = view.getInt32(off + PAK_NAME, true);
    const dataSize = view.getInt32(off + PAK_NAME + 4, true);
    if (dataOfs < 0 || dataSize < 0 || dataOfs + dataSize > buffer.byteLength) continue;
    const key = name.replace(/\\/g, "/").toLowerCase();
    files.set(key, buffer.slice(dataOfs, dataOfs + dataSize));
  }
  return files;
}

/** Later PAKs override earlier ones (pak0 then pak1). */
function mergePaks(pakMaps) {
  const all = new Map();
  for (const m of pakMaps) {
    for (const [k, v] of m) all.set(k, v);
  }
  return all;
}

function parsePakBuffers(buffers) {
  return mergePaks(buffers.map(parsePak));
}


// ---- js/mdl.js ----
const IDPO = 0x4f504449;
const ALIAS_VERSION = 6;
const ALIAS_SINGLE = 0;

const ENEMY_MDL_PATHS = {};

function cstr(view, offset, len) {
  let s = "";
  for (let i = 0; i < len; i++) {
    const c = view.getUint8(offset + i);
    if (!c) break;
    s += String.fromCharCode(c);
  }
  return s;
}

function clipKey(name) {
  const k = name.replace(/\d+$/, "");
  return k || name;
}

/** Drop extra pain/death variants; keep first pain and first death. */
const EXTRA_PAIN_DEATH = /^pain[b-z]|^death[b-z]|^deathc$|^bdeath$/;

function shouldKeepMdlClip(name) {
  return !EXTRA_PAIN_DEATH.test(name);
}

function filterMdlClips(clips) {
  return (clips || []).filter((c) => shouldKeepMdlClip(c.name));
}

/** Clips named in `names`, in MDL order. Missing/undefined names → default kept set. */
function selectMdlClips(mdl, names) {
  const clips = mdl?.clips || [];
  if (!clips.length) return [];
  if (!Array.isArray(names)) return filterMdlClips(clips);
  const want = new Set(names);
  return clips.filter((c) => want.has(c.name));
}

/** Global stick index → MDL frame index (same order as filterMdlClips). */
function mdlFrameIndexAt(mdl, globalIndex) {
  const kept = filterMdlClips(mdl.clips);
  let i = 0;
  for (const clip of kept) {
    for (const fr of clip.frames) {
      if (i === globalIndex) return fr.index;
      i++;
    }
  }
  return kept[0]?.frames[0]?.index ?? 0;
}

function uniqueEdges(tris) {
  const seen = new Set();
  const edges = [];
  const add = (a, b) => {
    if (a === b) return;
    const lo = a < b ? a : b;
    const hi = a < b ? b : a;
    const key = lo + ":" + hi;
    if (seen.has(key)) return;
    seen.add(key);
    edges.push([lo, hi]);
  };
  for (const t of tris) {
    add(t[0], t[1]);
    add(t[1], t[2]);
    add(t[2], t[0]);
  }
  return edges;
}

function reader(buffer) {
  const view = new DataView(buffer);
  let o = 0;
  return {
    i32() {
      const v = view.getInt32(o, true);
      o += 4;
      return v;
    },
    f32() {
      const v = view.getFloat32(o, true);
      o += 4;
      return v;
    },
    vec3() {
      return [this.f32(), this.f32(), this.f32()];
    },
    skip(n) {
      o += n;
    },
    u8() {
      const v = view.getUint8(o);
      o += 1;
      return v;
    },
    name16() {
      const s = cstr(view, o, 16);
      o += 16;
      return s;
    },
    check(n, what) {
      if (o + n > buffer.byteLength) throw new Error(`MDL truncated (${what})`);
    },
  };
}

function skipSkins(r, numSkins, skinWidth, skinHeight) {
  const skinSize = skinWidth * skinHeight;
  if (skinSize < 0 || skinSize > 2_000_000) throw new Error("MDL skin size invalid");
  for (let i = 0; i < numSkins; i++) {
    r.check(4, "skin type");
    const typ = r.i32();
    if (typ === ALIAS_SINGLE) {
      r.check(skinSize, "skin");
      r.skip(skinSize);
    } else {
      r.check(4, "skin group");
      const n = r.i32();
      if (n < 0 || n > 256) throw new Error("MDL skin group too large");
      r.check(n * 4 + n * skinSize, "skin group");
      r.skip(n * 4);
      r.skip(n * skinSize);
    }
  }
}

function readSimpleFrame(r, numVerts) {
  r.check(8 + 16 + numVerts * 4, "frame");
  r.skip(8);
  const name = r.name16();
  const verts = new Uint8Array(numVerts * 3);
  for (let i = 0; i < numVerts; i++) {
    verts[i * 3] = r.u8();
    verts[i * 3 + 1] = r.u8();
    verts[i * 3 + 2] = r.u8();
    r.u8();
  }
  return { name, verts };
}

function parseMdl(buffer) {
  const r = reader(buffer);
  r.check(84, "header");
  const ident = r.i32();
  if (ident !== IDPO) throw new Error("Not an IDPO MDL");
  const version = r.i32();
  if (version !== ALIAS_VERSION) throw new Error(`MDL version ${version}, expected 6`);
  const scale = r.vec3();
  const origin = r.vec3();
  r.f32();
  r.vec3();
  const numSkins = r.i32();
  const skinWidth = r.i32();
  const skinHeight = r.i32();
  const numVerts = r.i32();
  const numTris = r.i32();
  const numFrames = r.i32();
  r.i32();
  r.i32();
  r.f32();

  if (numVerts <= 0 || numVerts > 10000 || numTris <= 0 || numTris > 20000 || numFrames <= 0) {
    throw new Error("MDL has no geometry");
  }

  skipSkins(r, numSkins, skinWidth, skinHeight);

  r.check(numVerts * 12, "stverts");
  r.skip(numVerts * 12);

  const tris = [];
  r.check(numTris * 16, "tris");
  for (let i = 0; i < numTris; i++) {
    r.i32();
    tris.push([r.i32(), r.i32(), r.i32()]);
  }

  const frames = [];
  for (let i = 0; i < numFrames; i++) {
    r.check(4, "frame type");
    const typ = r.i32();
    if (typ === ALIAS_SINGLE) {
      frames.push(readSimpleFrame(r, numVerts));
    } else {
      r.check(4, "group count");
      const n = r.i32();
      if (n < 0 || n > 256) throw new Error("MDL frame group too large");
      r.check(8 + n * 4, "group header");
      r.skip(8);
      r.skip(n * 4);
      for (let j = 0; j < n; j++) frames.push(readSimpleFrame(r, numVerts));
    }
  }

  const clips = [];
  const byKey = new Map();
  for (let i = 0; i < frames.length; i++) {
    const key = clipKey(frames[i].name);
    let clip = byKey.get(key);
    if (!clip) {
      clip = { name: key, frames: [] };
      byKey.set(key, clip);
      clips.push(clip);
    }
    clip.frames.push({ name: frames[i].name, index: i });
  }

  return {
    numVerts,
    scale,
    origin,
    tris,
    edges: uniqueEdges(tris),
    frames,
    clips,
  };
}

/** Doom hull mins.z / modelgen $origin z — origin sits this far above the floor. */
const HULL_FLOOR = 24;

/** Doom +X forward / +Z up → editor +Z forward / +Y up. */
function doomToEditor(qx, qy, qz) {
  return { x: -qy, y: qz, z: qx };
}

function decodeConverted(mdl, frameIndex) {
  const fr = mdl.frames[frameIndex];
  const out = new Array(mdl.numVerts);
  if (fr?.xyz) {
    const xyz = fr.xyz;
    for (let i = 0; i < mdl.numVerts; i++) {
      out[i] = doomToEditor(xyz[i * 3], xyz[i * 3 + 1], xyz[i * 3 + 2]);
    }
    return out;
  }
  const [sx, sy, sz] = mdl.scale;
  const [ox, oy, oz] = mdl.origin;
  const packed = fr.verts;
  for (let i = 0; i < mdl.numVerts; i++) {
    const qx = packed[i * 3] * sx + ox;
    const qy = packed[i * 3 + 1] * sy + oy;
    const qz = packed[i * 3 + 2] * sz + oz;
    out[i] = doomToEditor(qx, qy, qz);
  }
  return out;
}

function mdlEditorVerts(mdl, frameIndex, scale) {
  const raw = decodeConverted(mdl, frameIndex);
  const n = Number(scale);
  const s = Number.isFinite(n) ? Math.max(0.1, Math.min(2, n)) : 0.7;
  return raw.map((v) => ({ x: v.x * s, y: (v.y + HULL_FLOOR) * s, z: v.z * s }));
}

/** Build stick poses + clip table from bound MDL clips (selected names, or default kept set). */
function buildStickFramesFromMdl(mdl, rig, scale, restFrame, clampVert, clipNames) {
  const kept = selectMdlClips(mdl, clipNames);
  const frames = [];
  const clips = [];
  let start = 0;
  for (const clip of kept) {
    clips.push({ name: clip.name, start, len: clip.frames.length });
    for (const fr of clip.frames) {
      const verts = mdlEditorVerts(mdl, fr.index, scale);
      const avg = averageJointPositions(verts, rig.jointVerts);
      const pose = avg.map((p, i) => {
        if (p) {
          return {
            x: clampVert(Math.round(p.x)),
            y: clampVert(Math.round(p.y)),
            z: clampVert(Math.round(p.z)),
          };
        }
        const v = restFrame[i] || { x: 0, y: 0, z: 0 };
        return { x: v.x, y: v.y, z: v.z };
      });
      frames.push(pose);
    }
    start += clip.frames.length;
  }
  return { frames, clips };
}

function averageJointPositions(verts, jointVerts) {
  return jointVerts.map((indices) => {
    if (!indices || !indices.length) return null;
    let x = 0;
    let y = 0;
    let z = 0;
    let n = 0;
    for (const i of indices) {
      const v = verts[i];
      if (!v) continue;
      x += v.x;
      y += v.y;
      z += v.z;
      n++;
    }
    if (!n) return null;
    return { x: x / n, y: y / n, z: z / n };
  });
}

function loadEnemyMdls(lumps) {
  const models = {};
  const missing = [];
  for (const [enemy, path] of Object.entries(ENEMY_MDL_PATHS)) {
    const buf = lumps.get(path.toLowerCase());
    if (!buf) {
      missing.push(enemy);
      continue;
    }
    try {
      models[enemy] = parseMdl(buf);
    } catch (err) {
      missing.push(enemy);
      console.warn(`Failed to parse ${path}:`, err);
    }
  }
  return { models, missing };
}


// ---- js/layoutView.js ----
function hexAlpha(hex, alpha) {
  const h = hex.replace("#", "");
  const r = parseInt(h.slice(0, 2), 16);
  const g = parseInt(h.slice(2, 4), 16);
  const b = parseInt(h.slice(4, 6), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}

/** Ramp AABB wireframe without the y=max face (open top). */
const SLOPE_TOP = new Set([2, 3, 6, 7]);
const SLOPE_BOX_EDGES = BOX_EDGES.filter(([i, j]) => !(SLOPE_TOP.has(i) && SLOPE_TOP.has(j)));

function edgeKey(i, j) {
  return i < j ? `${i},${j}` : `${j},${i}`;
}

/** Verticals on the low run face — phantom y=max corners, not part of the ramp. */
function rampPhantomVerticals(obj) {
  if (obj.axis === "x") {
    return obj.dir === 1
      ? [
          [3, 0],
          [7, 4],
        ]
      : [
          [1, 2],
          [5, 6],
        ];
  }
  return obj.dir === 1
    ? [
        [1, 2],
        [3, 0],
      ]
    : [
        [5, 6],
        [7, 4],
      ];
}

function rampBoxEdges(obj) {
  const drop = new Set(rampPhantomVerticals(obj).map(([i, j]) => edgeKey(i, j)));
  return SLOPE_BOX_EDGES.filter(([i, j]) => !drop.has(edgeKey(i, j)));
}

function rampCorners(obj) {
  const lowY = obj.y;
  const highY = obj.y + obj.sy;
  if (obj.axis === "x") {
    const x0 = obj.dir === 1 ? obj.x : obj.x + obj.sx;
    const x1 = obj.dir === 1 ? obj.x + obj.sx : obj.x;
    return {
      p0: { x: x0, y: lowY, z: obj.z },
      p1: { x: x0, y: lowY, z: obj.z + obj.sz },
      p2: { x: x1, y: highY, z: obj.z + obj.sz },
      p3: { x: x1, y: highY, z: obj.z },
    };
  }
  const z0 = obj.dir === 1 ? obj.z : obj.z + obj.sz;
  const z1 = obj.dir === 1 ? obj.z + obj.sz : obj.z;
  return {
    p0: { x: obj.x, y: lowY, z: z0 },
    p1: { x: obj.x + obj.sx, y: lowY, z: z0 },
    p2: { x: obj.x + obj.sx, y: highY, z: z1 },
    p3: { x: obj.x, y: highY, z: z1 },
  };
}

/** Open-top AABB plus ramp surface sides and ridge. */
function rampSegments(obj) {
  const segs = [];
  for (const [i, j] of rampBoxEdges(obj)) {
    segs.push({ a: cornerWorld(obj, i), b: cornerWorld(obj, j) });
  }
  const { p0, p1, p2, p3 } = rampCorners(obj);
  segs.push({ a: p0, b: p3 }, { a: p1, b: p2 }, { a: p3, b: p2 });
  return segs;
}

const HANDLE = 7;
const LINE_HIT = 8;
const LAYOUT_BOX_CLICK = 4;

function faceKeyedPoint(p, x0, y0, z0, x1, y1, z1) {
  const x = Math.round(p.x);
  const y = Math.round(p.y);
  const z = Math.round(p.z);
  const keys = [];
  if (x === x0) keys.push("x0");
  else if (x === x1) keys.push("x1");
  if (y === y0) keys.push("y0");
  else if (y === y1) keys.push("y1");
  if (z === z0) keys.push("z0");
  else if (z === z1) keys.push("z1");
  return { x, y, z, keys };
}

function aabbControlPoints(obj) {
  const x0 = obj.x | 0;
  const y0 = obj.y | 0;
  const z0 = obj.z | 0;
  const x1 = x0 + (obj.sx | 0);
  const y1 = y0 + (obj.sy | 0);
  const z1 = z0 + (obj.sz | 0);
  const pts = [];
  for (const x of [x0, x1]) {
    for (const y of [y0, y1]) {
      for (const z of [z0, z1]) pts.push(faceKeyedPoint({ x, y, z }, x0, y0, z0, x1, y1, z1));
    }
  }
  return pts;
}

/** Ramp corners that are actually drawn. Phantom low-end top corners are left out. */
function slopeControlPoints(obj) {
  const x0 = obj.x | 0;
  const y0 = obj.y | 0;
  const z0 = obj.z | 0;
  const x1 = x0 + (obj.sx | 0);
  const y1 = y0 + (obj.sy | 0);
  const z1 = z0 + (obj.sz | 0);
  const seen = new Set();
  const pts = [];
  for (const seg of rampSegments(obj)) {
    for (const p of [seg.a, seg.b]) {
      const x = Math.round(p.x);
      const y = Math.round(p.y);
      const z = Math.round(p.z);
      const id = `${x},${y},${z}`;
      if (seen.has(id)) continue;
      seen.add(id);
      const pt = faceKeyedPoint({ x, y, z }, x0, y0, z0, x1, y1, z1);
      if (pt.keys.length) pts.push(pt);
    }
  }
  return pts;
}

/** A plane is grabbed only when every control point on it is inside the marquee. */
function keysForInside(points, inside) {
  const groups = new Map();
  points.forEach((p, i) => {
    for (const k of p.keys) {
      if (!groups.has(k)) groups.set(k, []);
      groups.get(k).push(i);
    }
  });
  const keys = new Set();
  for (const [k, idxs] of groups) {
    if (idxs.length && idxs.every((i) => inside.has(i))) keys.add(k);
  }
  return keys;
}

function unionPointSel(a, b) {
  const geom = new Map();
  const take = (src) => {
    if (!src) return;
    for (const [id, keys] of src.geom) {
      const prev = geom.get(id);
      geom.set(id, prev ? new Set([...prev, ...keys]) : new Set(keys));
    }
  };
  take(a);
  take(b);
  const rigid = new Set([...(a?.rigid || []), ...(b?.rigid || [])]);
  if (!geom.size && !rigid.size) return null;
  return { geom, rigid };
}

function snapshotObj(o) {
  return {
    ...o,
    cuts: (o.cuts || []).map((c) => ({ su: c.su | 0, sv: c.sv | 0 })),
  };
}
const ZOOM_K = 0.008;

class LayoutView {
  /**
   * @param {HTMLCanvasElement} canvas
   * @param {object} opts
   */
  constructor(canvas, opts) {
    this.canvas = canvas;
    this.ctx = canvas.getContext("2d");
    this.opts = opts;
    this.camera = {
      x: 28,
      y: 10,
      z: -6,
      yaw: 0.35,
      pitch: -0.2,
      speed: 28,
    };
    this.keys = new Set();
    this.look = false;
    this.orbit = null;
    this.pan = null;
    this.zoom = null;
    this.lastT = 0;
    this.hoverId = null;
    this.hoverGizmo = null;
    this.drag = null;
    this.pointSel = null;
    this.gridY = 0;
    this.placePreview = null;
    this.placePreviewOverCanvas = false;
    this.enabled = true;
    this._ro = new ResizeObserver(() => this.resize());
    this._ro.observe(opts.stage || canvas.parentElement);
    this.resize();

    canvas.addEventListener("pointerdown", (e) => this.#onDown(e));
    canvas.addEventListener("pointermove", (e) => this.#onMove(e));
    canvas.addEventListener("pointerup", (e) => this.#onUp(e));
    canvas.addEventListener("pointerleave", (e) => this.#onUp(e));
    canvas.addEventListener("wheel", (e) => this.#onWheel(e), { passive: false });
    canvas.addEventListener("contextmenu", (e) => e.preventDefault());
    canvas.addEventListener("mousedown", (e) => {
      if (e.button === 1) e.preventDefault();
    });
    canvas.addEventListener("auxclick", (e) => {
      if (e.button === 1) e.preventDefault();
    });
    window.addEventListener("keydown", (e) => this.#onKey(e, true));
    window.addEventListener("keyup", (e) => this.#onKey(e, false));

    this._raf = (t) => {
      if (this.enabled) this.#tick(t);
      else this.lastT = t;
      requestAnimationFrame(this._raf);
    };
    requestAnimationFrame(this._raf);
  }

  resize() {
    if (!this.enabled) return;
    const stage = this.opts.stage || this.canvas.parentElement;
    const rect = stage.getBoundingClientRect();
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const w = Math.max(64, Math.floor(rect.width));
    const h = Math.max(64, Math.floor(rect.height));
    this.canvas.width = Math.floor(w * dpr);
    this.canvas.height = Math.floor(h * dpr);
    this.canvas.style.width = `${w}px`;
    this.canvas.style.height = `${h}px`;
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    this.cssW = w;
    this.cssH = h;
    this.draw();
  }

  setPlacePreview(obj, overCanvas) {
    this.placePreview = obj;
    this.placePreviewOverCanvas = overCanvas;
  }

  clearPlacePreview() {
    this.placePreview = null;
    this.placePreviewOverCanvas = false;
  }

  #focused() {
    return document.activeElement === this.canvas;
  }

  #onKey(e, down) {
    if (!this.enabled) return;
    if (!this.#focused() && down) return;
    const k = e.key.toLowerCase();
    if ("wasdqe".includes(k) || k === "shift") {
      if (down) this.keys.add(k);
      else this.keys.delete(k);
      if (down) e.preventDefault();
    }
  }

  #tick(t) {
    const dt = this.lastT ? Math.min(0.05, (t - this.lastT) / 1000) : 0;
    this.lastT = t;
    let moved = false;
    if (this.#focused()) {
      const { forward, right, up } = lookVectors(this.camera.yaw, this.camera.pitch);
      const boost = this.keys.has("shift") ? 3 : 1;
      const sp = this.camera.speed * boost * dt;
      if (this.keys.has("w")) {
        this.camera.x += forward.x * sp;
        this.camera.y += forward.y * sp;
        this.camera.z += forward.z * sp;
        moved = true;
      }
      if (this.keys.has("s")) {
        this.camera.x -= forward.x * sp;
        this.camera.y -= forward.y * sp;
        this.camera.z -= forward.z * sp;
        moved = true;
      }
      if (this.keys.has("d")) {
        this.camera.x += right.x * sp;
        this.camera.y += right.y * sp;
        this.camera.z += right.z * sp;
        moved = true;
      }
      if (this.keys.has("a")) {
        this.camera.x -= right.x * sp;
        this.camera.y -= right.y * sp;
        this.camera.z -= right.z * sp;
        moved = true;
      }
      if (this.keys.has("e")) {
        this.camera.x += up.x * sp;
        this.camera.y += up.y * sp;
        this.camera.z += up.z * sp;
        moved = true;
      }
      if (this.keys.has("q")) {
        this.camera.x -= up.x * sp;
        this.camera.y -= up.y * sp;
        this.camera.z -= up.z * sp;
        moved = true;
      }
    }
    if (moved) this.opts.onViewChanged?.();
    this.draw();
    this.opts.onTick?.();
  }

      x: ((e.clientX - rect.left) / rect.width) * this.cssW,
      y: ((e.clientY - rect.top) / rect.height) * this.cssH,
    };
  }

  #selectedIds() {
    return this.opts.getSelectedIds?.() || [];
  }

  #primaryId() {
    const ids = this.#selectedIds();
    return ids.length ? ids[ids.length - 1] : null;
  }

  /** Last selected doorway, if the selection contains one. */
  #selectedDoor(doc) {
    const ids = this.#selectedIds();
    const objs = activeMap(doc).objects;
    for (let i = ids.length - 1; i >= 0; i--) {
      const o = objs.find((obj) => obj.id === ids[i]);
      if (o?.kind === "doorway") return o;

    const dist = -notches * this.camera.speed * 0.35;
    this.camera.x += forward.x * dist;
    this.camera.y += forward.y * dist;
    this.camera.z += forward.z * dist;

  }

  #onDown(e) {
    if (!this.enabled) return;
    this.canvas.focus();
    const p = this.#eventPos(e);
    if (e.button === 1) {
      if (e.altKey) {
        this.orbit = this.#beginOrbit(p);
      } else {
        this.pan = this.#beginOrbit(p);
      }
      this.canvas.setPointerCapture(e.pointerId);
      return;
    }
    if (e.button === 2) {
      if (e.altKey) {
        this.zoom = this.#beginOrbit(p);
        this.canvas.setPointerCapture(e.pointerId);
        return;
      }
      this.look = true;
      this.lookLast = p;
      this.canvas.setPointerCapture(e.pointerId);
      return;
    }
    if (e.button !== 0) return;
    if (e.altKey) {
      e.preventDefault();
      this.orbit = this.#beginOrbit(p);
      this.canvas.setPointerCapture(e.pointerId);
      return;
    }

    const doc = this.opts.getDoc();
    if (e.ctrlKey || e.metaKey) {
      this.drag = { kind: "box", start: p, end: p, additive: e.shiftKey, partial: true };
      this.canvas.setPointerCapture(e.pointerId);
      return;
    }
    if (this.#pointSelActive()) {
      const hitGizmo = this.#hitPointGizmo(doc, p.x, p.y);
      if (hitGizmo) {
        this.opts.beginUndo?.();
        this.drag = this.#makePointDrag(doc, hitGizmo, p);
        this.canvas.setPointerCapture(e.pointerId);
        return;
      }
      const corner = this.#hitPointCorner(doc, p.x, p.y);
      if (corner) {
        this.opts.beginUndo?.();
        this.drag = this.#makePointDrag(doc, { kind: "move", world: { x: corner.x, y: corner.y, z: corner.z } }, p);
        this.canvas.setPointerCapture(e.pointerId);
        return;
      }
      this.pointSel = null;
      this.drag = { kind: "box", start: p, end: p, additive: e.shiftKey };
      this.canvas.setPointerCapture(e.pointerId);
      return;
    }

    const primary = this.#primaryId();
    const hitHandle = primary ? this.#hitHandle(doc, primary, p.x, p.y) : null;
    if (hitHandle) {
      this.opts.beginUndo?.();
      const ids = this.#selectedIds().length ? this.#selectedIds() : [primary];
      this.drag = this.#makeTransformDrag(doc, ids, hitHandle, p);
      this.canvas.setPointerCapture(e.pointerId);
      return;
    }

    this.drag = { kind: "box", start: p, end: p, additive: e.shiftKey };
    this.canvas.setPointerCapture(e.pointerId);
  }

  #makeTransformDrag(doc, ids, handle, p) {
    const objs = activeMap(doc).objects;
    const origs = ids
      .map((id) => objs.find((o) => o.id === id))
      .filter(Boolean)
      .map((o) => ({
        ...o,
        cuts: (o.cuts || []).map((c) => ({ su: c.su | 0, sv: c.sv | 0 })),
      }));
    const contents = [];
    const claimed = new Set(ids);
    for (const o of origs) {
      if (o.kind !== "room") continue;
      for (const other of objs) {
        if (other.kind === "room" || other.kind === "doorway" || claimed.has(other.id)) continue;
        if (other.roomId !== o.id) continue;
        claimed.add(other.id);
        contents.push({ ...other });
      }
    }
    const primaryObj = objs.find((o) => o.id === ids[ids.length - 1]) || origs[0];
    const gizmo = primaryObj
      ? gizmoMetrics(gizmoAnchor(primaryObj), this.camera, this.cssW, this.cssH)
      : { axisLen: GIZMO_FALLBACK_LEN, planeLen: GIZMO_FALLBACK_LEN / 3 };
    return {
      kind: handle.kind,
      axis: handle.axis,
      plane: handle.plane,
      key: handle.key,
      side: handle.side,
      scale: handle.scale,
      start: p,
      origs,
      contents,
      grab: handle.world,
      planeN: handle.planeN || lookVectors(this.camera.yaw, this.camera.pitch).forward,
      primaryId: ids[ids.length - 1],
      gizmoAxisLen: handle.gizmoAxisLen ?? gizmo.axisLen,
    };
  }

  #beginOrbit(p) {
    const cam = this.camera;
    const doc = this.opts.getDoc();
    const hit = this.#pick(doc, p.x, p.y);
    let obj = hit ? activeMap(doc).objects.find((o) => o.id === hit.id) || null : null;
    if (!obj) obj = this.#closestRoomToCursor(doc, p.x, p.y);
    let target;
    if (obj) {
      target = aabbCenter(obj);
    } else {
      const ray = screenRay(p.x, p.y, cam, this.cssW, this.cssH);
      const hit = intersectPlane(ray.origin, ray.dir, { x: 0, y: this.gridY, z: 0 }, { x: 0, y: 1, z: 0 });
      if (hit && hit.t >= 1) {
        target = hit.point;
      } else {
        const dist = Math.max(48, cam.speed * 2.5);
        const { forward } = lookVectors(cam.yaw, cam.pitch);
        target = { x: cam.x + forward.x * dist, y: cam.y + forward.y * dist, z: cam.z + forward.z * dist };
      }
    }
    const local = worldToCamera(target, cam);
    if (local.z < 1) local.z = 1;
    return { last: p, target, local };
  }

  #setCamFromTarget(target, local) {
    const cam = this.camera;
    const { forward, right, up } = lookVectors(cam.yaw, cam.pitch);
    cam.x = target.x - right.x * local.x - up.x * local.y - forward.x * local.z;
    cam.y = target.y - right.y * local.x - up.y * local.y - forward.y * local.z;
    cam.z = target.z - right.z * local.x - up.z * local.y - forward.z * local.z;
  }

  #screenDistToAabb(box, mx, my, cam, w, h) {
    let minx = Infinity;
    let miny = Infinity;
    let maxx = -Infinity;
    let maxy = -Infinity;
    let any = false;
    for (let i = 0; i < 8; i++) {
      const pr = projectPoint(cornerWorld(box, i), cam, w, h);
      if (!pr.ok) continue;
      any = true;
      minx = Math.min(minx, pr.sx);
      miny = Math.min(miny, pr.sy);
      maxx = Math.max(maxx, pr.sx);
      maxy = Math.max(maxy, pr.sy);
    }
    if (!any) return Infinity;
    const dx = mx < minx ? minx - mx : mx > maxx ? mx - maxx : 0;
    const dy = my < miny ? miny - my : my > maxy ? my - maxy : 0;
    return Math.hypot(dx, dy);
  }

  #closestRoomToCursor(doc, mx, my) {
    const cam = this.camera;
    const w = this.cssW;
    const h = this.cssH;
    let best = null;
    let bestD = Infinity;
    let bestDepth = Infinity;
    for (const obj of this.#visibleObjects(doc)) {
      if (obj.kind !== "room") continue;
      let d = Infinity;
      for (const c of roomGeometry(obj).colliders) {
        const cd = this.#screenDistToAabb(c, mx, my, cam, w, h);
        if (cd < d) d = cd;
      }
      if (d === Infinity) continue;
      const c = aabbCenter(obj);
      const depth = (c.x - cam.x) ** 2 + (c.y - cam.y) ** 2 + (c.z - cam.z) ** 2;
      if (d < bestD - 0.01 || (Math.abs(d - bestD) < 0.01 && depth < bestDepth)) {
        bestD = d;
        bestDepth = depth;
        best = obj;
      }
    }
    return best;
  }

  #applyOrbit(p) {
    const o = this.orbit;
    const cam = this.camera;
    const dx = p.x - o.last.x;
    const dy = p.y - o.last.y;
    o.last = p;
    if (!dx && !dy) return;

    cam.yaw += dx * 0.008;
    cam.pitch = Math.max(-1.4, Math.min(1.4, cam.pitch - dy * 0.008));
    this.#setCamFromTarget(o.target, o.local);
  }

  #applyPan(p) {
    const pan = this.pan;
    const cam = this.camera;
    const dx = p.x - pan.last.x;
    const dy = p.y - pan.last.y;
    pan.last = p;
    if (!dx && !dy) return;

    const focal = Math.min(this.cssW, this.cssH) * 0.9;
    const scale = pan.local.z / focal;
    const { right, up } = lookVectors(cam.yaw, cam.pitch);
    cam.x += (-right.x * dx + up.x * dy) * scale;
    cam.y += (-right.y * dx + up.y * dy) * scale;
    cam.z += (-right.z * dx + up.z * dy) * scale;
  }

  #applyZoom(p) {
    const z = this.zoom;
    const dx = p.x - z.last.x;
    const dy = p.y - z.last.y;
    z.last = p;
    const delta = dx + dy;
    if (!delta) return;

    z.local.z = Math.max(1, z.local.z * Math.exp(-delta * ZOOM_K));
    this.#setCamFromTarget(z.target, z.local);
  }

  #onMove(e) {
    if (!this.enabled) return;
    const p = this.#eventPos(e);
    if (this.orbit) {
      this.#applyOrbit(p);
      return;
    }
    if (this.pan) {
      this.#applyPan(p);
      return;
    }
    if (this.zoom) {
      this.#applyZoom(p);
      return;
    }
    if (this.look) {
      const dx = p.x - this.lookLast.x;
      const dy = p.y - this.lookLast.y;
      this.lookLast = p;
      this.camera.yaw += dx * 0.008;
      this.camera.pitch = Math.max(-1.4, Math.min(1.4, this.camera.pitch - dy * 0.008));
      return;
    }
    if (this.drag?.kind === "box") {
      this.drag.end = p;
      this.draw();
      return;
    }
    if (this.drag) {
      this.#applyDrag(p);
      this.opts.onChange?.();
      return;
    }
    const doc = this.opts.getDoc();
    if (this.#pointSelActive()) {
      this.hoverGizmo = this.#hitPointGizmo(doc, p.x, p.y);
      this.hoverId = this.#pick(doc, p.x, p.y)?.id || null;
      return;
    }
    const primary = this.#primaryId();
    this.hoverGizmo = primary ? this.#hitHandle(doc, primary, p.x, p.y) : null;
    this.hoverId = this.#pick(doc, p.x, p.y)?.id || null;
  }

  #onUp(e) {
    if (!this.enabled) return;
    const viewEnded = this.look || this.orbit || this.pan || this.zoom;
    if (this.look) this.look = false;
    if (this.orbit) this.orbit = null;
    if (this.pan) this.pan = null;
    if (this.zoom) this.zoom = null;
    if (this.drag?.kind === "box") {
      if (this.drag.partial) this.#finishPointBox();
      else this.#finishBox();
    } else if (this.drag && this.drag.kind !== "select") {
      this.#finishTransform();
      this.opts.endUndo?.();
    }
    this.drag = null;
    if (viewEnded) this.opts.onViewChanged?.();
    try {
      this.canvas.releasePointerCapture(e.pointerId);
    } catch {
      /* ignore */
    }
    this.draw();
  }

  #finishTransform() {
    const d = this.drag;
    if (!d || (d.kind !== "move" && d.kind !== "axis" && d.kind !== "plane")) return;
    const doc = this.opts.getDoc();
    const objs = activeMap(doc).objects;
    for (const orig of d.origs) {
      const obj = objs.find((o) => o.id === orig.id);
      if (!obj) continue;
      if (obj.kind === "doorway") {
        assignDoorRooms(doc, obj, roomById(doc, obj.roomId), false);
        clampObject(obj);
      } else if (obj.kind === "switch") {
        alignSwitchToContact(
          obj,
          objs.filter((o) => o.kind === "room"),
          objs.filter((o) => o.kind === "crate")
        );
        clampObject(obj);
      }
    }
  }

  #axisDelta(p, grab, axis, start, axisLen) {
    return gizmoAxisDragDelta(p, grab, axis, start, axisLen, this.camera, this.cssW, this.cssH);
  }

  #applyFaceDelta(obj, orig, side, delta) {
    const min = 1;
    obj.x = orig.x;
    obj.y = orig.y;
    obj.z = orig.z;
    obj.sx = orig.sx;
    obj.sy = orig.sy;
    obj.sz = orig.sz;
    if (side === "x1") obj.sx = Math.max(min, orig.sx + delta);
    else if (side === "x0") {
      const x1 = orig.x + orig.sx;
      obj.x = Math.min(x1 - min, orig.x + delta);
      obj.sx = x1 - obj.x;
    } else if (side === "y1") obj.sy = Math.max(min, orig.sy + delta);
    else if (side === "y0") {
      const y1 = orig.y + orig.sy;
      obj.y = Math.min(y1 - min, orig.y + delta);
      obj.sy = y1 - obj.y;
    } else if (side === "z1") obj.sz = Math.max(min, orig.sz + delta);
    else if (side === "z0") {
      const z1 = orig.z + orig.sz;
      obj.z = Math.min(z1 - min, orig.z + delta);
      obj.sz = z1 - obj.z;
    }
  }

  #boxRect() {
    const a = this.drag.start;
    const b = this.drag.end;
    const x0 = Math.min(a.x, b.x);
    const y0 = Math.min(a.y, b.y);
    const x1 = Math.max(a.x, b.x);
    const y1 = Math.max(a.y, b.y);
    return { x0, y0, x1, y1, w: x1 - x0, h: y1 - y0 };
  }

  #pointSelActive() {
    return !!(this.pointSel && (this.pointSel.geom.size || this.pointSel.rigid.size));
  }

  clearPointSelection() {
    if (!this.#pointSelActive()) return false;
    this.pointSel = null;
    this.hoverGizmo = null;
    this.draw();
    return true;
  }

  #prunePointSel(doc) {
    if (!this.pointSel) return;
    const ids = new Set(activeMap(doc).objects.map((o) => o.id));
    for (const id of this.pointSel.geom.keys()) if (!ids.has(id)) this.pointSel.geom.delete(id);
    for (const id of this.pointSel.rigid) if (!ids.has(id)) this.pointSel.rigid.delete(id);
    if (!this.pointSel.geom.size && !this.pointSel.rigid.size) this.pointSel = null;
  }

  #controlPoints(obj) {
    if (obj.kind === "room") return roomControlPoints(obj);
    if (obj.kind === "slope") return slopeControlPoints(obj);
    return aabbControlPoints(obj);
  }

  #objInScreenRect(obj, rect) {
    const cam = this.camera;
    const w = this.cssW;
    const h = this.cssH;
    for (let i = 0; i < 8; i++) {
      const pr = projectPoint(cornerWorld(obj, i), cam, w, h);
      if (pr.ok && pr.sx >= rect.x0 && pr.sx <= rect.x1 && pr.sy >= rect.y0 && pr.sy <= rect.y1) return true;
    }
    const c = projectPoint(aabbCenter(obj), cam, w, h);
    return !!(c.ok && c.sx >= rect.x0 && c.sx <= rect.x1 && c.sy >= rect.y0 && c.sy <= rect.y1);
  }

  /** Ctrl marquee: planes whose every corner is inside, plus fixed objects. */
  #collectPointHits(doc, rect, click) {
    const cam = this.camera;
    const w = this.cssW;
    const h = this.cssH;
    const tiny = rect.w < LAYOUT_BOX_CLICK && rect.h < LAYOUT_BOX_CLICK;
    const origin = click || { x: rect.x0, y: rect.y0 };
    const inside = (pr) => {
      if (!pr.ok) return false;
      if (tiny) return Math.hypot(pr.sx - origin.x, pr.sy - origin.y) <= HANDLE + 2;
      return pr.sx >= rect.x0 && pr.sx <= rect.x1 && pr.sy >= rect.y0 && pr.sy <= rect.y1;
    };
    const geom = new Map();
    const rigid = new Set();
    for (const obj of this.#visibleObjects(doc)) {
      if (KINDS[obj.kind].fixed) {
        if (!tiny && this.#objInScreenRect(obj, rect)) rigid.add(obj.id);
        continue;
      }
      const pts = this.#controlPoints(obj);
      const hit = new Set();
      pts.forEach((pt, i) => {
        if (inside(projectPoint(pt, cam, w, h))) hit.add(i);
      });
      const keys = keysForInside(pts, hit);
      if (keys.size) geom.set(obj.id, keys);
    }
    if (tiny) {
      const picked = this.#pick(doc, origin.x, origin.y);
      if (picked) {
        const obj = activeMap(doc).objects.find((o) => o.id === picked.id);
        if (obj && KINDS[obj.kind].fixed) rigid.add(obj.id);
      }
    }
    return { geom, rigid };
  }

  #commitPointHits(hits, additive) {
    if (additive) this.pointSel = unionPointSel(this.pointSel, hits);
    else this.pointSel = hits.geom.size || hits.rigid.size ? hits : null;
  }

  #previewPointSel(doc) {
    if (this.drag?.kind === "box" && this.drag.partial) {
      const hits = this.#collectPointHits(doc, this.#boxRect(), this.drag.start);
      if (this.drag.additive) return unionPointSel(this.pointSel, hits) || { geom: new Map(), rigid: new Set() };
      return hits;
    }
    return this.pointSel;
  }

  #pointsForKeys(obj, keys) {
    const pts = [];
    for (const p of this.#controlPoints(obj)) {
      if (p.keys.some((k) => keys.has(k))) pts.push(p);
    }
    return pts;
  }

  #pointAnchor(doc, sel) {
    if (!sel) return null;
    const objs = activeMap(doc).objects;
    const pts = [];
    for (const [id, keys] of sel.geom) {
      const obj = objs.find((o) => o.id === id);
      if (obj) pts.push(...this.#pointsForKeys(obj, keys));
    }
    for (const id of sel.rigid) {
      const obj = objs.find((o) => o.id === id);
      if (obj) pts.push(gizmoAnchor(obj));
    }
    if (!pts.length) return null;
    let x = 0;
    let y = 0;
    let z = 0;
    for (const p of pts) {
      x += p.x;
      y += p.y;
      z += p.z;
    }
    const n = pts.length;
    return { x: x / n, y: y / n, z: z / n };
  }

  #hitPointGizmo(doc, mx, my) {
    const anchor = this.#pointAnchor(doc, this.pointSel);
    if (!anchor) return null;
    return hitTranslateGizmo(anchor, this.camera, this.cssW, this.cssH, mx, my, HANDLE + 1);
  }

  #hitPointCorner(doc, mx, my) {
    if (!this.pointSel) return null;
    const cam = this.camera;
    const w = this.cssW;
    const h = this.cssH;
    const objs = activeMap(doc).objects;
    let best = null;
    let bestD = HANDLE + 2;
    for (const [id, keys] of this.pointSel.geom) {
      const obj = objs.find((o) => o.id === id);
      if (!obj) continue;
      for (const p of this.#pointsForKeys(obj, keys)) {
        const pr = projectPoint(p, cam, w, h);
        if (!pr.ok) continue;
        const d = Math.hypot(mx - pr.sx, my - pr.sy);
        if (d <= bestD) {
          bestD = d;
          best = p;
        }
      }
    }
    return best;
  }

  #makePointDrag(doc, handle, p) {
    const objs = activeMap(doc).objects;
    const origs = [];
    const specs = [];
    const claimed = new Set();
    const take = (obj) => {
      if (!obj || claimed.has(obj.id)) return;
      claimed.add(obj.id);
      origs.push(snapshotObj(obj));
    };
    for (const [id, keys] of this.pointSel.geom) {
      const obj = objs.find((o) => o.id === id);
      if (!obj) continue;
      take(obj);
      const full = controlSelectionTranslates(this.#controlPoints(obj), keys);
      specs.push({ id, keys: new Set(keys) });
      if (full && obj.kind === "room") {
        for (const other of objs) {
          if (other.kind === "room" || other.kind === "doorway" || claimed.has(other.id)) continue;
          if (other.roomId !== obj.id) continue;
          if (this.pointSel.geom.has(other.id) || this.pointSel.rigid.has(other.id)) continue;
          take(other);
          specs.push({ id: other.id, keys: null });
        }
      }
    }
    for (const id of this.pointSel.rigid) {
      const obj = objs.find((o) => o.id === id);
      if (!obj || claimed.has(obj.id)) continue;
      take(obj);
      specs.push({ id, keys: null });
    }
    const anchor = this.#pointAnchor(doc, this.pointSel) || handle.world;
    const gizmo = gizmoMetrics(anchor, this.camera, this.cssW, this.cssH);
    return {
      points: true,
      kind: handle.kind,
      axis: handle.axis,
      plane: handle.plane,
      start: p,
      origs,
      specs,
      grab: handle.world,
      planeN: handle.planeN || lookVectors(this.camera.yaw, this.camera.pitch).forward,
      gizmoAxisLen: handle.gizmoAxisLen ?? gizmo.axisLen,
    };
  }

  #pointDragDelta(p, d) {
    if (d.kind === "axis") {
      const delta = this.#axisDelta(p, d.grab, d.axis, d.start, d.gizmoAxisLen ?? GIZMO_FALLBACK_LEN);
      if (delta == null) return null;
      return {
        dx: d.axis === "x" ? delta : 0,
        dy: d.axis === "y" ? delta : 0,
        dz: d.axis === "z" ? delta : 0,
      };
    }
    const ray = screenRay(p.x, p.y, this.camera, this.cssW, this.cssH);
    const hit = intersectPlane(ray.origin, ray.dir, d.grab, d.planeN);
    if (!hit) return null;
    let dx = Math.round(hit.point.x - d.grab.x);
    let dy = Math.round(hit.point.y - d.grab.y);
    let dz = Math.round(hit.point.z - d.grab.z);
    if (d.kind === "plane") {
      if (d.plane === "xy") dz = 0;
      else if (d.plane === "xz") dy = 0;
      else if (d.plane === "yz") dx = 0;
    }
    return { dx, dy, dz };
  }

  #applyPointDelta(d, dx, dy, dz) {
    const objs = activeMap(this.opts.getDoc()).objects;
    for (const spec of d.specs) {
      if (!spec.keys) continue;
      const obj = objs.find((o) => o.id === spec.id);
      const orig = d.origs.find((o) => o.id === spec.id);
      if (!obj || !orig) continue;
      if (obj.kind === "room") applyRoomControlDelta(obj, orig, spec.keys, dx, dy, dz);
      else applyAabbControlDelta(obj, orig, spec.keys, dx, dy, dz);
      clampObject(obj);
    }
    for (const spec of d.specs) {
      if (spec.keys) continue;
      const obj = objs.find((o) => o.id === spec.id);
      const orig = d.origs.find((o) => o.id === spec.id);
      if (!obj || !orig) continue;
      obj.x = orig.x + dx;
      obj.y = orig.y + dy;
      obj.z = orig.z + dz;
      clampObject(obj);
    }
  }

  #finishPointBox() {
    const hits = this.#collectPointHits(this.opts.getDoc(), this.#boxRect(), this.drag.start);
    this.#commitPointHits(hits, this.drag.additive);
  }

  #drawPointMarkers(ctx, doc, sel, cam, w, h) {
    if (!sel?.geom.size) return;
    const objs = activeMap(doc).objects;
    ctx.fillStyle = "#f2d36b";
    for (const [id, keys] of sel.geom) {
      const obj = objs.find((o) => o.id === id);
      if (!obj) continue;
      for (const p of this.#pointsForKeys(obj, keys)) {
        const pr = projectPoint(p, cam, w, h);
        if (!pr.ok) continue;
        ctx.fillRect(pr.sx - 2.5, pr.sy - 2.5, 5, 5);
      }
    }
  }

  #finishBox() {
    const rect = this.#boxRect();
    const additive = this.drag.additive;
    if (rect.w < LAYOUT_BOX_CLICK && rect.h < LAYOUT_BOX_CLICK) {
      const hit = this.#pick(this.opts.getDoc(), this.drag.start.x, this.drag.start.y);
      if (hit) {
        if (additive) this.opts.onToggleSelect?.(hit.id);
        else this.opts.onSelectIds?.([hit.id]);
      } else if (!additive) {
        this.opts.onSelectIds?.([]);
      }
      return;
    }
    const doc = this.opts.getDoc();
    const cam = this.camera;
    const w = this.cssW;
    const h = this.cssH;
    const hits = [];
    for (const obj of this.#visibleObjects(doc)) {
      let inside = false;
      for (let i = 0; i < 8; i++) {
        const pr = projectPoint(cornerWorld(obj, i), cam, w, h);
        if (!pr.ok) continue;
        if (pr.sx >= rect.x0 && pr.sx <= rect.x1 && pr.sy >= rect.y0 && pr.sy <= rect.y1) {
          inside = true;
          break;
        }
      }
      if (!inside) {
        const c = projectPoint(aabbCenter(obj), cam, w, h);
        if (c.ok && c.sx >= rect.x0 && c.sx <= rect.x1 && c.sy >= rect.y0 && c.sy <= rect.y1) {
          inside = true;
        }
      }
      if (inside) hits.push(obj.id);
    }
    this.opts.onSelectIds?.(hits, additive);
  }

  #applyDrag(p) {
    const doc = this.opts.getDoc();
    const objs = activeMap(doc).objects;
    const ray = screenRay(p.x, p.y, this.camera, this.cssW, this.cssH);
    const d = this.drag;

    if (d.points) {
      const delta = this.#pointDragDelta(p, d);
      if (!delta) return;
      this.#applyPointDelta(d, delta.dx, delta.dy, delta.dz);
      return;
    }

    if (d.kind === "move") {
      const hit = intersectPlane(ray.origin, ray.dir, d.grab, d.planeN);
      if (!hit) return;
      const dx = Math.round(hit.point.x - d.grab.x);
      const dy = Math.round(hit.point.y - d.grab.y);
      const dz = Math.round(hit.point.z - d.grab.z);
      for (const orig of d.origs) {
        const obj = objs.find((o) => o.id === orig.id);
        if (!obj) continue;
        obj.x = orig.x + dx;
        obj.y = orig.y + dy;
        obj.z = orig.z + dz;
        clampObject(obj);
      }
      for (const orig of d.contents) {
        const obj = objs.find((o) => o.id === orig.id);
        if (!obj) continue;
        obj.x = orig.x + dx;
        obj.y = orig.y + dy;
        obj.z = orig.z + dz;
        clampObject(obj);
      }
      return;
    }

    if (d.kind === "axis") {
      const delta = this.#axisDelta(p, d.grab, d.axis, d.start, d.gizmoAxisLen ?? GIZMO_FALLBACK_LEN);
      if (delta == null) return;
      for (const orig of d.origs) {
        const obj = objs.find((o) => o.id === orig.id);
        if (!obj) continue;
        obj[d.axis] = orig[d.axis] + delta;
        clampObject(obj);
      }
      for (const orig of d.contents) {
        const obj = objs.find((o) => o.id === orig.id);
        if (!obj) continue;
        obj[d.axis] = orig[d.axis] + delta;
        clampObject(obj);
      }
      return;
    }

    if (d.kind === "plane") {
      const hit = intersectPlane(ray.origin, ray.dir, d.grab, d.planeN);
      if (!hit) return;
      let dx = Math.round(hit.point.x - d.grab.x);
      let dy = Math.round(hit.point.y - d.grab.y);
      let dz = Math.round(hit.point.z - d.grab.z);
      if (d.plane === "xy") dz = 0;
      else if (d.plane === "xz") dy = 0;
      else if (d.plane === "yz") dx = 0;
      for (const orig of d.origs) {
        const obj = objs.find((o) => o.id === orig.id);
        if (!obj) continue;
        obj.x = orig.x + dx;
        obj.y = orig.y + dy;
        obj.z = orig.z + dz;
        clampObject(obj);
      }
      for (const orig of d.contents) {
        const obj = objs.find((o) => o.id === orig.id);
        if (!obj) continue;
        obj.x = orig.x + dx;
        obj.y = orig.y + dy;
        obj.z = orig.z + dz;
        clampObject(obj);
      }
      return;
    }

    if (d.kind === "split") {
      const orig = d.origs.find((o) => o.id === d.primaryId) || d.origs[0];
      const obj = objs.find((o) => o.id === orig.id);
      if (!obj || obj.kind !== "room") return;
      const delta = this.#axisDelta(p, d.grab, d.axis, d.start, d.gizmoAxisLen ?? GIZMO_FALLBACK_LEN);
      if (delta == null) return;
      applyRoomSplitDelta(obj, orig, d.key, delta * (d.scale || 1));
      clampObject(obj);
      return;
    }

    if (d.kind === "face") {
      const orig = d.origs.find((o) => o.id === d.primaryId) || d.origs[0];
      const obj = objs.find((o) => o.id === orig.id);
      if (!obj || KINDS[obj.kind].fixed) return;
      const delta = this.#axisDelta(p, d.grab, d.axis, d.start, d.gizmoAxisLen ?? GIZMO_FALLBACK_LEN);
      if (delta == null) return;
      this.#applyFaceDelta(obj, orig, d.side, delta);
      if (obj.kind === "room") preserveRoomSplits(obj, orig);
      clampObject(obj);
    }
  }

  #visibleObjects(doc) {
    const local = this.opts.getLocalMode?.() || false;
    const focus = this.opts.getFocusRoom?.() || null;
    const neighbours = !!(local && this.opts.getNeighbourMode?.());
    const roomsOnly = !!this.opts.getRoomsOnlyMode?.();
    return activeMap(doc).objects.filter((o) =>
      objectVisible(doc, o, local, focus, neighbours, roomsOnly)
    );
  }

  #objectSegments(doc, obj) {
    /** @type {{a:{x:number,y:number,z:number},b:{x:number,y:number,z:number}}[]} */
    const segs = [];
    if (obj.kind === "room") {
      const g = roomGeometry(obj);
      for (const e of g.edges) {
        segs.push({ a: g.verts[e.a], b: g.verts[e.b] });
      }
      return segs;
    }
    if (isFigureObject(obj)) {
      const tmpl = findEnemyTemplate(doc, figureTemplateName(obj));
      const verts = enemyPlacementWorldVerts(obj, tmpl);
      if (tmpl && verts.length) {
        for (const [i, j] of tmpl.lines) {
          if (verts[i] && verts[j]) segs.push({ a: verts[i], b: verts[j] });
        }
      }
      for (const [i, j] of BOX_EDGES) {
        segs.push({ a: cornerWorld(obj, i), b: cornerWorld(obj, j) });
      }
      return segs;
    }
    if (obj.kind === "platform") {
      const y = (obj.y | 0) + (obj.sy | 0);
      segs.push(
        { a: { x: obj.x, y, z: obj.z }, b: { x: obj.x + obj.sx, y, z: obj.z } },
        { a: { x: obj.x + obj.sx, y, z: obj.z }, b: { x: obj.x + obj.sx, y, z: obj.z + obj.sz } },
        { a: { x: obj.x + obj.sx, y, z: obj.z + obj.sz }, b: { x: obj.x, y, z: obj.z + obj.sz } },
        { a: { x: obj.x, y, z: obj.z + obj.sz }, b: { x: obj.x, y, z: obj.z } }
      );
      return segs;
    }
    if (obj.kind === "pickup") {
      const mesh = itemMeshFor(doc, obj.pickup);
      for (const s of itemMeshWorldSegs(obj, mesh, itemYawFor(doc, obj.pickup, obj.rot))) segs.push(s);
      return segs;
    }
    if (obj.kind === "slope") {
      for (const s of rampSegments(obj)) segs.push(s);
      return segs;
    }
    for (const [i, j] of BOX_EDGES) {
      segs.push({ a: cornerWorld(obj, i), b: cornerWorld(obj, j) });
    }
    for (const s of this.#glyphSegments(obj)) segs.push(s);
    return segs;
  }

  #glyphSegments(obj) {
    const segs = [];
    if (obj.kind === "switch") {
      const f = faceCorners(obj.face);
      const a = cornerWorld(obj, f[0]);
      const b = cornerWorld(obj, f[1]);
      const c = cornerWorld(obj, f[2]);
      const d = cornerWorld(obj, f[3]);
      const apex = {
        x: (a.x + b.x + c.x + d.x) / 4,
        y: Math.max(a.y, b.y, c.y, d.y),
        z: (a.z + b.z + c.z + d.z) / 4,
      };
      const left = { x: (a.x + d.x) / 2, y: (a.y + d.y) / 2, z: (a.z + d.z) / 2 };
      const right = { x: (b.x + c.x) / 2, y: (b.y + c.y) / 2, z: (b.z + c.z) / 2 };
      segs.push({ a: apex, b: left }, { a: left, b: right }, { a: right, b: apex });
    }
    return segs;
  }

  #pick(doc, mx, my) {
    const cam = this.camera;
    const w = this.cssW;
    const h = this.cssH;
    let bestLine = null;
    for (const obj of this.#visibleObjects(doc)) {
      for (const seg of this.#objectSegments(doc, obj)) {
        const pl = projectLine(seg.a, seg.b, cam, w, h);
        if (!pl) continue;
        const d = distPointToSegment2d(mx, my, pl.ax, pl.ay, pl.bx, pl.by);
        if (d > LINE_HIT) continue;
        const mid = {
          x: (seg.a.x + seg.b.x) / 2,
          y: (seg.a.y + seg.b.y) / 2,
          z: (seg.a.z + seg.b.z) / 2,
        };
        const depth =
          (mid.x - cam.x) ** 2 + (mid.y - cam.y) ** 2 + (mid.z - cam.z) ** 2;
        if (!bestLine || d < bestLine.d - 0.01 || (Math.abs(d - bestLine.d) < 0.01 && depth < bestLine.depth)) {
          bestLine = { id: obj.id, d, depth, point: mid };
        }
      }
    }
    if (bestLine) return { id: bestLine.id, t: bestLine.depth, point: bestLine.point };

    const ray = screenRay(mx, my, cam, w, h);
    let best = null;
    for (const obj of this.#visibleObjects(doc)) {
      if (obj.kind === "room") {
        const g = roomGeometry(obj);
        for (const c of g.colliders) {
          const hit = rayAabb(ray.origin, ray.dir, c);
          if (hit && (!best || hit.t < best.t)) best = { id: obj.id, t: hit.t, point: hit.point };
        }
        continue;
      }
      const hit = rayAabb(ray.origin, ray.dir, obj);
      if (!hit) continue;
      if (!best || hit.t < best.t) best = { id: obj.id, t: hit.t, point: hit.point };
    }
    return best;
  }

  #hitHandle(doc, id, mx, my) {
    const obj = activeMap(doc).objects.find((o) => o.id === id);
    if (!obj) return null;
    const cam = this.camera;
    const w = this.cssW;
    const h = this.cssH;
    if (obj.kind === "room") {
      const g = roomGeometry(obj);
      for (const handle of g.handles) {
        const pr = projectPoint(handle.world, cam, w, h);
        if (!pr.ok) continue;
        if (Math.hypot(mx - pr.sx, my - pr.sy) < HANDLE + 2) {
          if (handle.kind === "face") {
            return { kind: "face", side: handle.side, axis: handle.axis, world: handle.world };
          }
          return { kind: "split", key: handle.key, axis: handle.axis, scale: handle.scale, world: handle.world };
        }
      }
    } else if (!KINDS[obj.kind].fixed) {
      for (const handle of this.#aabbFaceHandles(obj)) {
        const pr = projectPoint(handle.world, cam, w, h);
        if (!pr.ok) continue;
        if (Math.hypot(mx - pr.sx, my - pr.sy) < HANDLE + 2) {
          return { kind: "face", side: handle.side, axis: handle.axis, world: handle.world };
        }
      }
    }
    const c = gizmoAnchor(obj);
    const gizmoHit =hitTranslateGizmo(c, cam, w, h, mx, my, HANDLE + 1);
    if (gizmoHit) return gizmoHit;
    return null;
  }

  /** Selected room or owner of the newest selected object — not lastRoomId. */
  #selectedPlaceRoom(doc) {
    const ids = this.#selectedIds();
    const objs = activeMap(doc).objects;
    for (let i = ids.length - 1; i >= 0; i--) {
      const obj = objs.find((o) => o.id === ids[i]);
      if (!obj) continue;
      if (obj.kind === "room") return obj;
      const r = roomById(doc, obj.roomId);
      if (r) return r;
    }
    return null;
  }

  /** Hull hit across rooms. Selected room wins if the ray hits it at all. */
  #nearestRoomHull(rooms, ray, pred, focus) {
    if (focus && rooms.some((r) => r.id === focus.id)) {
      const hit = rayRoomHull(focus, ray.origin, ray.dir, pred);
      if (hit) return { ...hit, room: focus };
    }
    let best = null;
    for (const room of rooms) {
      const hit = rayRoomHull(room, ray.origin, ray.dir, pred);
      if (!hit) continue;
      if (!best || hit.t < best.t) best = { ...hit, room };
    }
    return best;
  }

  /** Top of elevator / solid platform, or ramp surface. Seen from above only. */
  #rayWalkableTop(obj, ray) {
    if (obj.kind === "elevator" || (obj.kind === "platform" && obj.collide !== false)) {
      if (ray.dir.y >= 0) return null;
      const y = (obj.y | 0) + (obj.sy | 0);
      const hit = intersectPlane(ray.origin, ray.dir, { x: 0, y, z: 0 }, { x: 0, y: 1, z: 0 });
      if (!hit) return null;
      const p = hit.point;
      if (p.x < obj.x || p.x > obj.x + obj.sx || p.z < obj.z || p.z > obj.z + obj.sz) return null;
      return { t: hit.t, point: p, y };
    }
    if (obj.kind !== "slope") return null;
    const { p0, p1, p2, p3 } = rampCorners(obj);
    let best = null;
    for (const tri of [
      [p0, p1, p2],
      [p0, p2, p3],
    ]) {
      const [a, b, c] = tri;
      const e1 = { x: b.x - a.x, y: b.y - a.y, z: b.z - a.z };
      const e2 = { x: c.x - a.x, y: c.y - a.y, z: c.z - a.z };
      let ny = e1.z * e2.x - e1.x * e2.z;
      let nx = e1.y * e2.z - e1.z * e2.y;
      let nz = e1.x * e2.y - e1.y * e2.x;
      if (ny < 0) {
        nx = -nx;
        ny = -ny;
        nz = -nz;
      }
      if (ny < 1e-6 || nx * ray.dir.x + ny * ray.dir.y + nz * ray.dir.z >= 0) continue;
      const hit = rayTriangle(ray.origin, ray.dir, a, b, c);
      if (hit && (!best || hit.t < best.t)) best = hit;
    }
    if (!best) return null;
    return { t: best.t, point: best.point, y: best.point.y };
  }

  /**
   * No floor or walkable top under the ray: never stick to the roof or an outer face.
   * Use the room the ray hit (selected room wins), else the selected room, and drop at
   * that room's floor height where the ray crosses it.
   */
  #floorHeightPose(visRooms, ray, focus, pose) {
    const any = this.#nearestRoomHull(visRooms, ray, null, focus);
    const room = any?.room || focus;
    if (!room) return null;
    let hx = room.x + room.sx / 2;
    let hz = room.z + room.sz / 2;
    if (any) {
      hx = any.point.x;
      hz = any.point.z;
    }
    const y = Math.round(roomFloorY(room, hx, hz));
    const plane = intersectPlane(ray.origin, ray.dir, { x: 0, y, z: 0 }, { x: 0, y: 1, z: 0 });
    if (plane) {
      hx = plane.point.x;
      hz = plane.point.z;
    }
    return pose(hx, y, hz, room, false);
  }

  /** Drop pose from screen: hull faces under the cursor; walkable tops beat floor. */
  placeAtScreen(mx, my, kind) {
    const doc = this.opts.getDoc();
    const ray = screenRay(mx, my, this.camera, this.cssW, this.cssH);
    const def = KINDS[kind] || KINDS.crate;
    const sx = def.defaultSize[0];
    const sz = def.defaultSize[2];
    const pose = (x, y, z, room, floorSnap) => ({
      x: Math.round(x - sx / 2),
      y,
      z: Math.round(z - sz / 2),
      room,
      floorSnap: floorSnap !== false,
    });

    if (kind !== "room") {
      const visible = this.#visibleObjects(doc);
      const visRooms = visible.filter((o) => o.kind === "room");
      const focus = this.#selectedPlaceRoom(doc);

      if (kind === "doorway" || kind === "switch") {
        const wall = this.#nearestRoomHull(visRooms, ray, (f) => f.axis !== "y", focus);
        let mount = wall
          ? { t: wall.t, point: wall.point, face: wall.face, room: wall.room }
          : null;
        if (kind === "switch") {
          for (const obj of visible) {
            if (obj.kind !== "crate") continue;
            const hit = rayCrateSwitchFace(obj, ray.origin, ray.dir);
            if (!hit || (mount && hit.t >= mount.t)) continue;
            mount = {
              t: hit.t,
              point: hit.point,
              face: hit.face,
              room: roomById(doc, obj.roomId) || mount?.room || null,
            };
          }
        }
        if (mount) {
          return {
            ...pose(
              mount.point.x,
              Math.round(mount.point.y - def.defaultSize[1] / 2),
              mount.point.z,
              mount.room,
              false
            ),
            face: mount.face,
            hitY: mount.point.y,
          };
        }
      }

      // Only doors/switches mount on faces. Everything else passes through roofs, outer
      // walls and undersides: floors count only when seen from above.
      const floorHit =
        ray.dir.y < 0
          ? this.#nearestRoomHull(visRooms, ray, (f) => f.axis === "y" && f.sign === -1, focus)
          : null;
      let walk = null;
      for (const obj of visible) {
        const hit = this.#rayWalkableTop(obj, ray);
        if (!hit) continue;
        if (!walk || hit.t < walk.t) walk = { ...hit, obj };
      }
      if (walk && (!floorHit || walk.t <= floorHit.t + 1e-4)) {
        const room = roomById(doc, walk.obj.roomId) || floorHit?.room;
        return pose(walk.point.x, Math.round(walk.y), walk.point.z, room, false);
      }
      if (floorHit) {
        return pose(
          floorHit.point.x,
          Math.round(floorHit.face.plane),
          floorHit.point.z,
          floorHit.room,
          true
        );
      }
      const dropped = this.#floorHeightPose(visRooms, ray, focus, pose);
      if (dropped) return dropped;
    }

    if (kind === "room") {
      const door = this.#selectedDoor(doc);
      if (door) {
        const y = door.y | 0;
        const plane = intersectPlane(ray.origin, ray.dir, { x: 0, y, z: 0 }, { x: 0, y: 1, z: 0 });
        if (plane) return pose(plane.point.x, y, plane.point.z, undefined, true);
        const grid = intersectPlane(
          ray.origin,
          ray.dir,
          { x: 0, y: this.gridY, z: 0 },
          { x: 0, y: 1, z: 0 }
        );
        if (grid) return pose(grid.point.x, y, grid.point.z, undefined, true);
        const { forward } = lookVectors(this.camera.yaw, this.camera.pitch);
        return pose(this.camera.x + forward.x * 12, y, this.camera.z + forward.z * 12, undefined, true);
      }
    }

    const gy = this.gridY;
    const grid = intersectPlane(ray.origin, ray.dir, { x: 0, y: gy, z: 0 }, { x: 0, y: 1, z: 0 });
    if (grid) {
      return pose(grid.point.x, gy, grid.point.z, undefined, true);
    }
    const { forward } = lookVectors(this.camera.yaw, this.camera.pitch);
    return pose(this.camera.x + forward.x * 12, gy, this.camera.z + forward.z * 12, undefined, true);
  }

  #focusBox(doc, objs) {
    let room = null;
    for (let i = objs.length - 1; i >= 0; i--) {
      const o = objs[i];
      if (o.kind === "room") {
        room = o;
        break;
      }
      room = roomById(doc, o.roomId);
      if (room) break;
    }
    if (!room) room = this.opts.getFocusRoom?.() || null;
    if (room) {
      const cols = roomGeometry(room).colliders;
      const boxes = cols?.length ? cols : [room];
      let minx = Infinity;
      let miny = Infinity;
      let minz = Infinity;
      let maxx = -Infinity;
      let maxy = -Infinity;
      let maxz = -Infinity;
      for (const c of boxes) {
        minx = Math.min(minx, c.x);
        miny = Math.min(miny, c.y);
        minz = Math.min(minz, c.z);
        maxx = Math.max(maxx, c.x + c.sx);
        maxy = Math.max(maxy, c.y + c.sy);
        maxz = Math.max(maxz, c.z + c.sz);
      }
      return { x: minx, y: miny, z: minz, sx: maxx - minx, sy: maxy - miny, sz: maxz - minz };
    }
    let minx = Infinity;
    let miny = Infinity;
    let minz = Infinity;
    let maxx = -Infinity;
    let maxy = -Infinity;
    let maxz = -Infinity;
    for (const o of objs) {
      minx = Math.min(minx, o.x);
      miny = Math.min(miny, o.y);
      minz = Math.min(minz, o.z);
      maxx = Math.max(maxx, o.x + o.sx);
      maxy = Math.max(maxy, o.y + o.sy);
      maxz = Math.max(maxz, o.z + o.sz);
    }
    return { x: minx, y: miny, z: minz, sx: maxx - minx, sy: maxy - miny, sz: maxz - minz };
  }

  /** Keep look; frame the containing room at about half the viewport. */
  focusSelection() {
    const ids = this.#selectedIds();
    if (!ids.length) return false;
    const doc = this.opts.getDoc();
    const objs = ids
      .map((id) => activeMap(doc).objects.find((o) => o.id === id))
      .filter(Boolean);
    if (!objs.length) return false;

    const box = this.#focusBox(doc, objs);
    const center = aabbCenter(box);
    const cam = this.camera;
    const { forward, right, up } = lookVectors(cam.yaw, cam.pitch);
    const w = this.cssW;
    const h = this.cssH;
    const focal = Math.min(w, h) * 0.9;
    const pad = 0.5;
    const halfW = Math.max(1, w * 0.5 * pad);
    const halfH = Math.max(1, h * 0.5 * pad);

    let frameDist = 4;
    for (let i = 0; i < 8; i++) {
      const c = cornerWorld(box, i);
      const rx = c.x - center.x;
      const ry = c.y - center.y;
      const rz = c.z - center.z;
      const cx = rx * right.x + ry * right.y + rz * right.z;
      const cy = rx * up.x + ry * up.y + rz * up.z;
      const cz = rx * forward.x + ry * forward.y + rz * forward.z;
      frameDist = Math.max(frameDist, (Math.abs(cx) * focal) / halfW - cz);
      frameDist = Math.max(frameDist, (Math.abs(cy) * focal) / halfH - cz);
      frameDist = Math.max(frameDist, 1 - cz);
    }

    const dist = Math.max(frameDist, 1);
    cam.x = center.x - forward.x * dist;
    cam.y = center.y - forward.y * dist;
    cam.z = center.z - forward.z * dist;
    this.opts.onViewChanged?.();
    this.draw();
    return true;
  }

  draw() {
    if (!this.enabled) return;
    const ctx = this.ctx;
    const w = this.cssW;
    const h = this.cssH;
    if (!w || !h) return;
    ctx.fillStyle = "#0a0a0c";
    ctx.fillRect(0, 0, w, h);

    const doc = this.opts.getDoc();
    const cam = this.camera;
    this.#prunePointSel(doc);
    const pointPreview = this.#previewPointSel(doc);
    const selected = new Set(this.#selectedIds());
    if (pointPreview) {
      for (const id of pointPreview.rigid) selected.add(id);
    }
    if (this.drag?.kind === "box" && !this.drag.partial) {
      const r = this.#boxRect();
      if (r.w >= LAYOUT_BOX_CLICK || r.h >= LAYOUT_BOX_CLICK) {
        for (const obj of this.#visibleObjects(doc)) {
          for (let i = 0; i < 8; i++) {
            const pr = projectPoint(cornerWorld(obj, i), cam, w, h);
            if (pr.ok && pr.sx >= r.x0 && pr.sx <= r.x1 && pr.sy >= r.y0 && pr.sy <= r.y1) {
              selected.add(obj.id);
              break;
            }
          }
        }
      }
    }
    const local = this.opts.getLocalMode?.() || false;
    const neighbours = !!(local && this.opts.getNeighbourMode?.());
    const tag = local ? (neighbours ? "LOCAL+N" : "LOCAL") : "ALL";
    const primary = this.#primaryId();
    this.#syncGridY(doc);

    this.#drawGrid(ctx, cam, w, h);

    const objs = [...this.#visibleObjects(doc)].sort((a, b) => {
      const ca = aabbCenter(a);
      const cb = aabbCenter(b);
      const da = (ca.x - cam.x) ** 2 + (ca.y - cam.y) ** 2 + (ca.z - cam.z) ** 2;
      const db = (cb.x - cam.x) ** 2 + (cb.y - cam.y) ** 2 + (cb.z - cam.z) ** 2;
      return db - da;
    });

    for (const obj of objs) {
      const sel = selected.has(obj.id);
      const hi = sel || obj.id === this.hoverId;
      this.#drawObject(ctx, doc, obj, cam, w, h, hi, sel, obj.id === primary);
    }

    this.#drawOutsideRoomMarks(ctx, doc, objs, selected, cam, w, h);

    if (this.placePreview && this.placePreviewOverCanvas) {
      ctx.globalAlpha = 0.85;
      this.#drawObject(ctx, doc, this.placePreview, cam, w, h, true, false, false);
      ctx.globalAlpha = 1;
    }

    this.#drawSearchArrows(ctx, doc, cam, w, h);

    const selIds = this.#selectedIds();
    if (selIds.length === 1) {
      const elev = objs.find((o) => o.id === selIds[0] && o.kind === "elevator");
      if (elev) this.#drawElevDestGhosts(ctx, doc, elev, cam, w, h);
    }

    this.#drawPointMarkers(ctx, doc, pointPreview, cam, w, h);
    if (this.#pointSelActive() && this.drag?.kind !== "box") {
      const anchor = this.#pointAnchor(doc, this.pointSel);
      if (anchor) {
        drawTranslateGizmo(ctx, anchor, cam, w, h, { hoverGizmo: this.hoverGizmo, drag: this.drag });
      }
    }

    if (this.drag?.kind === "box") {
      const r = this.#boxRect();
      ctx.fillStyle = "rgba(212, 160, 23, 0.12)";
      ctx.fillRect(r.x0, r.y0, r.w, r.h);
      ctx.strokeStyle = "#d4a017";
      ctx.lineWidth = 1;
      ctx.setLineDash([4, 3]);
      ctx.strokeRect(r.x0 + 0.5, r.y0 + 0.5, r.w, r.h);
      ctx.setLineDash([]);
    }

    ctx.fillStyle = "#8b91a0";
    ctx.font = "11px Segoe UI, sans-serif";
    ctx.fillText(
      `xyz ${cam.x | 0},${cam.y | 0},${cam.z | 0}  ${tag}  spd ${cam.speed | 0}`,
      8,
      16
    );
  }

  #syncGridY(doc) {
    const id = this.#primaryId();
    if (!id) return;
    const obj = activeMap(doc).objects.find((o) => o.id === id);
    if (obj?.kind === "room") this.gridY = obj.y;
  }

  #drawGrid(ctx, cam, w, h) {
    const y = this.gridY;
    ctx.lineWidth = 1;
    ctx.strokeStyle = "#3d4658";
    for (let i = 0; i <= WORLD_SIZE; i += 8) {
      this.#line3(ctx, { x: i, y, z: 0 }, { x: i, y, z: WORLD_SIZE }, cam, w, h);
      this.#line3(ctx, { x: 0, y, z: i }, { x: WORLD_SIZE, y, z: i }, cam, w, h);
    }
    ctx.strokeStyle = "#6a7388";
    for (let i = 0; i <= WORLD_SIZE; i += 32) {
      this.#line3(ctx, { x: i, y, z: 0 }, { x: i, y, z: WORLD_SIZE }, cam, w, h);
      this.#line3(ctx, { x: 0, y, z: i }, { x: WORLD_SIZE, y, z: i }, cam, w, h);
    }
    ctx.strokeStyle = "#9aa3b5";
    this.#line3(ctx, { x: 0, y, z: 0 }, { x: WORLD_SIZE, y, z: 0 }, cam, w, h);
    this.#line3(ctx, { x: 0, y, z: 0 }, { x: 0, y, z: WORLD_SIZE }, cam, w, h);
    this.#line3(ctx, { x: 0, y: 0, z: 0 }, { x: 0, y: WORLD_SIZE, z: 0 }, cam, w, h);
  }

  /** Interior hull faces (floor and walls seen from inside), tinted with the room background. */
  #drawRoomWalls(ctx, obj, geom, cam, w, h) {
    const faces = [];
    for (const f of geom.hullFaces || []) {
      if (!f.corners || f.corners.length < 4) continue;
      // Outward normal is `sign` along `axis`. Shade only when the camera is on the inside.
      if ((cam[f.axis] - f.plane) * f.sign >= 0) continue;
      const center = f.center || {
        x: (f.corners[0].x + f.corners[2].x) / 2,
        y: (f.corners[0].y + f.corners[2].y) / 2,
        z: (f.corners[0].z + f.corners[2].z) / 2,
      };
      const cc = worldToCamera(center, cam);
      if (cc.z < NEAR) continue;
      const pts = [];
      let ok = true;
      for (let i = 0; i < 4; i++) {
        const pr = projectPoint(f.corners[i], cam, w, h);
        if (!pr.ok) {
          ok = false;
          break;
        }
        pts.push(pr);
      }
      if (!ok) continue;
      let area = 0;
      for (let i = 0; i < 4; i++) {
        const a = pts[i];
        const b = pts[(i + 1) % 4];
        area += a.sx * b.sy - b.sx * a.sy;
      }
      if (Math.abs(area) < 24) continue;
      faces.push({ pts, z: cc.z });
    }
    if (!faces.length) return;
    faces.sort((a, b) => b.z - a.z);
    ctx.fillStyle = hexAlpha(a8Hex(obj.a8Bg ?? ROOM_BG_DEFAULT), 0.4);
    for (const face of faces) {
      ctx.beginPath();
      ctx.moveTo(face.pts[0].sx, face.pts[0].sy);
      for (let i = 1; i < 4; i++) ctx.lineTo(face.pts[i].sx, face.pts[i].sy);
      ctx.closePath();
      ctx.fill();
    }
  }

  #line3(ctx, a, b, cam, w, h, color) {
    const seg = projectLine(a, b, cam, w, h);
    if (!seg) return;
    if (color) ctx.strokeStyle = color;
    ctx.beginPath();
    ctx.moveTo(seg.ax, seg.ay);
    ctx.lineTo(seg.bx, seg.by);
    ctx.stroke();
  }

  /** Downward marker above each Maps-panel search hit. Ignores Local / Rooms Only. */
  #drawSearchArrows(ctx, doc, cam, w, h) {
    const terms = layoutSearchTerms(this.opts.getLayoutSearch?.() || "");
    if (!terms.length) return;
    ctx.lineWidth = 2.5;
    ctx.strokeStyle = "#5ad0ff";
    for (const obj of activeMap(doc).objects) {
      if (!objectMatchesLayoutSearch(obj, terms)) continue;
      const cx = obj.x + obj.sx / 2;
      const cz = obj.z + obj.sz / 2;
      const tipY = (obj.y | 0) + (obj.sy | 0) + 1;
      const head = 4;
      const half = 2;
      const tip = { x: cx, y: tipY, z: cz };
      const neckY = tipY + head;
      const tail = { x: cx, y: neckY + 16, z: cz };
      this.#line3(ctx, tail, tip, cam, w, h);
      this.#line3(ctx, tip, { x: cx - half, y: neckY, z: cz }, cam, w, h);
      this.#line3(ctx, tip, { x: cx + half, y: neckY, z: cz }, cam, w, h);
      this.#line3(ctx, tip, { x: cx, y: neckY, z: cz - half }, cam, w, h);
      this.#line3(ctx, tip, { x: cx, y: neckY, z: cz + half }, cam, w, h);
    }
  }

  #drawObject(ctx, doc, obj, cam, w, h, highlight, selected, primary) {
    const color = highlight
      ? "#f2d36b"
      : obj.kind === "room"
        ? a8InkHex(obj.a8Bg ?? ROOM_BG_DEFAULT)
        : obj.kind === "spawn" && !obj.enabled
          ? "#1a7a3c"
          : KINDS[obj.kind].color;
    ctx.lineWidth = selected ? 2 : 1;
    ctx.strokeStyle = color;

    if (isFigureObject(obj)) {
      ctx.globalAlpha = selected ? 0.35 : 0.2;
      for (const [i, j] of BOX_EDGES) {
        this.#line3(ctx, cornerWorld(obj, i), cornerWorld(obj, j), cam, w, h);
      }
      ctx.globalAlpha = 1;
      const tmpl = findEnemyTemplate(doc, figureTemplateName(obj));
      const verts = enemyPlacementWorldVerts(obj, tmpl);
      if (tmpl && verts.length) {
        ctx.lineWidth = selected ? 2 : 1.5;
        for (const [i, j] of tmpl.lines) {
          if (verts[i] && verts[j]) this.#line3(ctx, verts[i], verts[j], cam, w, h);
        }
      }
      if (obj.kind === "spawn" && obj.showJump) this.#drawJumpArc(ctx, doc, obj, cam, w, h);
    } else if (obj.kind === "pickup") {
      const mesh = itemMeshFor(doc, obj.pickup);
      for (const seg of itemMeshWorldSegs(obj, mesh, itemYawFor(doc, obj.pickup, obj.rot))) {
        this.#line3(ctx, seg.a, seg.b, cam, w, h);
      }
    } else if (obj.kind === "room") {
      const g = roomGeometry(obj);
      this.#drawRoomWalls(ctx, obj, g, cam, w, h);
      for (const e of g.edges) {
        this.#line3(ctx, g.verts[e.a], g.verts[e.b], cam, w, h);
      }
    } else if (obj.kind === "slope") {
      for (const seg of rampSegments(obj)) {
        this.#line3(ctx, seg.a, seg.b, cam, w, h);
      }
    } else {
      if (isGhostKind(obj.kind)) ctx.setLineDash([5, 4]);
      for (const [i, j] of BOX_EDGES) {
        this.#line3(ctx, cornerWorld(obj, i), cornerWorld(obj, j), cam, w, h);
      }
      ctx.setLineDash([]);
      this.#drawGlyphs(ctx, obj, cam, w, h, color);
    }
    if (primary && !this.#pointSelActive()) this.#drawGizmo(ctx, obj, cam, w, h);
  }

  /**
   * Spawn "Show jump": the feet's path along the spawn heading at this map's
   * jump speed / gravity (walking speed, flat ground), with a landing cross.
   */
  #drawJumpArc(ctx, doc, obj, cam, w, h) {
    const map = activeMap(doc);
    const yaw = (clampEnemyRot(obj.rot) * Math.PI) / 4;
    const dx = Math.sin(yaw);
    const dz = Math.cos(yaw);
    const at = (p) => ({ x: obj.x + 1 + dx * p.d, y: obj.y + p.y, z: obj.z + 1 + dz * p.d });
    // Land on the first surface under the path (feet may step up JUMP_STEP_UP).
    const floorAt = floorSurfaces(doc);
    const arc = jumpArc(map.jumpSpeed, map.gravity, (a, b) => {
      const w = at(b);
      const top = floorAt(w.x, w.z, w.y, obj.y + a.y + JUMP_STEP_UP);
      return top == null ? null : top - obj.y;
    });
    const n = arc.pts.length;
    const stride = Math.max(1, Math.ceil(n / 80));
    ctx.save();
    ctx.lineWidth = 2;
    ctx.strokeStyle = "#4fe0b0";
    ctx.setLineDash([]);
    let prev = at(arc.pts[0]);
    for (let i = stride; i < n + stride; i += stride) {
      const next = at(arc.pts[Math.min(i, n - 1)]);
      this.#line3(ctx, prev, next, cam, w, h);
      prev = next;
    }
    const land = at(arc.pts[n - 1]);
    ctx.lineWidth = 1;
    this.#line3(ctx, { ...land, x: land.x - 1 }, { ...land, x: land.x + 1 }, cam, w, h);
    this.#line3(ctx, { ...land, z: land.z - 1 }, { ...land, z: land.z + 1 }, cam, w, h);
    ctx.restore();
  }

  /**
   * Objects with vertices outside their assigned room's bbox: dashed violet
   * outline of the model (or box, for non-models; skipped when selected/hovered
   * so the yellow highlight wins), a small diamond above, and a thin tether from
   * the farthest-out vertex to the nearest point of the room's bbox.
   */
  #drawOutsideRoomMarks(ctx, doc, objs, selected, cam, w, h) {
    const outside = outsideRoomBoxMap(doc);
    if (!outside.size) return;
    const color = "#b28cff";
    ctx.strokeStyle = color;
    for (const obj of objs) {
      const room = outside.get(obj.id);
      if (!room) continue;
      const hi = selected.has(obj.id) || obj.id === this.hoverId;
      // Models are judged (and outlined) by their vertices, not the AABB.
      const verts = objectModelVerts(doc, obj);
      const c = verts ? gizmoAnchor(obj) : aabbCenter(obj);
      const modelTop = verts ? Math.max(...verts.map((v) => v.y)) : obj.y + obj.sy;

      ctx.lineWidth = 1;
      ctx.setLineDash([3, 3]);
      if (!hi) {
        if (verts) {
          const tmpl = obj.kind === "pickup" ? null : findEnemyTemplate(doc, figureTemplateName(obj));
          if (obj.kind === "pickup") {
            const mesh = itemMeshFor(doc, obj.pickup);
            for (const seg of itemMeshWorldSegs(obj, mesh, itemYawFor(doc, obj.pickup, obj.rot))) {
              this.#line3(ctx, seg.a, seg.b, cam, w, h);
            }
          } else if (tmpl) {
            for (const [i, j] of tmpl.lines) {
              if (verts[i] && verts[j]) this.#line3(ctx, verts[i], verts[j], cam, w, h);
            }
          }
        } else {
          for (const [i, j] of BOX_EDGES) {
            this.#line3(ctx, cornerWorld(obj, i), cornerWorld(obj, j), cam, w, h);
          }
        }
      }
      // Tether from the vertex farthest outside the room (box center for non-models).
      let from = c;
      let near = null;
      let worst = -1;
      for (const p of verts || [c]) {
        const q = {
          x: Math.max(room.x, Math.min(room.x + room.sx, p.x)),
          y: Math.max(room.y, Math.min(room.y + room.sy, p.y)),
          z: Math.max(room.z, Math.min(room.z + room.sz, p.z)),
        };
        const d = (q.x - p.x) ** 2 + (q.y - p.y) ** 2 + (q.z - p.z) ** 2;
        if (d > worst) {
          worst = d;
          from = p;
          near = q;
        }
      }
      if (worst > 0) {
        ctx.globalAlpha = 0.6;
        this.#line3(ctx, from, near, cam, w, h);
        ctx.globalAlpha = 1;
      }
      ctx.setLineDash([]);

      const top = modelTop + 2;
      const r = 1.25;
      const apexU = { x: c.x, y: top + r, z: c.z };
      const apexD = { x: c.x, y: top - r, z: c.z };
      const ring = [
        { x: c.x - r, y: top, z: c.z },
        { x: c.x, y: top, z: c.z - r },
        { x: c.x + r, y: top, z: c.z },
        { x: c.x, y: top, z: c.z + r },
      ];
      ctx.lineWidth = 1.5;
      for (let i = 0; i < 4; i++) {
        this.#line3(ctx, ring[i], ring[(i + 1) % 4], cam, w, h);
        this.#line3(ctx, apexU, ring[i], cam, w, h);
        this.#line3(ctx, apexD, ring[i], cam, w, h);
      }
    }
    ctx.lineWidth = 1;
  }

  #drawElevDestGhosts(ctx, doc, elev, cam, w, h) {
    const stops = elevStopBottoms(doc, elev);
    const liveTop = (elev.y | 0) + (elev.sy | 0);
    const x0 = elev.x | 0;
    const z0 = elev.z | 0;
    const sx = elev.sx | 0;
    const sz = elev.sz | 0;
    const sy = elev.sy | 0;
    ctx.strokeStyle = KINDS.elevator.color;
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 3]);
    for (const bottom of [stops.dest, stops.home]) {
      const top = bottom + sy;
      if (top === liveTop) continue;
      const corners = [
        { x: x0, y: top, z: z0 },
        { x: x0 + sx, y: top, z: z0 },
        { x: x0 + sx, y: top, z: z0 + sz },
        { x: x0, y: top, z: z0 + sz },
      ];
      for (let i = 0; i < 4; i++) {
        this.#line3(ctx, corners[i], corners[(i + 1) % 4], cam, w, h);
      }
    }
    ctx.setLineDash([]);
  }

  #drawGlyphs(ctx, obj, cam, w, h, color) {
    ctx.strokeStyle = color;
    for (const seg of this.#glyphSegments(obj)) {
      this.#line3(ctx, seg.a, seg.b, cam, w, h);
    }
  }

  #drawGizmo(ctx, obj, cam, w, h) {
    const c = gizmoAnchor(obj);
    drawTranslateGizmo(ctx, c, cam, w, h, { hoverGizmo: this.hoverGizmo, drag: this.drag });
    if (KINDS[obj.kind].fixed) return;
    ctx.fillStyle = "#7ec8e8";
    const handles = obj.kind === "room" ? roomGeometry(obj).handles : this.#aabbFaceHandles(obj);
    for (const handle of handles) {
      const pr = projectPoint(handle.world, cam, w, h);
      if (!pr.ok) continue;
      ctx.fillRect(pr.sx - 4, pr.sy - 4, 8, 8);
    }
  }

  #aabbFaceHandles(obj) {
    const x0 = obj.x | 0;
    const y0 = obj.y | 0;
    const z0 = obj.z | 0;
    const sx = obj.sx | 0;
    const sy = obj.sy | 0;
    const sz = obj.sz | 0;
    const cx = x0 + sx / 2;
    const cy = y0 + sy / 2;
    const cz = z0 + sz / 2;
    const handles = [
      { kind: "face", side: "x0", axis: "x", world: { x: x0, y: cy, z: cz } },
      { kind: "face", side: "x1", axis: "x", world: { x: x0 + sx, y: cy, z: cz } },
      { kind: "face", side: "z0", axis: "z", world: { x: cx, y: cy, z: z0 } },
      { kind: "face", side: "z1", axis: "z", world: { x: cx, y: cy, z: z0 + sz } },
    ];
    if (obj.kind !== "platform") {
      handles.push(
        { kind: "face", side: "y0", axis: "y", world: { x: cx, y: y0, z: cz } },
        { kind: "face", side: "y1", axis: "y", world: { x: cx, y: y0 + sy, z: cz } }
      );
    }
    return handles;
  }
}


// ---- js/overheadView.js ----
const ORTHO = {
