  top: { u: "x", v: "z", su: "sx", sv: "sz", hint: "XZ · +Z up · camera arrow" },
  left: { u: "z", v: "y", su: "sz", sv: "sy", hint: "YZ · +Y up · camera arrow" },
  forward: { u: "x", v: "y", su: "sx", sv: "sy", hint: "XY · +Y up · camera arrow" },
};

function hexAlpha(hex, alpha) {
  const h = hex.replace("#", "");
  const r = parseInt(h.slice(0, 2), 16);
  const g = parseInt(h.slice(2, 4), 16);
  const b = parseInt(h.slice(4, 6), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}

class OverheadView {
  constructor(canvas, opts) {
    this.canvas = canvas;
    this.ctx = canvas.getContext("2d");
    this.opts = opts;
    this.mode = "top";
    this._ro = new ResizeObserver(() => this.resize());
    this._ro.observe(canvas.parentElement);
    this.resize();
  }

  setMode(mode) {
    if (!ORTHO[mode] || mode === this.mode) return;
    this.mode = mode;
    this.draw();
  }

  hint() {
    return ORTHO[this.mode].hint;
  }

  resize() {
    const parent = this.canvas.parentElement;
    const rect = parent.getBoundingClientRect();
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const w = Math.max(64, Math.floor(rect.width));
    const h = Math.max(64, Math.floor(rect.height));
    this.canvas.width = Math.floor(w * dpr);
    this.canvas.height = Math.floor(h * dpr);
    this.canvas.style.width = `${w}px`;
    this.canvas.style.height = `${h}px`;
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    this.cssW = w;
    this.cssH = h;
    this.draw();
  }

  draw() {
    const ctx = this.ctx;
    const w = this.cssW;
    const h = this.cssH;
    if (!w || !h) return;
    ctx.fillStyle = "#0a0a0c";
    ctx.fillRect(0, 0, w, h);

    const pad = 8;
    const side = Math.min(w, h) - pad * 2;
    const ox = (w - side) / 2;
    const oy = (h - side) / 2;
    const s = side / WORLD_SIZE;
    const axes = ORTHO[this.mode];

    ctx.strokeStyle = "#8b91a0";
    ctx.strokeRect(ox, oy, side, side);
    ctx.strokeStyle = "#3d4658";
    for (let i = 0; i <= WORLD_SIZE; i += 8) {
      ctx.beginPath();
      ctx.moveTo(ox + i * s, oy);
      ctx.lineTo(ox + i * s, oy + side);
      ctx.moveTo(ox, oy + i * s);
      ctx.lineTo(ox + side, oy + i * s);
      ctx.stroke();
    }
    ctx.strokeStyle = "#6a7388";
    for (let i = 0; i <= WORLD_SIZE; i += 32) {
      ctx.beginPath();
      ctx.moveTo(ox + i * s, oy);
      ctx.lineTo(ox + i * s, oy + side);
      ctx.moveTo(ox, oy + i * s);
      ctx.lineTo(ox + side, oy + i * s);
      ctx.stroke();
    }

    const doc = this.opts.getDoc();
    const cam = this.opts.getCamera();
    const local = this.opts.getLocalMode?.() || false;
    const neighbourOn = !!this.opts.getNeighbourMode?.();
    const roomsOnly = !!this.opts.getRoomsOnlyMode?.();
    const camRoom = currentRoom(doc, cam);
    const focus = local ? this.opts.getFocusRoom?.() || null : camRoom;
    const neigh = focus ? neighbourRooms(doc, focus) : [];
    const vis = local ? localVisibleIds(doc, focus, neighbourOn) : null;
    const cur = focus;
    const selected = new Set(this.opts.getSelectedIds?.() || []);
    const primary = this.opts.getSelectedId?.();
    if (primary) selected.add(primary);

    const toScreen = (u, v) => ({ x: ox + u * s, y: oy + side - v * s });

    const drawBox = (obj, fill, stroke, lw = 1) => {
      const uw = obj[axes.su] * s;
      const vh = obj[axes.sv] * s;
      const p = toScreen(obj[axes.u], obj[axes.v] + obj[axes.sv]);
      ctx.lineWidth = lw;
      if (fill) {
        ctx.fillStyle = fill;
        ctx.fillRect(p.x, p.y, uw, vh);
      }
      ctx.strokeStyle = stroke;
      ctx.strokeRect(p.x, p.y, uw, vh);
    };

    const drawRoom = (obj, fill, stroke, lw = 1) => {
      const g = roomGeometry(obj);
      ctx.lineWidth = lw;
      for (const c of g.colliders) {
        const uw = c[axes.su] * s;
        const vh = c[axes.sv] * s;
        const p = toScreen(c[axes.u], c[axes.v] + c[axes.sv]);
        if (fill) {
          ctx.fillStyle = fill;
          ctx.fillRect(p.x, p.y, uw, vh);
        }
      }
      ctx.strokeStyle = stroke;
      for (const e of g.edges) {
        const a = g.verts[e.a];
        const b = g.verts[e.b];
        if (a[axes.u] === b[axes.u] && a[axes.v] === b[axes.v]) continue;
        const pa = toScreen(a[axes.u], a[axes.v]);
        const pb = toScreen(b[axes.u], b[axes.v]);
        ctx.beginPath();
        ctx.moveTo(pa.x, pa.y);
        ctx.lineTo(pb.x, pb.y);
        ctx.stroke();
      }
    };

    for (const obj of activeMap(doc).objects) {
      if (obj.kind !== "room") continue;
      const isCur = cur && obj.id === cur.id;
      const isN = neigh.some((n) => n.id === obj.id);
      const faded = vis && !vis.has(obj.id);
      const bgHex = a8Hex(obj.a8Bg ?? ROOM_BG_DEFAULT);
      const lineHex = a8InkHex(obj.a8Bg ?? ROOM_BG_DEFAULT);
      const fill = isCur
        ? hexAlpha(bgHex, 0.28)
        : isN
          ? hexAlpha(bgHex, 0.18)
          : hexAlpha(bgHex, 0.08);
      drawRoom(obj, fill, faded ? "#333" : lineHex, isCur ? 2 : 1);
    }

    for (const obj of activeMap(doc).objects) {
      if (obj.kind === "room") continue;
      if (roomsOnly && obj.kind !== "doorway") continue;
      const faded = vis && !vis.has(obj.id);
      const col = faded ? "#444" : KINDS[obj.kind].color;
      if (isGhostKind(obj.kind)) ctx.setLineDash([4, 3]);
      drawBox(obj, null, selected.has(obj.id) ? "#f2d36b" : col, selected.has(obj.id) ? 2 : 1);
      ctx.setLineDash([]);
    }

    const { forward } = lookVectors(cam.yaw, cam.pitch);
    const c = toScreen(cam[axes.u], cam[axes.v]);
    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.arc(c.x, c.y, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#d4a017";
    ctx.beginPath();
    ctx.moveTo(c.x, c.y);
    ctx.lineTo(c.x + forward[axes.u] * 14, c.y - forward[axes.v] * 14);
    ctx.stroke();
  }
}


// ---- js/previewView.js ----
/** Game unique-char viewport (24Ã—16 chars). */
const GAME_VIEW_W = 192;
const GAME_VIEW_H = 128;
const GAME_FOCAL = 100;
/** Draw buffer = CSS frame (C64 1:1.2 PAR). */
const PREVIEW_W = 320;
const PREVIEW_H = 256;
const PREVIEW_EYE = 3.75; // keep in sync with EYE_HEIGHT + EYE_FRAC in src/mem.asm
const PREVIEW_FRAME_W = PREVIEW_W;
const PREVIEW_FRAME_H = PREVIEW_H;
const PREVIEW_SX = PREVIEW_W / GAME_VIEW_W;
const PREVIEW_SY = PREVIEW_H / GAME_VIEW_H;
const PREVIEW_FX = GAME_FOCAL * PREVIEW_SX;
const PREVIEW_FY = GAME_FOCAL * PREVIEW_SY;

/** pistol_lines.png is 24×32, pasted at x=10 on the 48-wide weapon cell. */
const PISTOL_W = 24;
const PISTOL_H = 32;
/** Viewport-relative top-left: sprite (160, 224) plus the x=10 paste. */
const PISTOL_VX = 82;
const PISTOL_VY = 102;

/** FACE_PZ/MZ/PX/MX â†’ yaw so local +Z points out of the door face (door_face_rot). */
const PV_DOOR_YAW = {
  "+z": 0,
  "-z": Math.PI,
  "+x": (192 / 256) * Math.PI * 2,
  "-x": (64 / 256) * Math.PI * 2,
};

function pvRampCorners(obj) {
  const lowY = obj.y;
  const highY = obj.y + obj.sy;
  if (obj.axis === "x") {
    const x0 = obj.dir === 1 ? obj.x : obj.x + obj.sx;
    const x1 = obj.dir === 1 ? obj.x + obj.sx : obj.x;
    return {
      p0: { x: x0, y: lowY, z: obj.z },
      p1: { x: x0, y: lowY, z: obj.z + obj.sz },
      p2: { x: x1, y: highY, z: obj.z + obj.sz },
      p3: { x: x1, y: highY, z: obj.z },
    };
  }
  const z0 = obj.dir === 1 ? obj.z : obj.z + obj.sz;
  const z1 = obj.dir === 1 ? obj.z + obj.sz : obj.z;
  return {
    p0: { x: obj.x, y: lowY, z: z0 },
    p1: { x: obj.x + obj.sx, y: lowY, z: z0 },
    p2: { x: obj.x + obj.sx, y: highY, z: z1 },
    p3: { x: obj.x, y: highY, z: z1 },
  };
}

/** Game ramp: hypotenuses always; flags add low/high horizontals. */
function pvSlopeSegs(obj) {
  const { p0, p1, p2, p3 } = pvRampCorners(obj);
  const segs = [
    { a: p1, b: p2 },
    { a: p3, b: p0 },
  ];
  const flags = clampSlopeFlags(obj.flags);
  if (flags & SLOPE_FLAG_BOTTOM) segs.push({ a: p0, b: p1 });
  if (flags & SLOPE_FLAG_TOP) segs.push({ a: p2, b: p3 });
  return segs;
}

/** Game platform: top plane only (cooked plat_y = y+sy). */
function pvPlatTopSegs(obj) {
  const y = (obj.y | 0) + (obj.sy | 0);
  const x0 = obj.x;
  const z0 = obj.z;
  const x1 = obj.x + obj.sx;
  const z1 = obj.z + obj.sz;
  const a = { x: x0, y, z: z0 };
  const b = { x: x1, y, z: z0 };
  const c = { x: x1, y, z: z1 };
  const d = { x: x0, y, z: z1 };
  return [
    { a, b },
    { a: b, b: c },
    { a: c, b: d },
    { a: d, b: a },
  ];
}

/** Game switch: up-pointing triangle on the face plane (fill_switch_verts). */
function pvSwitchSegs(obj) {
  const face = obj.face || "+z";
  const yMid = obj.y + ((obj.sy | 0) >> 1);
  const yTop = obj.y + obj.sy;
  let v0;
  let v1;
  let v2;
  if (face === "+x" || face === "-x") {
    const x = face === "+x" ? obj.x + obj.sx : obj.x;
    const zMid = obj.z + ((obj.sz | 0) >> 1);
    v0 = { x, y: yTop, z: zMid };
    v1 = { x, y: yMid, z: obj.z };
    v2 = { x, y: yMid, z: obj.z + obj.sz };
  } else {
    const z = face === "-z" ? obj.z : obj.z + obj.sz;
    const xMid = obj.x + ((obj.sx | 0) >> 1);
    v0 = { x: xMid, y: yTop, z };
    v1 = { x: obj.x, y: yMid, z };
    v2 = { x: obj.x + obj.sx, y: yMid, z };
  }
  return [
    { a: v0, b: v1 },
    { a: v1, b: v2 },
    { a: v2, b: v0 },
  ];
}

function pvDoorOrigin(obj, faceOverride) {
  const face = faceOverride || obj.face || "+z";
  const yaw = PV_DOOR_YAW[face] ?? 0;
  if (face === "+x") return { x: obj.x + obj.sx, y: obj.y, z: obj.z + obj.sz / 2, yaw };
  if (face === "-x") return { x: obj.x, y: obj.y, z: obj.z + obj.sz / 2, yaw };
  if (face === "-z") return { x: obj.x + obj.sx / 2, y: obj.y, z: obj.z, yaw };
  return { x: obj.x + obj.sx / 2, y: obj.y, z: obj.z + obj.sz, yaw };
}

/** Type mesh on the outward face (local X across, Y up, Z thickness). */
function pvDoorMeshSegs(obj, mesh, face) {
  const m = mesh?.verts?.length ? mesh : null;
  if (!m) return [];
  const o = pvDoorOrigin(obj, face);
  const s = clampDoorScale(obj.doorScale);
  const c = Math.cos(o.yaw);
  const sn = Math.sin(o.yaw);
  const verts = m.verts.map((v) => {
    const lx = Number(v.x) * s;
    const ly = Number(v.y) * s;
    const lz = Number(v.z);
    return {
      x: o.x + lx * c + lz * sn,
      y: o.y + ly,
      z: o.z - lx * sn + lz * c,
    };
  });
  const segs = [];
  for (const [ia, ib] of m.lines || []) {
    if (verts[ia] && verts[ib]) segs.push({ a: verts[ia], b: verts[ib] });
  }
  return segs;
}

function pvProjectCam(c) {
  return {
    sx: PREVIEW_W * 0.5 + (c.x / c.z) * PREVIEW_FX,
    sy: PREVIEW_H * 0.5 - (c.y / c.z) * PREVIEW_FY,
  };
}

function pvProjectLine(a, b, cam) {
  const ca = worldToCamera(a, cam);
  const cb = worldToCamera(b, cam);
  if (ca.z < NEAR && cb.z < NEAR) return null;
  let pa = ca;
  let pb = cb;
  if (ca.z < NEAR || cb.z < NEAR) {
    const t = (NEAR - ca.z) / (cb.z - ca.z);
    const clip = {
      x: ca.x + t * (cb.x - ca.x),
      y: ca.y + t * (cb.y - ca.y),
      z: NEAR,
    };
    if (ca.z < NEAR) pa = clip;
    else pb = clip;
  }
  const sa = pvProjectCam(pa);
  const sb = pvProjectCam(pb);
  return { ax: sa.sx, ay: sa.sy, bx: sb.sx, by: sb.sy };
}

function pvDisableSmoothing(ctx) {
  ctx.imageSmoothingEnabled = false;
  ctx.webkitImageSmoothingEnabled = false;
  ctx.mozImageSmoothingEnabled = false;
  ctx.msImageSmoothingEnabled = false;
}

function pvSpawnCam(spawn) {
  const rot = clampEnemyRot(spawn.rot);
  return {
    x: (spawn.x | 0) + 1,
    y: (spawn.y | 0) + PREVIEW_EYE,
    z: (spawn.z | 0) + 1,
    yaw: (rot * Math.PI) / 4,
    pitch: 0,
  };
}

function pvDefaultCam(room) {
  const g = roomGeometry(room);
  const cols = g.colliders?.length ? g.colliders : [g.outer];
  let x = 0;
  let z = 0;
  for (const c of cols) {
    x += c.x + c.sx / 2;
    z += c.z + c.sz / 2;
  }
  x /= cols.length;
  z /= cols.length;
  return {
    x,
    y: roomFloorY(room, x, z) + PREVIEW_EYE,
    z,
    yaw: 0,
    pitch: 0,
  };
}

function pvTryStep(room, x, y, z) {
  if (x < WORLD_MIN || x > WORLD_MAX || z < WORLD_MIN || z > WORLD_MAX) return false;
  return pointInRoom({ x, y, z }, room);
}

class PreviewView {
  /**
   * @param {HTMLCanvasElement} canvas
   * @param {{
   *   getDoc: () => any,
   *   getRoom: () => any,
   *   getSpawn: () => any,
   *   getEditSpawn?: () => any,
   *   onRotate?: (yaw: number) => void,
   *   onMove?: (x: number, z: number) => void,
   *   onEditStart?: () => void,
   *   onEditEnd?: () => void,
   *   onChange?: () => void,
   *   pistolImg?: HTMLImageElement | null,
   * }} opts
   */
  constructor(canvas, opts) {
    this.display = canvas;
    this.frame = canvas.parentElement;
    this.dctx = canvas.getContext("2d", { alpha: false });
    this.buffer = document.createElement("canvas");
    this.buffer.width = PREVIEW_W;
    this.buffer.height = PREVIEW_H;
    this.ctx = this.buffer.getContext("2d", { alpha: false });
    this.opts = opts;
    this.dragging = false;
    this.lastX = 0;
    this.lastY = 0;
    this.live = null;
    this.stickyCam = null;
    this.pistolBlack = null;
    pvDisableSmoothing(this.ctx);
    pvDisableSmoothing(this.dctx);

    canvas.addEventListener("pointerdown", (e) => this.#onPointer(e));
    canvas.addEventListener("pointermove", (e) => this.#onPointer(e));
    canvas.addEventListener("pointerup", (e) => this.#onPointer(e));
    canvas.addEventListener("lostpointercapture", (e) => this.#onPointer(e));

    this._ro = new ResizeObserver(() => this.draw());
    if (this.frame) this._ro.observe(this.frame);

    const pistol = opts.pistolImg;
    if (pistol && !pistol.complete) {
      pistol.addEventListener("load", () => {
        this.pistolBlack = null;
        this.draw();
      });
    }
  }

  #editSpawn() {
    if (this.opts.getEditSpawn) return this.opts.getEditSpawn() || null;
    return this.opts.getSpawn?.() || null;
  }

  #forgetSticky(room) {
    if (this.#editSpawn()) {
      this.stickyCam = null;
      return;
    }
    if (this.stickyCam && (!room || this.stickyCam.roomId !== room.id)) {
      this.stickyCam = null;
    }
  }

  #cam(room, spawn) {
    if (this.dragging && this.live) return this.live;
    this.#forgetSticky(room);
    if (this.#editSpawn() && spawn) return pvSpawnCam(spawn);
    if (this.stickyCam) {
      this.stickyCam.cam.pitch = 0;
      return this.stickyCam.cam;
    }
    if (spawn) return pvSpawnCam(spawn);
    if (!room) return null;
    const cam = pvDefaultCam(room);
    cam.pitch = 0;
    return cam;
  }

  #onPointer(e) {
    const room = this.opts.getRoom?.();
    const spawn = this.#editSpawn();
    const viewSpawn = this.opts.getSpawn?.() || null;
    if (!room) return;

    if (e.type === "pointerdown") {
      if (e.button != null && e.button !== 0) return;
      this.dragging = true;
      this.dragMoved = false;
      this.live = { ...this.#cam(room, viewSpawn) };
      this.lastX = e.clientX;
      this.lastY = e.clientY;
      if (spawn) this.opts.onEditStart?.();
      try {
        e.currentTarget.setPointerCapture(e.pointerId);
      } catch {
        /* ignore */
      }
      return;
    }

    if (e.type === "pointerup" || e.type === "lostpointercapture") {
      if (this.dragging) {
        if (spawn) this.opts.onEditEnd?.();
        else if (this.dragMoved && this.live && room) {
          this.stickyCam = { roomId: room.id, cam: { ...this.live } };
        }
      }
      this.dragging = false;
      this.live = null;
      this.draw();
      return;
    }

    if (e.type !== "pointermove" || !this.dragging || !this.live) return;

    const dx = e.clientX - this.lastX;
    const dy = e.clientY - this.lastY;
    if (dx || dy) this.dragMoved = true;
    this.lastX = e.clientX;
    this.lastY = e.clientY;
    const rect = this.display.getBoundingClientRect();
    const w = rect.width || PREVIEW_FRAME_W;
    const h = rect.height || PREVIEW_FRAME_H;
    const cam = this.live;

    if (dx) {
      cam.yaw += dx * (Math.PI / w);
      if (spawn) this.opts.onRotate?.(cam.yaw);
    }
    if (dy) {
      const walkSens = 8 / h;
      const forward = -dy * walkSens;
      const nx = cam.x + Math.sin(cam.yaw) * forward;
      const nz = cam.z + Math.cos(cam.yaw) * forward;
      const y = spawn ? cam.y : roomFloorY(room, nx, nz) + PREVIEW_EYE;
      const yx = spawn ? cam.y : roomFloorY(room, nx, cam.z) + PREVIEW_EYE;
      const yz = spawn ? cam.y : roomFloorY(room, cam.x, nz) + PREVIEW_EYE;
      if (pvTryStep(room, nx, y, nz)) {
        cam.x = nx;
        cam.z = nz;
        cam.y = y;
        if (spawn) this.opts.onMove?.(cam.x, cam.z);
      } else if (pvTryStep(room, nx, yx, cam.z)) {
        cam.x = nx;
        cam.y = yx;
        if (spawn) this.opts.onMove?.(cam.x, cam.z);
      } else if (pvTryStep(room, cam.x, yz, nz)) {
        cam.z = nz;
        cam.y = yz;
        if (spawn) this.opts.onMove?.(cam.x, cam.z);
      }
    }
    if (spawn && (dx || dy)) this.opts.onChange?.();
    this.draw();
  }

  #stroke(ctx, cam, a, b, color) {
    const seg = pvProjectLine(a, b, cam);
    if (!seg) return;
    ctx.beginPath();
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.5;
    ctx.moveTo(seg.ax + 0.5, seg.ay + 0.5);
    ctx.lineTo(seg.bx + 0.5, seg.by + 0.5);
    ctx.stroke();
  }

  #drawObject(ctx, doc, obj, cam, color, room) {
    if (obj.kind === "doorway") {
      const mesh = itemMeshFor(doc, obj.doorType);
      // Game bakes door_face per room: the slab plane nearest this room's colliders.
      const face = doorNearFaceId(obj, room);
      for (const seg of pvDoorMeshSegs(obj, mesh, face)) {
        this.#stroke(ctx, cam, seg.a, seg.b, color);
      }
      return;
    }
    if (obj.kind === "switch") {
      for (const seg of pvSwitchSegs(obj)) {
        this.#stroke(ctx, cam, seg.a, seg.b, color);
      }
      return;
    }
    if (obj.kind === "platform") {
      for (const seg of pvPlatTopSegs(obj)) {
        this.#stroke(ctx, cam, seg.a, seg.b, color);
      }
      return;
    }
    if (obj.kind === "pickup") {
      const mesh = itemMeshFor(doc, obj.pickup);
      for (const seg of itemMeshWorldSegs(obj, mesh, itemYawFor(doc, obj.pickup, obj.rot))) {
        this.#stroke(ctx, cam, seg.a, seg.b, color);
      }
      return;
    }
    if (obj.kind === "slope") {
      for (const seg of pvSlopeSegs(obj)) {
        this.#stroke(ctx, cam, seg.a, seg.b, color);
      }
      return;
    }
    if (isFigureObject(obj)) {
      const tmpl = findEnemyTemplate(doc, figureTemplateName(obj));
      const verts = enemyPlacementWorldVerts(obj, tmpl);
      if (tmpl && verts.length) {
        for (const [i, j] of tmpl.lines) {
          if (verts[i] && verts[j]) this.#stroke(ctx, cam, verts[i], verts[j], color);
        }
      }
      return;
    }
    for (const [i, j] of BOX_EDGES) {
      this.#stroke(ctx, cam, cornerWorld(obj, i), cornerWorld(obj, j), color);
    }
  }

  #pistolBlack() {
    if (this.pistolBlack) return this.pistolBlack;
    const img = this.opts.pistolImg;
    if (!img?.complete || !img.naturalWidth) return null;
    const c = document.createElement("canvas");
    c.width = PISTOL_W;
    c.height = PISTOL_H;
    const ctx = c.getContext("2d");
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(img, 0, 0, PISTOL_W, PISTOL_H);
    const data = ctx.getImageData(0, 0, PISTOL_W, PISTOL_H);
    const px = data.data;
    for (let i = 0; i < px.length; i += 4) {
      if (px[i] > 16 || px[i + 1] > 16 || px[i + 2] > 16) {
        px[i] = 0;
        px[i + 1] = 0;
        px[i + 2] = 0;
        px[i + 3] = 255;
      } else {
        px[i + 3] = 0;
      }
    }
    ctx.putImageData(data, 0, 0);
    this.pistolBlack = c;
    return c;
  }

  #drawPistol(ctx) {
    const img = this.#pistolBlack();
    if (!img) return;
    const dx = PISTOL_VX * PREVIEW_SX;
    const dy = PISTOL_VY * PREVIEW_SY;
    const dw = PISTOL_W * PREVIEW_SX;
    const dh = PISTOL_H * PREVIEW_SY;
    const clipH = Math.min(dh, PREVIEW_H - dy);
    if (clipH <= 0) return;
    const srcH = PISTOL_H * (clipH / dh);
    pvDisableSmoothing(ctx);
    ctx.drawImage(img, 0, 0, PISTOL_W, srcH, dx, dy, dw, clipH);
  }

  #present() {
    const frame = this.frame || this.display;
    const rect = frame.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    const outW = Math.max(1, Math.round(rect.width * dpr));
    const outH = Math.max(1, Math.round(rect.height * dpr));
    if (this.display.width !== outW || this.display.height !== outH) {
      this.display.width = outW;
      this.display.height = outH;
    }
    const dctx = this.dctx;
    pvDisableSmoothing(dctx);
    dctx.fillStyle = "#000";
    dctx.fillRect(0, 0, outW, outH);
    dctx.drawImage(this.buffer, 0, 0, PREVIEW_W, PREVIEW_H, 0, 0, outW, outH);
  }

  hint() {
    const room = this.opts.getRoom?.();
    if (this.#editSpawn()) return "Spawn view â€” drag L/R to set angle Â· U/D to move";
    if (this.stickyCam) return "Drag L/R to rotate Â· U/D to walk";
    if (this.opts.getSpawn?.()) return "Spawn view";
    if (room) return "Drag L/R to rotate Â· U/D to walk";
    return "Select a room";
  }

  draw() {
    const ctx = this.ctx;
    const doc = this.opts.getDoc?.();
    const room = this.opts.getRoom?.();
    const spawn = this.opts.getSpawn?.() || null;
    this.#forgetSticky(room);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    pvDisableSmoothing(ctx);
    ctx.fillStyle = room ? a8Hex(room.a8Bg ?? ROOM_BG_DEFAULT) : "#000000";
    ctx.fillRect(0, 0, PREVIEW_W, PREVIEW_H);

    if (doc && room) {
      const cam = this.#cam(room, spawn);
      const line = a8InkHex(room.a8Bg ?? ROOM_BG_DEFAULT);
      const g = roomGeometry(room);
      for (const e of g.edges) {
        this.#stroke(ctx, cam, g.verts[e.a], g.verts[e.b], line);
      }
      const ids = localVisibleIds(doc, room, false);
      const roomsOnly = !!this.opts.getRoomsOnlyMode?.();
      for (const obj of activeMap(doc).objects) {
        if (!ids.has(obj.id)) continue;
        if (roomsOnly) {
          if (obj.kind !== "doorway") continue;
        } else if (obj.kind === "room" || obj.kind === "spawn" || isGhostKind(obj.kind)) {
          continue;
        }
        this.#drawObject(ctx, doc, obj, cam, line, room);
      }
      this.#drawPistol(ctx);
    }

    this.#present();
    const hint = document.getElementById("preview-hint");
    if (hint) hint.textContent = this.hint();
  }
}


// ---- js/animView.js ----
const ANIM_BOX_CLICK = 4;
const ANIM_ZOOM_K = 0.008;
function clampAnimDist(d) {
  return Math.max(ANIM_ORBIT_DIST_MIN, Math.min(ANIM_ORBIT_DIST_MAX, d));
}

class AnimView {
  constructor(canvas, opts) {
    this.canvas = canvas;
    this.ctx = canvas.getContext("2d");
    this.opts = opts;
    this.orbit = { yaw: 0.5, pitch: 0.15, dist: 48, target: { x: 0, y: 10, z: 0 } };
    this.groundPanY = 0;
    this.drag = null;
    this.hover = -1;
    this.hoverLine = -1;
    this.hoverGizmo = null;
    this.enabled = false;
    this._ro = new ResizeObserver(() => this.resize());
    this._ro.observe(opts.stage || canvas.parentElement);
    this.resize();

    canvas.addEventListener("pointerdown", (e) => this.#onDown(e));
    canvas.addEventListener("pointermove", (e) => this.#onMove(e));
    canvas.addEventListener("pointerup", (e) => this.#onUp(e));
    canvas.addEventListener("pointerleave", (e) => this.#onUp(e));
    canvas.addEventListener("wheel", (e) => this.#onWheel(e), { passive: false });
    canvas.addEventListener("contextmenu", (e) => e.preventDefault());
    canvas.addEventListener("mousedown", (e) => {
      if (e.button === 1) e.preventDefault();
    });
    canvas.addEventListener("auxclick", (e) => {
      if (e.button === 1) e.preventDefault();
    });
  }

  resize() {
    if (!this.enabled) return;
    const stage = this.opts.stage || this.canvas.parentElement;
    const stick = stage?.classList.contains("stick-stage");
    if (stick) {
      this.canvas.style.width = "";
      this.canvas.style.height = "";
    }
    const rect = (stick ? this.canvas : stage).getBoundingClientRect();
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const w = Math.max(64, Math.floor(rect.width));
    const h = Math.max(64, Math.floor(rect.height));
    this.canvas.width = Math.floor(w * dpr);
    this.canvas.height = Math.floor(h * dpr);
    if (!stick) {
      this.canvas.style.width = `${w}px`;
      this.canvas.style.height = `${h}px`;
    }
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    this.cssW = w;
    this.cssH = h;
    this.draw();
    this.opts.onStageResize?.();
  }

  #overlay() {
    return this.opts.getMeshOverlay?.() || null;
  }

  #hasStick() {
    return this.opts.hasStickFrame?.() !== false;
  }

  #binding() {
    const overlay = this.#overlay();
    return !!(overlay && (overlay.binding || overlay.bindJoint >= 0));
  }

  #cam() {
    const { yaw, pitch, dist, target } = this.orbit;
    const { forward } = lookVectors(yaw, pitch);
    const cam = {
      x: target.x - forward.x * dist,
      y: target.y - forward.y * dist,
      z: target.z - forward.z * dist,
      yaw,
      pitch,
    };
    const w = this.cssW;
    const h = this.cssH;
    if (w && h) {
      const raw = projectPoint({ x: 0, y: 0, z: 0 }, cam, w, h);
      if (raw.ok) cam.sy0 = h * 0.5 + (h * STICK_GROUND_Y + this.groundPanY - raw.sy);
    }
    return cam;
  }

  /** Pixels per world unit on the view plane through the XZ origin. */
  pixelsAtOrigin() {
    const w = this.cssW;
    const h = this.cssH;
    if (!w || !h) return 0;
    const cam = this.#cam();
    const { forward } = lookVectors(cam.yaw, cam.pitch);
    const cz = -cam.x * forward.x - cam.y * forward.y - cam.z * forward.z;
    if (!(cz > 0.5)) return 0;
    return (Math.min(w, h) * 0.9) / cz;
  }

  /** Frame stick/MDL verts; if none, center on origin without changing dist. */
  focusObject() {
    let points = null;
    if (this.#hasStick()) {
      const enemy = this.opts.getEnemy();
      const frame = this.opts.getFrame();
      points = enemy?.frames?.[frame] || enemy?.frames?.[0] || null;
    }
    if (!points?.length) {
      const overlay = this.#overlay();
      points = overlay?.verts || null;
    }
    if (!points?.length) {
      this.orbit.target = { x: 0, y: 0, z: 0 };
      this.opts.onViewChanged?.();
      this.draw();
      return true;
    }

    let minx = Infinity;
    let miny = Infinity;
    let minz = Infinity;
    let maxx = -Infinity;
    let maxy = -Infinity;
    let maxz = -Infinity;
    for (const v of points) {
      minx = Math.min(minx, v.x);
      miny = Math.min(miny, v.y);
      minz = Math.min(minz, v.z);
      maxx = Math.max(maxx, v.x);
      maxy = Math.max(maxy, v.y);
      maxz = Math.max(maxz, v.z);
    }
    const box = {
      x: minx,
      y: miny,
      z: minz,
      sx: Math.max(1e-3, maxx - minx),
      sy: Math.max(1e-3, maxy - miny),
      sz: Math.max(1e-3, maxz - minz),
    };
    const center = aabbCenter(box);
    const { yaw, pitch } = this.orbit;
    const { forward, right, up } = lookVectors(yaw, pitch);
    const w = this.cssW;
    const h = this.cssH;
    const focal = Math.min(w, h) * 0.9;
    const pad = 0.82;
    const halfW = Math.max(1, w * 0.5 * pad);
    const halfH = Math.max(1, h * 0.5 * pad);

    let frameDist = 4;
    for (let i = 0; i < 8; i++) {
      const c = cornerWorld(box, i);
      const rx = c.x - center.x;
      const ry = c.y - center.y;
      const rz = c.z - center.z;
      const cx = rx * right.x + ry * right.y + rz * right.z;
      const cy = rx * up.x + ry * up.y + rz * up.z;
      const cz = rx * forward.x + ry * forward.y + rz * forward.z;
      frameDist = Math.max(frameDist, (Math.abs(cx) * focal) / halfW - cz);
      frameDist = Math.max(frameDist, (Math.abs(cy) * focal) / halfH - cz);
      frameDist = Math.max(frameDist, 1 - cz);
    }

    this.orbit.target = { x: center.x, y: center.y, z: center.z };
    this.orbit.dist = clampAnimDist(frameDist);
    this.opts.onZoomSync?.();
    this.opts.onViewChanged?.();
    this.draw();
    return true;
  }

  #eventPos(e) {
    const rect = this.canvas.getBoundingClientRect();
    return {
      x: ((e.clientX - rect.left) / rect.width) * this.cssW,
      y: ((e.clientY - rect.top) / rect.height) * this.cssH,
    };
  }

  #selectedIndices() {
    return this.opts.getSelectedVerts?.() || [];
  }

  #selectionAnchor() {
    if (!this.#hasStick()) return null;
    const selected = this.#selectedIndices();
    if (!selected.length) return null;
    const enemy = this.opts.getEnemy();
    const frame = this.opts.getFrame();
    const verts = enemy.frames[frame];
    if (selected.length === 1) {
      const i = selected[0];
      return { index: i, v: verts[i], indices: selected };
    }
    let x = 0;
    let y = 0;
    let z = 0;
    for (const i of selected) {
      x += verts[i].x;
      y += verts[i].y;
      z += verts[i].z;
    }
    const n = selected.length;
    return { index: selected[selected.length - 1], v: { x: x / n, y: y / n, z: z / n }, indices: selected };
  }

  #gizmoDragOrigs(prim) {
    const enemy = this.opts.getEnemy();
    const frame = this.opts.getFrame();
    const verts = enemy.frames[frame];
    return prim.indices.map((i) => ({
      i,
      x: verts[i].x,
      y: verts[i].y,
      z: verts[i].z,
    }));
  }

  #startGizmoDrag(gizmoHit, prim, p) {
    this.opts.beginUndo?.();
    this.drag = {
      kind: gizmoHit.kind,
      axis: gizmoHit.axis,
      plane: gizmoHit.plane,
      planeN: gizmoHit.planeN,
      grab: gizmoHit.world,
      gizmoAxisLen: gizmoHit.gizmoAxisLen ?? GIZMO_FALLBACK_LEN,
      origs: this.#gizmoDragOrigs(prim),
      orig: { x: prim.v.x, y: prim.v.y, z: prim.v.z },
      start: p,
    };
  }

  #hitAmong(verts, mx, my, radius = 10) {
    const cam = this.#cam();
    let best = -1;
    let bestD = radius;
    verts.forEach((v, i) => {
      const p = projectPoint(v, cam, this.cssW, this.cssH);
      if (!p.ok) return;
      const d = Math.hypot(mx - p.sx, my - p.sy);
      if (d < bestD) {
        bestD = d;
        best = i;
      }
    });
    return best;
  }

  #hitVert(mx, my) {
    const overlay = this.#overlay();
    if (this.#binding()) return this.#hitAmong(overlay.verts, mx, my, 8);
    if (!this.#hasStick()) return -1;
    const enemy = this.opts.getEnemy();
    const frame = this.opts.getFrame();
    return this.#hitAmong(enemy.frames[frame], mx, my, 10);
  }

  #hitLine(mx, my) {
    if (this.#binding() || !this.#hasStick()) return -1;
    const enemy = this.opts.getEnemy();
    const frame = this.opts.getFrame();
    const verts = enemy.frames[frame];
    if (!verts) return -1;
    const cam = this.#cam();
    let best = -1;
    let bestD = 6;
    enemy.lines.forEach(([ia, ib], i) => {
      const a = verts[ia];
      const b = verts[ib];
      if (!a || !b) return;
      const pl = projectLine(a, b, cam, this.cssW, this.cssH);
      if (!pl) return;
      const d = distPointToSegment2d(mx, my, pl.ax, pl.ay, pl.bx, pl.by);
      if (d < bestD) {
        bestD = d;
        best = i;
      }
    });
    return best;
  }

  zoomBy(factor) {
    this.orbit.dist = clampAnimDist(this.orbit.dist * factor);
    this.opts.onZoomSync?.();
    this.opts.onViewChanged?.();
    this.draw();
  }

  #onWheel(e) {
    if (!this.enabled) return;
    e.preventDefault();
    this.zoomBy(e.deltaY > 0 ? 1.1 : 1 / 1.1);
  }

  #onDown(e) {
    if (!this.enabled) return;
    this.canvas.focus();
    const p = this.#eventPos(e);
    if (e.button === 2 && e.altKey) {
      this.drag = { kind: "zoom", last: p };
      this.canvas.setPointerCapture(e.pointerId);
      return;
    }
    if (e.button === 1) {
      this.drag = { kind: "pan", last: p };
      this.canvas.setPointerCapture(e.pointerId);
      return;
    }
    if (e.button === 2) {
      this.drag = { kind: "orbit", last: p };
      this.canvas.setPointerCapture(e.pointerId);
      return;
    }
    if (e.button !== 0) return;
    if (e.altKey) {
      e.preventDefault();
      this.drag = { kind: "orbit", last: p };
      this.canvas.setPointerCapture(e.pointerId);
      return;
    }

    const binding = this.#binding();
    if (!binding) {
      const prim = this.#selectionAnchor();
      if (prim) {
        const gizmoHit = hitTranslateGizmo(prim.v, this.#cam(), this.cssW, this.cssH, p.x, p.y);
        if (gizmoHit) {
          this.#startGizmoDrag(gizmoHit, prim, p);
          this.canvas.setPointerCapture(e.pointerId);
          return;
        }
      }
    }

    const vi = this.#hitVert(p.x, p.y);
    if (vi >= 0) {
      if (binding) {
        this.opts.onSelectMeshVert?.(vi, e.shiftKey);
        this.drag = { kind: "select" };
        this.canvas.setPointerCapture(e.pointerId);
        this.draw();
        return;
      }
      const selected = this.opts.getSelectedVerts?.() || [];
      const wasSelected = selected.includes(vi);
      this.opts.onSelectVert?.(vi, e.shiftKey);
      if (!wasSelected && !e.shiftKey) {
        const enemy = this.opts.getEnemy();
        const frame = this.opts.getFrame();
        const v = enemy.frames[frame][vi];
        this.drag = {
          kind: "slide",
          index: vi,
          lock: this.#lockAxis(),
          orig: { x: v.x, y: v.y, z: v.z },
          undoStarted: false,
        };
      } else {
        this.drag = { kind: "select" };
      }
      this.canvas.setPointerCapture(e.pointerId);
      this.draw();
      return;
    }
    if (!binding) {
      const li = this.#hitLine(p.x, p.y);
      if (li >= 0) {
        this.opts.onSelectLine?.(li, e.shiftKey);
        this.drag = { kind: "select" };
        this.canvas.setPointerCapture(e.pointerId);
        this.draw();
        return;
      }
    }
    this.drag = { kind: "box", start: p, end: p, additive: e.shiftKey };
    this.canvas.setPointerCapture(e.pointerId);
  }

  #onMove(e) {
    if (!this.enabled) return;
    const p = this.#eventPos(e);
    if (!this.drag) {
      const binding = this.#binding();
      const prim = binding ? null : this.#selectionAnchor();
      this.hover = this.#hitVert(p.x, p.y);
      this.hoverGizmo =
        prim && this.hover < 0
          ? hitTranslateGizmo(prim.v, this.#cam(), this.cssW, this.cssH, p.x, p.y)
          : null;
      this.hoverLine = binding || this.hover >= 0 || this.hoverGizmo ? -1 : this.#hitLine(p.x, p.y);
      this.draw();
      return;
    }
    if (this.drag.kind === "orbit") {
      const dx = p.x - this.drag.last.x;
      const dy = p.y - this.drag.last.y;
      this.drag.last = p;
      this.orbit.yaw += dx * 0.01;
      this.orbit.pitch = Math.max(-1.2, Math.min(1.2, this.orbit.pitch - dy * 0.01));
      this.draw();
      return;
    }
    if (this.drag.kind === "pan") {
      const dx = p.x - this.drag.last.x;
      const dy = p.y - this.drag.last.y;
      this.drag.last = p;
      if (dx) {
        const focal = Math.min(this.cssW, this.cssH) * 0.9;
        const scale = this.orbit.dist / focal;
        const { right } = lookVectors(this.orbit.yaw, this.orbit.pitch);
        const t = this.orbit.target;
        t.x += -right.x * dx * scale;
        t.z += -right.z * dx * scale;
      }
      if (dy) this.groundPanY += dy;
      this.draw();
      return;
    }
    if (this.drag.kind === "zoom") {
      const dx = p.x - this.drag.last.x;
      const dy = p.y - this.drag.last.y;
      this.drag.last = p;
      const delta = dx + dy;
      if (delta) this.zoomBy(Math.exp(-delta * ANIM_ZOOM_K));
      return;
    }
    if (this.drag.kind === "box") {
      this.drag.end = p;
      this.draw();
      return;
    }
    if (this.drag.kind === "axis") {
      const enemy = this.opts.getEnemy();
      const frame = this.opts.getFrame();
      const verts = enemy.frames[frame];
      const delta = gizmoAxisDragDelta(
        p,
        this.drag.grab,
        this.drag.axis,
        this.drag.start,
        this.drag.gizmoAxisLen ?? GIZMO_FALLBACK_LEN,
        this.#cam(),
        this.cssW,
        this.cssH,
        !enemyHasSprites(enemy)
      );
      if (delta == null) return;
      const clamp = clampVertFor(enemy);
      for (const o of this.drag.origs) {
        const v = verts[o.i];
        v.x = o.x;
        v.y = o.y;
        v.z = o.z;
        v[this.drag.axis] = clamp(o[this.drag.axis] + delta);
      }
      this.opts.onChange?.();
      this.draw();
      return;
    }
    if (this.drag.kind === "plane") {
      const enemy = this.opts.getEnemy();
      const frame = this.opts.getFrame();
      const verts = enemy.frames[frame];
      const ray = screenRay(p.x, p.y, this.#cam(), this.cssW, this.cssH);
      const hit = intersectPlane(ray.origin, ray.dir, this.drag.grab, this.drag.planeN);
      if (!hit) return;
      const fine = enemyHasSprites(enemy);
      const raw = (n) => (fine ? n : Math.round(n));
      let dx = raw(hit.point.x - this.drag.grab.x);
      let dy = raw(hit.point.y - this.drag.grab.y);
      let dz = raw(hit.point.z - this.drag.grab.z);
      if (this.drag.plane === "xy") dz = 0;
      else if (this.drag.plane === "xz") dy = 0;
      else if (this.drag.plane === "yz") dx = 0;
      const clamp = clampVertFor(enemy);
      for (const o of this.drag.origs) {
        const v = verts[o.i];
        v.x = clamp(o.x + dx);
        v.y = clamp(o.y + dy);
        v.z = clamp(o.z + dz);
      }
      this.opts.onChange?.();
      this.draw();
      return;
    }
    if (this.drag.kind === "slide") {
      const enemy = this.opts.getEnemy();
      const frame = this.opts.getFrame();
      const v = enemy.frames[frame][this.drag.index];
      const orig = this.drag.orig;
      const cam = this.#cam();
      const ray = screenRay(p.x, p.y, cam, this.cssW, this.cssH);
      const n = { x: 0, y: 0, z: 0 };
      n[this.drag.lock] = 1;
      const hit = intersectPlane(ray.origin, ray.dir, orig, n);
      if (!hit) return;
      const clamp = clampVertFor(enemy);
      const next = {
        x: this.drag.lock === "x" ? orig.x : clamp(hit.point.x),
        y: this.drag.lock === "y" ? orig.y : clamp(hit.point.y),
        z: this.drag.lock === "z" ? orig.z : clamp(hit.point.z),
      };
      if (next.x === v.x && next.y === v.y && next.z === v.z) return;
      if (!this.drag.undoStarted) {
        this.opts.beginUndo?.();
        this.drag.undoStarted = true;
      }
      v.x = next.x;
      v.y = next.y;
      v.z = next.z;
      this.opts.onChange?.();
      this.draw();
    }
  }

  #lockAxis() {
    const { forward } = lookVectors(this.orbit.yaw, this.orbit.pitch);
    const ax = Math.abs(forward.x);
    const ay = Math.abs(forward.y);
    const az = Math.abs(forward.z);
    if (ax >= ay && ax >= az) return "x";
    if (ay >= az) return "y";
    return "z";
  }

  #boxRect() {
    const a = this.drag.start;
    const b = this.drag.end;
    const x0 = Math.min(a.x, b.x);
    const y0 = Math.min(a.y, b.y);
    const x1 = Math.max(a.x, b.x);
    const y1 = Math.max(a.y, b.y);
    return { x0, y0, x1, y1, w: x1 - x0, h: y1 - y0 };
  }

  #vertsInBox(rect) {
    const overlay = this.#overlay();
    const verts =
      overlay && (overlay.binding || overlay.bindJoint >= 0)
        ? overlay.verts
        : this.#hasStick()
          ? this.opts.getEnemy().frames[this.opts.getFrame()]
          : [];
    const cam = this.#cam();
    const hits = [];
    verts.forEach((v, i) => {
      const p = projectPoint(v, cam, this.cssW, this.cssH);
      if (!p.ok) return;
      if (p.sx >= rect.x0 && p.sx <= rect.x1 && p.sy >= rect.y0 && p.sy <= rect.y1) hits.push(i);
    });
    return hits;
  }

  #finishBox() {
    const rect = this.#boxRect();
    const additive = this.drag.additive;
    const binding = this.#binding();
    if (rect.w < ANIM_BOX_CLICK && rect.h < ANIM_BOX_CLICK) {
      if (binding) {
        if (!additive) this.opts.onSelectMeshVerts?.([], false);
      } else if (!additive) this.opts.onSelectVerts?.([]);
      return;
    }
    const hits = this.#vertsInBox(rect);
    if (binding) this.opts.onSelectMeshVerts?.(hits, additive);
    else this.opts.onSelectVerts?.(hits, additive);
  }

  #onUp(e) {
    if (!this.enabled) return;
    const orbitEnded =
      this.drag?.kind === "orbit" || this.drag?.kind === "zoom" || this.drag?.kind === "pan";
    if (this.drag?.kind === "box") this.#finishBox();
    if (this.drag?.kind === "axis" || this.drag?.kind === "plane" || this.drag?.undoStarted) {
      this.opts.endUndo?.();
    }
    this.drag = null;
    if (orbitEnded) this.opts.onViewChanged?.();
    try {
      this.canvas.releasePointerCapture(e.pointerId);
    } catch {
      /* ignore */
    }
    this.draw();
  }

  #strokeSeg(ctx, cam, w, h, p0, p1, col, width = 1) {
    const seg = projectLine(p0, p1, cam, w, h);
    if (!seg) return;
    ctx.strokeStyle = col;
    ctx.lineWidth = width;
    ctx.beginPath();
    ctx.moveTo(seg.ax, seg.ay);
    ctx.lineTo(seg.bx, seg.by);
    ctx.stroke();
  }

  #drawForwardArrow(ctx, cam, w, h) {
    const y = 0.2;
    const tip = { x: 0, y, z: 14 };
    const col = "#d4a017";
    this.#strokeSeg(ctx, cam, w, h, { x: 0, y, z: 0 }, tip, col, 2.5);
    this.#strokeSeg(ctx, cam, w, h, tip, { x: 2.5, y, z: 10 }, col, 2);
    this.#strokeSeg(ctx, cam, w, h, tip, { x: -2.5, y, z: 10 }, col, 2);
    this.#strokeSeg(ctx, cam, w, h, tip, { x: 0, y: 2.5, z: 10 }, col, 2);
    const label = projectPoint({ x: 0, y: 1.5, z: 16 }, cam, w, h);
    if (label.ok) {
      ctx.fillStyle = col;
      ctx.font = "11px Segoe UI, sans-serif";
      ctx.fillText("fwd", label.sx - 10, label.sy);
    }
  }

  /** Player-blocking volume (world.asm body_vs_en + player_overlaps_y), in anim units. */
  #drawCollision(ctx, cam, w, h) {
    const s = LAYOUT_ENEMY_SCALE;
    const cell = 1 / s;
    const R = clampEnemyBlockR(this.opts.getEnemy()?.blockR);
    const half = (R + 0.5) * cell;
    const top = GAME_ENEMY_CULL_H * cell;
    const col = "#c8603c";
    // Floor cell divisions inside the footprint (player position is cell-quantised).
    for (let k = -R; k < R; k++) {
      const c = (k + 0.5) * cell;
      this.#strokeSeg(ctx, cam, w, h, { x: c, y: 0, z: -half }, { x: c, y: 0, z: half }, "rgba(200, 96, 60, 0.35)");
      this.#strokeSeg(ctx, cam, w, h, { x: -half, y: 0, z: c }, { x: half, y: 0, z: c }, "rgba(200, 96, 60, 0.35)");
    }
    ctx.setLineDash([4, 3]);
    const xs = [-half, half];
    for (const y of [0, top]) {
      for (const x of xs) this.#strokeSeg(ctx, cam, w, h, { x, y, z: -half }, { x, y, z: half }, col, 1.25);
      for (const z of xs) this.#strokeSeg(ctx, cam, w, h, { x: -half, y, z }, { x: half, y, z }, col, 1.25);
    }
    for (const x of xs) {
      for (const z of xs) this.#strokeSeg(ctx, cam, w, h, { x, y: 0, z }, { x, y: top, z }, col, 1.25);
    }
    ctx.setLineDash([]);
    const label = projectPoint({ x: half, y: top, z: half }, cam, w, h);
    if (label.ok) {
      ctx.fillStyle = col;
      ctx.font = "11px Segoe UI, sans-serif";
      ctx.fillText(`player block R${R}`, label.sx + 4, label.sy - 4);
    }
  }

  #drawGizmo(ctx, cam, w, h, v) {
    drawTranslateGizmo(ctx, v, cam, w, h, { hoverGizmo: this.hoverGizmo, drag: this.drag });
  }

  draw() {
    if (!this.enabled) return;
    const ctx = this.ctx;
    const w = this.cssW;
    const h = this.cssH;
    if (!w || !h) return;
    ctx.fillStyle = "#0a0a0c";
    ctx.fillRect(0, 0, w, h);

    const cam = this.#cam();
    const enemy = this.opts.getEnemy();
    const frame = this.opts.getFrame();
    const selected = this.opts.getSelectedVerts?.() || [];
    const selectedLines = this.opts.getSelectedLines?.() || [];
    const overlay = this.#overlay();
    const binding = overlay && (overlay.binding || overlay.bindJoint >= 0);
    const stickOn = this.#hasStick();
    const verts = stickOn ? enemy.frames[frame] || enemy.frames[0] : null;
    let shown = selected;
    let meshShown = overlay ? [...(overlay.meshSel || [])] : [];
    if (this.drag?.kind === "box") {
      const r = this.#boxRect();
      if (r.w >= ANIM_BOX_CLICK || r.h >= ANIM_BOX_CLICK) {
        const hits = this.#vertsInBox(r);
        if (binding) {
          meshShown = this.drag.additive ? [...new Set([...meshShown, ...hits])] : hits;
        } else {
          shown = this.drag.additive ? [...new Set([...selected, ...hits])] : hits;
        }
      }
    }

    ctx.lineWidth = 1;
    for (let i = -24; i <= 24; i += 8) {
      this.#strokeSeg(ctx, cam, w, h, { x: i, y: 0, z: -24 }, { x: i, y: 0, z: 24 }, "#3d4658");
      this.#strokeSeg(ctx, cam, w, h, { x: -24, y: 0, z: i }, { x: 24, y: 0, z: i }, "#3d4658");
    }
    this.#strokeSeg(ctx, cam, w, h, { x: -20, y: 0, z: 0 }, { x: 20, y: 0, z: 0 }, "#a66");
    this.#strokeSeg(ctx, cam, w, h, { x: 0, y: 0, z: 0 }, { x: 0, y: 24, z: 0 }, "#6a6");
    this.#strokeSeg(ctx, cam, w, h, { x: 0, y: 0, z: -20 }, { x: 0, y: 0, z: 20 }, "#66a");
    this.#drawForwardArrow(ctx, cam, w, h);
    if (this.opts.showCollision?.() !== false) this.#drawCollision(ctx, cam, w, h);

    if (overlay) {
      ctx.lineWidth = 1;
      for (const [i, j] of overlay.edges) {
        const a = overlay.verts[i];
        const b = overlay.verts[j];
        if (a && b) this.#strokeSeg(ctx, cam, w, h, a, b, "#3a4458", 1);
      }
      if (overlay.ghost) {
        for (const [i, j] of overlay.lines || enemy.lines) {
          const a = overlay.ghost[i];
          const b = overlay.ghost[j];
          if (a && b) this.#strokeSeg(ctx, cam, w, h, a, b, "#5ec8c8", 1.5);
        }
        overlay.ghost.forEach((v) => {
          if (!v) return;
          const p = projectPoint(v, cam, w, h);
          if (!p.ok) return;
          ctx.fillStyle = "#5ec8c8";
          ctx.beginPath();
          ctx.arc(p.sx, p.sy, 4, 0, Math.PI * 2);
          ctx.fill();
        });
      }
    }

    if (stickOn && verts) {
      ctx.lineWidth = 1.5;
      enemy.lines.forEach(([i, j], li) => {
        const sel = !binding && selectedLines.includes(li);
        const ho = !binding && li === this.hoverLine;
        this.#strokeSeg(ctx, cam, w, h, verts[i], verts[j], sel ? "#f2d36b" : ho ? "#fff" : "#c8ccd4", sel || ho ? 2.5 : 1.5);
      });

      verts.forEach((v, i) => {
        const p = projectPoint(v, cam, w, h);
        if (!p.ok) return;
        const sel = !binding && shown.includes(i);
        const hover = !binding && i === this.hover;
        ctx.fillStyle = sel ? "#d4a017" : hover ? "#fff" : "#8b91a0";
        const r = sel ? 5 : 4;
        ctx.beginPath();
        ctx.arc(p.sx, p.sy, r, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    if (binding) {
      const assignedOther = new Set();
      overlay.jointVerts.forEach((list, ji) => {
        if (overlay.bindJoint >= 0 && ji === overlay.bindJoint) return;
        for (const i of list) assignedOther.add(i);
      });
      overlay.verts.forEach((v, i) => {
        const p = projectPoint(v, cam, w, h);
        if (!p.ok) return;
        const sel = meshShown.includes(i);
        const hover = i === this.hover;
        const other = assignedOther.has(i);
        ctx.fillStyle = sel ? "#d4a017" : hover ? "#fff" : other ? "#5ec8c8" : "#5a6270";
        const r = sel || hover ? 3.5 : 2.5;
        ctx.beginPath();
        ctx.arc(p.sx, p.sy, r, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    const prim = this.#selectionAnchor();
    if (prim && !binding && stickOn) this.#drawGizmo(ctx, cam, w, h, prim.v);

    if (this.drag?.kind === "box") {
      const r = this.#boxRect();
      ctx.fillStyle = "rgba(212, 160, 23, 0.12)";
      ctx.fillRect(r.x0, r.y0, r.w, r.h);
      ctx.strokeStyle = "#d4a017";
      ctx.lineWidth = 1;
      ctx.setLineDash([4, 3]);
      ctx.strokeRect(r.x0 + 0.5, r.y0 + 0.5, r.w, r.h);
      ctx.setLineDash([]);
    }

    ctx.fillStyle = "#8b91a0";
    ctx.font = "11px Segoe UI, sans-serif";
    const clip = clipForFrame(enemy.clips, frame);
    const previewLocal = this.opts.getLocalFrame?.();
    const previewClip = this.opts.getClipName?.();
    let label = "rest";
    if (previewClip && previewLocal != null) {
      label = `${previewClip} ${previewLocal}`;
    } else if (stickOn && enemy.clips?.length && clip) {
      label = `${clip.name} ${frame - clip.start}`;
    }
    const frameTotal = stickOn && enemy.clips?.length ? enemy.frames.length : overlay ? "MDL" : enemy.frames.length;
    const nv = (stickOn ? enemy.frames[frame] || enemy.frames[0] : null)?.length || enemy.verts || 0;
    ctx.fillText(`${enemy.name} · ${label} · ${nv} verts · ${frameTotal} frames`, 8, 16);
    this.opts.onDrawn?.();
  }
}


// ---- js/itemView.js ----
const ITEM_VERT_HIT = 10;
const ITEM_LINE_HIT = 6;
const ITEM_BOX_CLICK = 4;
const ITEM_ZOOM_K = 0.008;

function clampItemDist(d) {
  return Math.max(ITEM_ORBIT_DIST_MIN, Math.min(ITEM_ORBIT_DIST_MAX, d));
}

/** { verts: [{x,y,z}], lines: [[i,j]] } in local indices. Survives mesh-type switches. */
let itemClip = null;

function offsetSortKey([dx, dy, dz]) {
  const m = Math.abs(dx) + Math.abs(dy) + Math.abs(dz);
  const axis = dx !== 0 ? 0 : dz !== 0 ? 1 : 2;
  const sign = dx + dy + dz < 0 ? 1 : 0;
  return m * 100 + axis * 10 + sign;
}

class ItemView {
  constructor(canvas, opts) {
    this.canvas = canvas;
    this.ctx = canvas.getContext("2d");
    this.opts = opts;
    this.orbit = { yaw: 0.6, pitch: 0.35, dist: 16, target: { x: 0, y: 0, z: 0 } };
    this.drag = null;
    this.hoverVert = -1;
    this.hoverLine = -1;
    this.hoverGizmo = null;
    this.selectedVerts = [];
    this.selectedLines = [];
    this.enabled = false;
    this.pointerInside = false;
    this._ro = new ResizeObserver(() => this.resize());
    this._ro.observe(opts.stage || canvas.parentElement);
    this.resize();

    canvas.addEventListener("pointerenter", () => {
      this.pointerInside = true;
    });
    canvas.addEventListener("pointerleave", () => {
      this.pointerInside = false;
    });
    canvas.addEventListener("pointerdown", (e) => this.#onDown(e));
    canvas.addEventListener("pointermove", (e) => this.#onMove(e));
    canvas.addEventListener("pointerup", (e) => this.#onUp(e));
    canvas.addEventListener("pointerleave", (e) => this.#onUp(e));
    canvas.addEventListener("wheel", (e) => this.#onWheel(e), { passive: false });
    canvas.addEventListener("contextmenu", (e) => e.preventDefault());
    canvas.addEventListener("mousedown", (e) => {
      if (e.button === 1) e.preventDefault();
    });
    canvas.addEventListener("auxclick", (e) => {
      if (e.button === 1) e.preventDefault();
    });
    const spinLoop = () => {
      if (this.enabled && this.#spinning()) this.draw();
      requestAnimationFrame(spinLoop);
    };
    requestAnimationFrame(spinLoop);
  }

  /**
   * Rotating-item preview. Runs only while the pointer is off the canvas with nothing
   * selected or dragged, so picking and the gizmo always see authored coordinates.
   */
  #spinning() {
    return (
      !!this.opts.getSpin?.() &&
      !this.drag &&
      !this.pointerInside &&
      !this.selectedVerts.length &&
      !this.selectedLines.length
    );
  }

  #spinYaw() {
    return this.#spinning() ? itemSpinAngle() : 0;
  }

  resize() {
    if (!this.enabled) return;
    const stage = this.opts.stage || this.canvas.parentElement;
    const rect = stage.getBoundingClientRect();
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const w = Math.max(64, Math.floor(rect.width));
    const h = Math.max(64, Math.floor(rect.height));
    this.canvas.width = Math.floor(w * dpr);
    this.canvas.height = Math.floor(h * dpr);
    this.canvas.style.width = `${w}px`;
    this.canvas.style.height = `${h}px`;
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    this.cssW = w;
    this.cssH = h;
    this.draw();
  }

  selection() {
    return { verts: [...this.selectedVerts], lines: [...this.selectedLines] };
  }

  clearSelection() {
    this.selectedVerts = [];
    this.selectedLines = [];
    this.hoverVert = -1;
    this.hoverLine = -1;
    this.hoverGizmo = null;
  }

  addVertAtOrigin() {
    const mesh = this.#mesh();
    if (mesh.verts.length >= ITEM_MAX_VERTS) {
      this.opts.onStatus?.("Vertex cap (16)", true);
      return false;
    }
    const cell = { x: ITEM_ORIGIN, y: ITEM_ORIGIN, z: ITEM_ORIGIN };
    if (this.#occupied(mesh, cell.x, cell.y, cell.z)) {
      this.opts.onStatus?.("Origin is occupied", true);
      return false;
    }
    const next = [...mesh.verts, { ...cell }];
    if (!this.#uniqueOk(next)) {
      this.opts.onStatus?.(`Would exceed ${ITEM_MAX_UNIQUE} unique X or Z`, true);
      return false;
    }
    this.opts.beginUndo?.();
    mesh.verts.push({ ...cell });
    this.opts.endUndo?.();
    this.selectedVerts = [mesh.verts.length - 1];
    this.selectedLines = [];
    this.opts.onChange?.();
    this.opts.onSelect?.();
    this.draw();
    return true;
  }

  addLineFromSelection() {
    const mesh = this.#mesh();
    if (this.selectedVerts.length !== 2) {
      this.opts.onStatus?.("Select two vertices", true);
      return false;
    }
    const [a, b] = this.selectedVerts;
    if (!this.#canAddLine(mesh, a, b)) {
      this.opts.onStatus?.(mesh.lines.length >= ITEM_MAX_LINES ? "Line cap (16)" : "Line already exists", true);
      return false;
    }
    this.opts.beginUndo?.();
    this.#tryAddLine(mesh, a, b);
    this.opts.endUndo?.();
    this.opts.onChange?.();
    this.opts.onSelect?.();
    this.draw();
    return true;
  }

  deleteSelection() {
    const mesh = this.#mesh();
    if (!mesh) return false;
    const lines = [...this.selectedLines].filter((i) => i >= 0 && i < mesh.lines.length).sort((a, b) => b - a);
    const verts = [...this.selectedVerts].filter((i) => i >= 0 && i < mesh.verts.length).sort((a, b) => b - a);
    if (!lines.length && !verts.length) return false;
    this.opts.beginUndo?.();
    for (const i of lines) mesh.lines.splice(i, 1);
    for (const i of verts) {
      mesh.verts.splice(i, 1);
      mesh.lines = mesh.lines
        .filter(([a, b]) => a !== i && b !== i)
        .map(([a, b]) => [a > i ? a - 1 : a, b > i ? b - 1 : b]);
    }
    this.opts.endUndo?.();
    this.clearSelection();
    this.opts.onChange?.();
    this.opts.onSelect?.();
    this.draw();
    return true;
  }

  hasClipboard() {
    return !!(itemClip && itemClip.verts.length);
  }

  copySelection() {
    const clip = this.#gatherSelection();
    if (!clip) {
      this.opts.onStatus?.("Nothing selected", true);
      return false;
    }
    itemClip = clip;
    this.opts.onSelect?.();
    const nv = clip.verts.length;
    const ne = clip.lines.length;
    this.opts.onStatus?.(`Copied ${nv} vert${nv === 1 ? "" : "s"}, ${ne} line${ne === 1 ? "" : "s"}`);
    return true;
  }

  pasteSelection() {
    if (!itemClip?.verts.length) {
      this.opts.onStatus?.("Nothing to paste", true);
      return false;
    }
    const mesh = this.#mesh();
    const addV = itemClip.verts.length;
    const addE = itemClip.lines.length;
    if (mesh.verts.length + addV > ITEM_MAX_VERTS) {
      this.opts.onStatus?.("Vertex cap (16)", true);
      return false;
    }
    if (mesh.lines.length + addE > ITEM_MAX_LINES) {
      this.opts.onStatus?.("Line cap (16)", true);
      return false;
    }
    let uniqueFail = false;
    let placed = null;
    for (const [dx, dy, dz] of this.#pasteOffsets()) {
      const trial = this.#shiftedClip(dx, dy, dz);
      if (!trial || this.#cellsBlocked(mesh, trial)) continue;
      if (!this.#uniqueOk([...mesh.verts, ...trial])) {
        uniqueFail = true;
        continue;
      }
      placed = trial;
      break;
    }
    if (!placed) {
      this.opts.onStatus?.(
        uniqueFail ? `Would exceed ${ITEM_MAX_UNIQUE} unique X or Z` : "No free cells for paste",
        true
      );
      return false;
    }
    this.opts.beginUndo?.();
    const base = mesh.verts.length;
    for (const v of placed) mesh.verts.push({ x: v.x, y: v.y, z: v.z });
    for (const [a, b] of itemClip.lines) this.#tryAddLine(mesh, base + a, base + b);
    this.opts.endUndo?.();
    this.selectedVerts = placed.map((_, i) => base + i);
    this.selectedLines = [];
    this.opts.onChange?.();
    this.opts.onSelect?.();
    this.draw();
    this.opts.onStatus?.(`Pasted ${addV} vert${addV === 1 ? "" : "s"}, ${addE} line${addE === 1 ? "" : "s"}`);
    return true;
  }

  #gatherSelection() {
    const mesh = this.#mesh();
    const vset = new Set();
    const edgeKeys = new Set();
    const addEdge = (a, b) => {
      if (a === b || !mesh.verts[a] || !mesh.verts[b]) return;
      edgeKeys.add(`${Math.min(a, b)},${Math.max(a, b)}`);
    };
    for (const i of this.selectedVerts) {
      if (mesh.verts[i]) vset.add(i);
    }
    for (const i of this.selectedLines) {
      const e = mesh.lines[i];
      if (!e) continue;
      if (mesh.verts[e[0]]) vset.add(e[0]);
      if (mesh.verts[e[1]]) vset.add(e[1]);
      addEdge(e[0], e[1]);
    }
    if (!vset.size) return null;
    for (const [a, b] of mesh.lines) {
      if (vset.has(a) && vset.has(b)) addEdge(a, b);
    }
    const indices = [...vset].sort((a, b) => a - b);
    const imap = new Map(indices.map((i, j) => [i, j]));
    return {
      verts: indices.map((i) => {
        const v = mesh.verts[i];
        return { x: clampItemCoord(v.x), y: clampItemCoord(v.y), z: clampItemCoord(v.z) };
      }),
      lines: [...edgeKeys].map((k) => {
        const [a, b] = k.split(",").map(Number);
        return [imap.get(a), imap.get(b)];
      }),
    };
  }

  #pasteOffsets() {
    const offs = [];
    for (let dx = ITEM_MIN; dx <= ITEM_MAX; dx++) {
      for (let dy = ITEM_MIN; dy <= ITEM_MAX; dy++) {
        for (let dz = ITEM_MIN; dz <= ITEM_MAX; dz++) {
          offs.push([dx, dy, dz]);
        }
      }
    }
    offs.sort((a, b) => offsetSortKey(a) - offsetSortKey(b));
    return offs;
  }

  #shiftedClip(dx, dy, dz) {
    const placed = [];
    for (const v of itemClip.verts) {
      const x = v.x + dx;
      const y = v.y + dy;
      const z = v.z + dz;
      if (
        x < ITEM_COORD_MIN ||
        x > ITEM_COORD_MAX ||
        y < ITEM_COORD_MIN ||
        y > ITEM_COORD_MAX ||
        z < ITEM_COORD_MIN ||
        z > ITEM_COORD_MAX
      ) {
        return null;
      }
      placed.push({ x, y, z });
    }
    return placed;
  }

  #cellsBlocked(mesh, placed) {
    const seen = new Set();
    for (const v of placed) {
      const k = `${v.x},${v.y},${v.z}`;
      if (seen.has(k) || this.#occupied(mesh, v.x, v.y, v.z)) return true;
      seen.add(k);
    }
    return false;
  }

  #mesh() {
    return this.opts.getMesh?.() || { verts: [], lines: [] };
  }

  #cam() {
    const { yaw, pitch, dist, target } = this.orbit;
    const { forward } = lookVectors(yaw, pitch);
    return {
      x: target.x - forward.x * dist,
      y: target.y - forward.y * dist,
      z: target.z - forward.z * dist,
      yaw,
      pitch,
    };
  }

  /** Frame mesh verts; if none, center on origin without changing dist. */
  focusObject() {
    const points = this.#mesh().verts;
    if (!points?.length) {
      this.orbit.target = { x: 0, y: 0, z: 0 };
      this.opts.onViewChanged?.();
      this.draw();
      return true;
    }

    let minx = Infinity;
    let miny = Infinity;
    let minz = Infinity;
    let maxx = -Infinity;
    let maxy = -Infinity;
    let maxz = -Infinity;
    for (const v of points) {
      minx = Math.min(minx, v.x);
      miny = Math.min(miny, v.y);
      minz = Math.min(minz, v.z);
      maxx = Math.max(maxx, v.x);
      maxy = Math.max(maxy, v.y);
      maxz = Math.max(maxz, v.z);
    }
    const box = {
      x: minx,
      y: miny,
      z: minz,
      sx: Math.max(1e-3, maxx - minx),
      sy: Math.max(1e-3, maxy - miny),
      sz: Math.max(1e-3, maxz - minz),
    };
    const center = aabbCenter(box);
    const { yaw, pitch } = this.orbit;
    const { forward, right, up } = lookVectors(yaw, pitch);
    const w = this.cssW;
    const h = this.cssH;
    const focal = Math.min(w, h) * 0.9;
    const pad = 0.82;
    const halfW = Math.max(1, w * 0.5 * pad);
    const halfH = Math.max(1, h * 0.5 * pad);

    let frameDist = 4;
    for (let i = 0; i < 8; i++) {
      const c = cornerWorld(box, i);
      const rx = c.x - center.x;
      const ry = c.y - center.y;
      const rz = c.z - center.z;
      const cx = rx * right.x + ry * right.y + rz * right.z;
      const cy = rx * up.x + ry * up.y + rz * up.z;
      const cz = rx * forward.x + ry * forward.y + rz * forward.z;
      frameDist = Math.max(frameDist, (Math.abs(cx) * focal) / halfW - cz);
      frameDist = Math.max(frameDist, (Math.abs(cy) * focal) / halfH - cz);
      frameDist = Math.max(frameDist, 1 - cz);
    }

    this.orbit.target = { x: center.x, y: center.y, z: center.z };
    this.orbit.dist = clampItemDist(frameDist);
    this.opts.onViewChanged?.();
    this.draw();
    return true;
  }

  #eventPos(e) {
    const rect = this.canvas.getBoundingClientRect();
    return {
      x: ((e.clientX - rect.left) / rect.width) * this.cssW,
      y: ((e.clientY - rect.top) / rect.height) * this.cssH,
    };
  }

  #selectionAnchor() {
    const mesh = this.#mesh();
    const selected = this.selectedVerts.filter((i) => mesh.verts[i]);
    if (!selected.length) return null;
    if (selected.length === 1) {
      const i = selected[0];
      return { v: mesh.verts[i], indices: selected };
    }
    let x = 0;
    let y = 0;
    let z = 0;
    for (const i of selected) {
      x += mesh.verts[i].x;
      y += mesh.verts[i].y;
      z += mesh.verts[i].z;
    }
    const n = selected.length;
    return { v: { x: x / n, y: y / n, z: z / n }, indices: selected };
  }

  #applyVertDrag(origs, applyCoord) {
    const mesh = this.#mesh();
    const next = mesh.verts.map((v) => ({ ...v }));
    for (const o of origs) {
      next[o.i].x = o.x;
      next[o.i].y = o.y;
      next[o.i].z = o.z;
      applyCoord(next[o.i], o);
    }
    // Coincident verts are allowed mid-drag; #mergeDropped welds them on release.
    if (!this.#uniqueOk(next)) return false;
    for (const o of origs) {
      mesh.verts[o.i].x = next[o.i].x;
      mesh.verts[o.i].y = next[o.i].y;
      mesh.verts[o.i].z = next[o.i].z;
    }
    return true;
  }

  #gizmoDragOrigs(prim) {
    const mesh = this.#mesh();
    return prim.indices.map((i) => ({
      i,
      x: mesh.verts[i].x,
      y: mesh.verts[i].y,
      z: mesh.verts[i].z,
    }));
  }

  /**
   * Ctrl-drag: first valid move appends a copy of each dragged vertex plus a line from
   * the original to it, then drags the copies. Nothing is added if the move is refused.
   */
  #dupStart(d) {
    const mesh = this.#mesh();
    const n = d.origs.length;
    if (mesh.verts.length + n > ITEM_MAX_VERTS) {
      this.opts.onStatus?.("Vertex cap (16)", true);
      return false;
    }
    if (mesh.lines.length + n > ITEM_MAX_LINES) {
      this.opts.onStatus?.("Line cap (16)", true);
      return false;
    }
    const base = mesh.verts.length;
    d.dupFrom = d.origs;
    for (const o of d.origs) mesh.verts.push({ x: o.x, y: o.y, z: o.z });
    d.origs.forEach((o, k) => mesh.lines.push([o.i, base + k]));
    d.origs = d.origs.map((o, k) => ({ i: base + k, x: o.x, y: o.y, z: o.z }));
    return true;
  }

  #dupUndo(d) {
    const mesh = this.#mesh();
    const n = d.dupFrom.length;
    mesh.verts.length -= n;
    mesh.lines.length -= n;
    d.origs = d.dupFrom;
    d.dupFrom = null;
  }

  /** Apply a gizmo drag step, creating the ctrl-drag copies on the first one that lands. */
  #dragStep(coordFn) {
    const d = this.drag;
    if (d.dupBlocked) return false;
    const starting = d.dup && !d.dupDone;
    if (starting && !this.#dupStart(d)) {
      d.dupBlocked = true;
      return false;
    }
    const ok = this.#applyVertDrag(d.origs, coordFn);
    if (ok) d.moved = true;
    if (starting) {
      if (ok) {
        d.dupDone = true;
        this.selectedVerts = d.origs.map((o) => o.i);
        this.selectedLines = [];
        this.opts.onSelect?.();
      } else this.#dupUndo(d);
    }
    return ok;
  }

  /**
   * Drop-merge: every dragged vertex now sitting on a vertex that was not dragged is welded into
   * it. Lines follow the survivor; a line that collapses to a point or duplicates another is
   * dropped, so a ctrl-drag copy dropped on vertex B leaves its new line (original, B).
   * Returns the number of vertices removed.
   */
  #mergeDropped(indices) {
    const mesh = this.#mesh();
    const moved = new Set(indices);
    const into = new Map();
    for (const i of moved) {
      const v = mesh.verts[i];
      if (!v) continue;
      const j = mesh.verts.findIndex((w, k) => !moved.has(k) && w.x === v.x && w.y === v.y && w.z === v.z);
      if (j >= 0) into.set(i, j);
    }
    if (!into.size) return 0;
    const seen = new Set();
    const lines = [];
    for (const [a0, b0] of mesh.lines) {
      const a = into.get(a0) ?? a0;
      const b = into.get(b0) ?? b0;
      if (a === b) continue;
      const lo = Math.min(a, b);
      const hi = Math.max(a, b);
      const k = `${lo}-${hi}`;
      if (seen.has(k)) continue;
      seen.add(k);
      lines.push([lo, hi]);
    }
    const newIdx = [];
    let n = 0;
    mesh.verts.forEach((_, i) => {
      newIdx[i] = into.has(i) ? -1 : n++;
    });
    mesh.verts = mesh.verts.filter((_, i) => !into.has(i));
    mesh.lines = lines.map(([a, b]) => [newIdx[a], newIdx[b]]);
    this.selectedVerts = [...new Set([...moved].map((i) => newIdx[into.get(i) ?? i]))];
    this.selectedLines = [];
    return into.size;
  }

  #startGizmoDrag(gizmoHit, prim, p, dup = false) {
    this.opts.beginUndo?.();
    this.drag = {
      dup,
      dupDone: false,
      dupBlocked: false,
      kind: gizmoHit.kind,
      axis: gizmoHit.axis,
      plane: gizmoHit.plane,
      planeN: gizmoHit.planeN,
      grab: gizmoHit.world,
      gizmoAxisLen: gizmoHit.gizmoAxisLen ?? GIZMO_FALLBACK_LEN,
      origs: this.#gizmoDragOrigs(prim),
      orig: { x: prim.v.x, y: prim.v.y, z: prim.v.z },
      start: p,
    };
  }

  #hitVert(mx, my, verts) {
    const cam = this.#cam();
    let best = -1;
    let bestD = ITEM_VERT_HIT;
    verts.forEach((v, i) => {
      const p = projectPoint(v, cam, this.cssW, this.cssH);
      if (!p.ok) return;
      const d = Math.hypot(mx - p.sx, my - p.sy);
      if (d < bestD) {
        bestD = d;
        best = i;
      }
    });
    return best;
  }

  #hitLine(mx, my, mesh) {
    const cam = this.#cam();
    let best = -1;
    let bestD = ITEM_LINE_HIT;
    mesh.lines.forEach(([ia, ib], i) => {
      const a = mesh.verts[ia];
      const b = mesh.verts[ib];
      if (!a || !b) return;
      const pl = projectLine(a, b, cam, this.cssW, this.cssH);
      if (!pl) return;
      const d = distPointToSegment2d(mx, my, pl.ax, pl.ay, pl.bx, pl.by);
      if (d < bestD) {
        bestD = d;
        best = i;
      }
    });
    return best;
  }

  #onWheel(e) {
    if (!this.enabled) return;
    e.preventDefault();
    this.orbit.dist = clampItemDist(this.orbit.dist * (e.deltaY > 0 ? 1.1 : 1 / 1.1));
    this.opts.onViewChanged?.();
    this.draw();
  }

  #occupied(mesh, x, y, z, skip = new Set()) {
    return mesh.verts.some((v, i) => !skip.has(i) && v.x === x && v.y === y && v.z === z);
  }

  #uniqueOk(verts) {
    const { nx, nz } = itemUniqueXZ(verts);
    return nx <= ITEM_MAX_UNIQUE && nz <= ITEM_MAX_UNIQUE;
  }

  #canAddLine(mesh, a, b) {
    if (a === b || a < 0 || b < 0 || a >= mesh.verts.length || b >= mesh.verts.length) return false;
    if (mesh.lines.length >= ITEM_MAX_LINES) return false;
    const lo = Math.min(a, b);
    const hi = Math.max(a, b);
    return !mesh.lines.some(([ia, ib]) => Math.min(ia, ib) === lo && Math.max(ia, ib) === hi);
  }

  #tryAddLine(mesh, a, b) {
    if (!this.#canAddLine(mesh, a, b)) return false;
    mesh.lines.push([Math.min(a, b), Math.max(a, b)]);
    return true;
  }

  #selectVert(i, additive) {
    if (i < 0) this.selectedVerts = [];
    else if (additive) {
      if (!this.selectedVerts.includes(i)) this.selectedVerts.push(i);
    } else this.selectedVerts = [i];
    this.selectedLines = [];
    this.opts.onSelect?.();
  }

  #selectVerts(indices, additive) {
    if (additive) {
      for (const i of indices) {
        if (!this.selectedVerts.includes(i)) this.selectedVerts.push(i);
      }
    } else this.selectedVerts = [...indices];
    this.selectedLines = [];
    this.opts.onSelect?.();
  }

  #selectLine(i, additive) {
    if (i < 0) this.selectedLines = [];
    else if (additive) {
      if (!this.selectedLines.includes(i)) this.selectedLines.push(i);
    } else this.selectedLines = [i];
    this.selectedVerts = [];
    this.opts.onSelect?.();
  }

  #onDown(e) {
    if (!this.enabled) return;
    this.canvas.focus();
    const p = this.#eventPos(e);
    const mesh = this.#mesh();

    if (e.button === 2 && e.altKey) {
      this.drag = { kind: "zoom", last: p };
      this.canvas.setPointerCapture(e.pointerId);
      return;
    }
    if (e.button === 1) {
      this.drag = { kind: "pan", last: p };
      this.canvas.setPointerCapture(e.pointerId);
      return;
    }
    if (e.button === 2) {
      this.drag = { kind: "orbit", last: p };
      this.canvas.setPointerCapture(e.pointerId);
      return;
    }
    if (e.button !== 0) return;
    if (e.altKey) {
      e.preventDefault();
      this.drag = { kind: "orbit", last: p };
      this.canvas.setPointerCapture(e.pointerId);
      return;
    }

    const prim = this.#selectionAnchor();
    const cam = this.#cam();
    if (prim) {
      const gizmoHit = hitTranslateGizmo(prim.v, cam, this.cssW, this.cssH, p.x, p.y);
      if (gizmoHit) {
        this.#startGizmoDrag(gizmoHit, prim, p, e.ctrlKey || e.metaKey);
        this.canvas.setPointerCapture(e.pointerId);
        return;
      }
    }

    const vi = this.#hitVert(p.x, p.y, mesh.verts);
    if (vi >= 0) {
      this.#selectVert(vi, e.shiftKey);
      this.drag = { kind: "select" };
      this.canvas.setPointerCapture(e.pointerId);
      this.draw();
      return;
    }

    const li = this.#hitLine(p.x, p.y, mesh);
    if (li >= 0) {
      this.#selectLine(li, e.shiftKey);
      this.drag = { kind: "select" };
      this.canvas.setPointerCapture(e.pointerId);
      this.draw();
      return;
    }

    this.drag = { kind: "box", start: p, end: p, additive: e.shiftKey };
    this.canvas.setPointerCapture(e.pointerId);
  }

  #onMove(e) {
    if (!this.enabled) return;
    const p = this.#eventPos(e);
    const mesh = this.#mesh();
    if (!this.drag) {
      const prim = this.#selectionAnchor();
      const cam = this.#cam();
      this.hoverVert = this.#hitVert(p.x, p.y, mesh.verts);
      this.hoverGizmo =
        prim && this.hoverVert < 0
          ? hitTranslateGizmo(prim.v, cam, this.cssW, this.cssH, p.x, p.y)
          : null;
      this.hoverLine = this.hoverGizmo || this.hoverVert >= 0 ? -1 : this.#hitLine(p.x, p.y, mesh);
      this.draw();
      return;
    }
    if (this.drag.kind === "orbit") {
      const dx = p.x - this.drag.last.x;
      const dy = p.y - this.drag.last.y;
      this.drag.last = p;
      this.orbit.yaw += dx * 0.01;
      this.orbit.pitch = Math.max(-1.2, Math.min(1.2, this.orbit.pitch - dy * 0.01));
      this.opts.onViewChanged?.();
      this.draw();
      return;
    }
    if (this.drag.kind === "pan") {
      const dx = p.x - this.drag.last.x;
      const dy = p.y - this.drag.last.y;
      this.drag.last = p;
      const focal = Math.min(this.cssW, this.cssH) * 0.9;
      const scale = this.orbit.dist / focal;
      const { right, up } = lookVectors(this.orbit.yaw, this.orbit.pitch);
      const t = this.orbit.target;
      t.x += (-right.x * dx + up.x * dy) * scale;
      t.y += (-right.y * dx + up.y * dy) * scale;
      t.z += (-right.z * dx + up.z * dy) * scale;
      this.opts.onViewChanged?.();
      this.draw();
      return;
    }
    if (this.drag.kind === "zoom") {
      const dx = p.x - this.drag.last.x;
      const dy = p.y - this.drag.last.y;
      this.drag.last = p;
      const delta = dx + dy;
      if (delta) this.orbit.dist = clampItemDist(this.orbit.dist * Math.exp(-delta * ITEM_ZOOM_K));
      this.opts.onViewChanged?.();
      this.draw();
      return;
    }
    if (this.drag.kind === "box") {
      this.drag.end = p;
      this.draw();
      return;
    }
    if (this.drag.kind === "axis") {
      const cam = this.#cam();
      const delta = gizmoAxisDragDelta(
        p,
        this.drag.grab,
        this.drag.axis,
        this.drag.start,
        this.drag.gizmoAxisLen ?? GIZMO_FALLBACK_LEN,
        cam,
        this.cssW,
        this.cssH,
        false
      );
      if (delta == null) return;
      const axis = this.drag.axis;
      if (
        this.#dragStep((v, o) => {
          v[axis] = clampItemCoord(o[axis] + delta);
        })
      ) {
        this.opts.onChange?.();
        this.draw();
      }
      return;
    }
    if (this.drag.kind === "plane") {
      const cam = this.#cam();
      const ray = screenRay(p.x, p.y, cam, this.cssW, this.cssH);
      const hit = intersectPlane(ray.origin, ray.dir, this.drag.grab, this.drag.planeN);
      if (!hit) return;
      let dx = hit.point.x - this.drag.grab.x;
      let dy = hit.point.y - this.drag.grab.y;
      let dz = hit.point.z - this.drag.grab.z;
      if (this.drag.plane === "xy") dz = 0;
      else if (this.drag.plane === "xz") dy = 0;
      else if (this.drag.plane === "yz") dx = 0;
      if (
        this.#dragStep((v, o) => {
          v.x = clampItemCoord(o.x + dx);
          v.y = clampItemCoord(o.y + dy);
          v.z = clampItemCoord(o.z + dz);
        })
      ) {
        this.opts.onChange?.();
        this.draw();
      }
    }
  }

  #boxRect() {
    const a = this.drag.start;
    const b = this.drag.end;
    const x0 = Math.min(a.x, b.x);
    const y0 = Math.min(a.y, b.y);
    const x1 = Math.max(a.x, b.x);
    const y1 = Math.max(a.y, b.y);
    return { x0, y0, x1, y1, w: x1 - x0, h: y1 - y0 };
  }

  #vertsInBox(rect) {
    const mesh = this.#mesh();
    const cam = this.#cam();
    const hits = [];
    mesh.verts.forEach((v, i) => {
      const p = projectPoint(v, cam, this.cssW, this.cssH);
      if (!p.ok) return;
      if (p.sx >= rect.x0 && p.sx <= rect.x1 && p.sy >= rect.y0 && p.sy <= rect.y1) hits.push(i);
    });
    return hits;
  }

  #finishBox() {
    const rect = this.#boxRect();
    const additive = this.drag.additive;
    if (rect.w < ITEM_BOX_CLICK && rect.h < ITEM_BOX_CLICK) {
      if (!additive) {
        this.selectedVerts = [];
        this.selectedLines = [];
        this.opts.onSelect?.();
      }
      return;
    }
    this.#selectVerts(this.#vertsInBox(rect), additive);
  }

  #onUp(e) {
    if (!this.enabled) return;
    const orbitEnded = this.drag?.kind === "orbit" || this.drag?.kind === "zoom" || this.drag?.kind === "pan";
    if (this.drag?.kind === "box") this.#finishBox();
    if (this.drag?.kind === "axis" || this.drag?.kind === "plane") {
      const merged = this.drag.moved ? this.#mergeDropped(this.drag.origs.map((o) => o.i)) : 0;
      if (merged) {
        this.opts.onChange?.();
        this.opts.onSelect?.();
        this.opts.onStatus?.(`Merged ${merged} vertex${merged === 1 ? "" : "es"}`);
      }
      this.opts.endUndo?.();
    }
    this.drag = null;
    if (orbitEnded) this.opts.onViewChanged?.();
    try {
      this.canvas.releasePointerCapture(e.pointerId);
    } catch {
      /* ignore */
    }
    this.draw();
  }

  #strokeSeg(ctx, cam, w, h, p0, p1, col, width = 1) {
    const seg = projectLine(p0, p1, cam, w, h);
    if (!seg) return;
    ctx.strokeStyle = col;
    ctx.lineWidth = width;
    ctx.beginPath();
    ctx.moveTo(seg.ax, seg.ay);
    ctx.lineTo(seg.bx, seg.by);
    ctx.stroke();
  }

  #drawGizmo(ctx, cam, w, h, v) {
    drawTranslateGizmo(ctx, v, cam, w, h, { hoverGizmo: this.hoverGizmo, drag: this.drag });
  }

  #drawForwardArrow(ctx, cam, w, h) {
    const y = 0.15;
    const tipZ = ITEM_MAX;
    const barbZ = ITEM_MAX - 1.2;
    const tip = { x: 0, y, z: tipZ };
    const col = "#d4a017";
    this.#strokeSeg(ctx, cam, w, h, { x: 0, y, z: 0 }, tip, col, 2.5);
    this.#strokeSeg(ctx, cam, w, h, tip, { x: 0.9, y, z: barbZ }, col, 2);
    this.#strokeSeg(ctx, cam, w, h, tip, { x: -0.9, y, z: barbZ }, col, 2);
    this.#strokeSeg(ctx, cam, w, h, tip, { x: 0, y: 1.05, z: barbZ }, col, 2);
    const label = projectPoint({ x: 0, y: 0.55, z: tipZ + 0.6 }, cam, w, h);
    if (label.ok) {
      ctx.fillStyle = col;
      ctx.font = "11px Segoe UI, sans-serif";
      ctx.fillText("fwd", label.sx - 10, label.sy);
    }
  }

  /** Dim player spawn (collision box + stick figure) at game scale, for sizing. */
  #drawGhost(ctx, cam, w, h) {
    const g = this.opts.getGhost?.();
    if (!g) return;
    ctx.save();
    ctx.strokeStyle = "#3ee06a";
    ctx.lineWidth = 1;
    ctx.globalAlpha = 0.25;
    for (const [i, j] of BOX_EDGES) {
      const a = cornerWorld(g.box, i);
      const b = cornerWorld(g.box, j);
      this.#strokeSeg(ctx, cam, w, h, a, b, "#3ee06a");
    }
    ctx.globalAlpha = 0.6;
    for (const [i, j] of g.lines) {
      if (g.verts[i] && g.verts[j]) this.#strokeSeg(ctx, cam, w, h, g.verts[i], g.verts[j], "#3ee06a", 1.5);
    }
    ctx.restore();
  }

  draw() {
    if (!this.enabled) return;
    const ctx = this.ctx;
    const w = this.cssW;
    const h = this.cssH;
    if (!w || !h) return;
    ctx.fillStyle = "#0a0a0c";
    ctx.fillRect(0, 0, w, h);
    const cam = this.#cam();
    const mesh = this.#mesh();
    const lo = ITEM_MIN;
    const hi = ITEM_MAX;

    for (let i = lo; i <= hi; i++) {
      const col = i === 0 ? "#3d4658" : "#2a3140";
      this.#strokeSeg(ctx, cam, w, h, { x: i, y: 0, z: lo }, { x: i, y: 0, z: hi }, col);
      this.#strokeSeg(ctx, cam, w, h, { x: lo, y: 0, z: i }, { x: hi, y: 0, z: i }, col);
    }
    const cube = [
      [
        { x: lo, y: lo, z: lo },
        { x: hi, y: lo, z: lo },
      ],
      [
        { x: hi, y: lo, z: lo },
        { x: hi, y: lo, z: hi },
      ],
      [
        { x: hi, y: lo, z: hi },
        { x: lo, y: lo, z: hi },
      ],
      [
        { x: lo, y: lo, z: hi },
        { x: lo, y: lo, z: lo },
      ],
      [
        { x: lo, y: hi, z: lo },
        { x: hi, y: hi, z: lo },
      ],
      [
        { x: hi, y: hi, z: lo },
        { x: hi, y: hi, z: hi },
      ],
      [
        { x: hi, y: hi, z: hi },
        { x: lo, y: hi, z: hi },
      ],
      [
        { x: lo, y: hi, z: hi },
        { x: lo, y: hi, z: lo },
      ],
      [
        { x: lo, y: lo, z: lo },
        { x: lo, y: hi, z: lo },
      ],
      [
        { x: hi, y: lo, z: lo },
        { x: hi, y: hi, z: lo },
      ],
      [
        { x: hi, y: lo, z: hi },
        { x: hi, y: hi, z: hi },
      ],
      [
        { x: lo, y: lo, z: hi },
        { x: lo, y: hi, z: hi },
      ],
    ];
    for (const [a, b] of cube) this.#strokeSeg(ctx, cam, w, h, a, b, "#252a35");

    this.#drawForwardArrow(ctx, cam, w, h);
    this.#drawGhost(ctx, cam, w, h);

    let shownVerts = this.selectedVerts;
    if (this.drag?.kind === "box") {
      const r = this.#boxRect();
      if (r.w >= ITEM_BOX_CLICK || r.h >= ITEM_BOX_CLICK) {
        const hits = this.#vertsInBox(r);
        shownVerts = this.drag.additive ? [...new Set([...this.selectedVerts, ...hits])] : hits;
      }
    }

    const yaw = this.#spinYaw();
    const dverts = yaw
      ? mesh.verts.map((v) => ({
          x: v.x * Math.cos(yaw) + v.z * Math.sin(yaw),
          y: v.y,
          z: -v.x * Math.sin(yaw) + v.z * Math.cos(yaw),
        }))
      : mesh.verts;

    mesh.lines.forEach(([ia, ib], i) => {
      const a = dverts[ia];
      const b = dverts[ib];
      if (!a || !b) return;
      const sel = this.selectedLines.includes(i);
      this.#strokeSeg(ctx, cam, w, h, a, b, sel ? "#f2d36b" : "#c8ccd4", sel ? 2.5 : 1.5);
    });

    dverts.forEach((v, i) => {
      const pr = projectPoint(v, cam, w, h);
      if (!pr.ok) return;
      const sel = shownVerts.includes(i);
