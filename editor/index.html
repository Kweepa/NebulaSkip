// ---- js/roomGeom.js ----
/** Tetromino room geometry: canonical UV footprint, 90° axis rots, hull + colliders. */

const ROOM_SHAPES = ["box", "T", "L", "S", "C", "Stair", "Pit"];

function clampQuarter(n) {
  const r = n | 0;
  if (!Number.isFinite(r)) return 0;
  return ((r % 4) + 4) % 4;
}

function clampRoomShape(s) {
  return ROOM_SHAPES.includes(s) ? s : "box";
}

function rot90(p, axis) {
  if (axis === 0) return { x: p.x, y: -p.z, z: p.y };
  if (axis === 1) return { x: p.z, y: p.y, z: -p.x };
  return { x: -p.y, y: p.x, z: p.z };
}

function applyRots(p, rx, ry, rz) {
  let q = p;
  for (let i = 0; i < rx; i++) q = rot90(q, 0);
  for (let i = 0; i < ry; i++) q = rot90(q, 1);
  for (let i = 0; i < rz; i++) q = rot90(q, 2);
  return q;
}

function roomBasis(room) {
  const rx = clampQuarter(room.rx);
  const ry = clampQuarter(room.ry);
  const rz = clampQuarter(room.rz);
  const u = applyRots({ x: 1, y: 0, z: 0 }, rx, ry, rz);
  const w = applyRots({ x: 0, y: 1, z: 0 }, rx, ry, rz);
  const v = applyRots({ x: 0, y: 0, z: 1 }, rx, ry, rz);
  const sizeOn = (hat) => {
    if (hat.x) return room.sx | 0;
    if (hat.y) return room.sy | 0;
    return room.sz | 0;
  };
  return {
    u,
    w,
    v,
    uSize: sizeOn(u),
    wSize: sizeOn(w),
    vSize: sizeOn(v),
    rx,
    ry,
    rz,
  };
}

function vecEq(a, b) {
  return a.x === b.x && a.y === b.y && a.z === b.z;
}

function worldAxisIndex(axis) {
  if (axis === "x") return 0;
  if (axis === "y") return 1;
  return 2;
}

/** +90° about world X/Y/Z on room basis vectors. */
function worldRot90Basis(u, w, v, worldAxis) {
  const ax = worldAxisIndex(worldAxis);
  return { u: rot90(u, ax), w: rot90(w, ax), v: rot90(v, ax) };
}

/** Find rx/ry/rz whose applyRots matches the given orthonormal basis. */
function encodeQuartersFromBasis(u, w, v) {
  for (let rx = 0; rx < 4; rx++) {
    for (let ry = 0; ry < 4; ry++) {
      for (let rz = 0; rz < 4; rz++) {
        const ru = applyRots({ x: 1, y: 0, z: 0 }, rx, ry, rz);
        const rw = applyRots({ x: 0, y: 1, z: 0 }, rx, ry, rz);
        const rv = applyRots({ x: 0, y: 0, z: 1 }, rx, ry, rz);
        if (vecEq(ru, u) && vecEq(rw, w) && vecEq(rv, v)) return { rx, ry, rz };
      }
    }
  }
  return { rx: 0, ry: 0, rz: 0 };
}

function hatAxis(hat) {
  if (hat.x) return "x";
  if (hat.y) return "y";
  return "z";
}

function hatSign(hat) {
  return hat.x + hat.y + hat.z;
}

function localToWorld(room, u, w, v, basis) {
  const pos = { x: room.x | 0, y: room.y | 0, z: room.z | 0 };
  const add = (hat, t, tSize) => {
    const coord = hatSign(hat) > 0 ? t : tSize - t;
    if (hat.x) pos.x += coord;
    else if (hat.y) pos.y += coord;
    else pos.z += coord;
  };
  add(basis.u, u, basis.uSize);
  add(basis.w, w, basis.wSize);
  add(basis.v, v, basis.vSize);
  return pos;
}

function uvwBoxToWorld(room, box, basis) {
  const xs = [];
  const ys = [];
  const zs = [];
  const w0 = box.w0 ?? 0;
  const w1 = w0 + (box.sw ?? basis.wSize);
  for (const u of [box.u, box.u + box.su]) {
    for (const w of [w0, w1]) {
      for (const v of [box.v, box.v + box.sv]) {
        const p = localToWorld(room, u, w, v, basis);
        xs.push(p.x);
        ys.push(p.y);
        zs.push(p.z);
      }
    }
  }
  const x0 = Math.min(...xs);
  const y0 = Math.min(...ys);
  const z0 = Math.min(...zs);
  return {
    x: x0,
    y: y0,
    z: z0,
    sx: Math.max(1, Math.max(...xs) - x0),
    sy: Math.max(1, Math.max(...ys) - y0),
    sz: Math.max(1, Math.max(...zs) - z0),
  };
}

function cutCount(shape) {
  if (shape === "L") return 1;
  if (shape === "T" || shape === "S" || shape === "C" || shape === "Stair") return 2;
  if (shape === "Pit") return 3;
  return 0;
}

function cloneCuts(cuts) {
  return (cuts || []).map((c) => ({ su: c.su | 0, sv: c.sv | 0 }));
}

function stripLegacySplits(room) {
  delete room.flip;
  delete room.cutU;
  delete room.cutV;
  delete room.stemW;
  delete room.stemPos;
  delete room.barD;
  delete room.shift;
  delete room.mid;
}

function defaultCuts(shape, uSize, vSize, wSize) {
  const u = Math.max(1, uSize | 0);
  const v = Math.max(1, vSize | 0);
  if (shape === "Stair") {
    // cuts[0] = top row {su: void depth a, sv: row thickness}; cuts[1] = middle row {su: b < a, sv}.
    const a = Math.max(2, Math.min(u - 1, Math.floor((2 * u + 1) / 3)));
    const b = Math.max(1, Math.min(a - 1, Math.floor((u + 1) / 3)));
    const h = Math.max(1, Math.min((v - 1) >> 1, Math.floor(v / 3)));
    return [
      { su: a, sv: h },
      { su: b, sv: h },
    ];
  }
  if (shape === "Pit") {
    // cuts[0] = margins from the u=0 / v=0 sides, cuts[1] = margins from the far sides,
    // cuts[2] = {su: depth, sv: 0 (unused)}.
    const pw = Math.min(u, Math.max(3, u >> 1));
    const pl = Math.min(v, Math.max(3, v >> 1));
    const mu0 = Math.max(0, (u - pw) >> 1);
    const mv0 = Math.max(0, (v - pl) >> 1);
    const depth = Math.max(1, Math.min(2, (wSize == null ? 3 : wSize | 0) - 1));
    return [
      { su: mu0, sv: mv0 },
      { su: Math.max(0, u - pw - mu0), sv: Math.max(0, v - pl - mv0) },
      { su: depth, sv: 0 },
    ];
  }
  if (shape === "L") {
    return [
      {
        su: Math.max(1, Math.min(u - 1, u >> 1)),
        sv: Math.max(1, Math.min(v - 1, v >> 1)),
      },
    ];
  }
  if (shape === "T") {
    const stemW = Math.max(1, Math.min(Math.max(1, u - 2), Math.max(1, u >> 2)));
    const stemPos = Math.max(1, Math.min(u - stemW - 1, (u - stemW) >> 1));
    const barD = Math.max(1, Math.min(v - 1, Math.max(1, v >> 2)));
    const sv = Math.max(1, v - barD);
    return [
      { su: stemPos, sv },
      { su: Math.max(1, u - stemPos - stemW), sv },
    ];
  }
  if (shape === "S") {
    const maxShift = Math.max(1, Math.floor((u - 1) / 2));
    const shift = Math.max(1, Math.min(maxShift, Math.max(1, u >> 2)));
    const mid = Math.max(1, Math.min(v - 1, v >> 1));
    return [
      { su: shift, sv: Math.max(1, v - mid) },
      { su: shift, sv: mid },
    ];
  }
  if (shape === "C") {
    // su = arm length (from the back bar's inner face), sv = arm thickness.
    // Back bar thickness is u - max(su); the longer arm reaches the +u face.
    const d = Math.max(1, Math.min(u - 1, u >> 1));
    const arm = Math.max(1, Math.min((v - 1) >> 1, v >> 2));
    return [
      { su: d, sv: arm },
      { su: d, sv: arm },
    ];
  }
  return [];
}

function defaultRoomSplits(shape, uSize, vSize) {
  return { cuts: defaultCuts(shape, uSize, vSize) };
}

function cutsFromLegacy(room, shape, uSize, vSize) {
  const fallback = defaultCuts(shape, uSize, vSize);
  if (shape === "L") {
    const su = room.cutU | 0;
    const sv = room.cutV | 0;
    if (su >= 1 && sv >= 1) return [{ su, sv }];
    return fallback;
  }
  if (shape === "T") {
    const stemW = room.stemW | 0;
    const stemPos = room.stemPos | 0;
    const barD = room.barD | 0;
    if (stemW >= 1 && stemPos >= 1 && barD >= 1) {
      const sv = Math.max(1, vSize - barD);
      return [
        { su: stemPos, sv },
        { su: Math.max(1, uSize - stemPos - stemW), sv },
      ];
    }
    return fallback;
  }
  if (shape === "S") {
    const shift = room.shift | 0;
    const mid = room.mid | 0;
    if (shift >= 1 && mid >= 1) {
      return [
        { su: shift, sv: Math.max(1, vSize - mid) },
        { su: shift, sv: mid },
      ];
    }
    return fallback;
  }
  if (shape === "C" || shape === "Stair" || shape === "Pit") return fallback;
  return [];
}

/** Corner-anchored UV boxes for the room's cuts (no mutation). */
function cutoutUvBoxes(shape, cuts, uSize, vSize) {
  const keep = (box) => box.su > 0 && box.sv > 0;
  if (shape === "L") {
    const c = cuts[0];
    if (!c) return [];
    const box = { u: uSize - c.su, v: vSize - c.sv, su: c.su, sv: c.sv };
    return keep(box) ? [box] : [];
  }
  if (shape === "T") {
    const a = cuts[0];
    const b = cuts[1];
    if (!a || !b) return [];
    return [
      { u: 0, v: 0, su: a.su, sv: a.sv },
      { u: uSize - b.su, v: 0, su: b.su, sv: b.sv },
    ].filter(keep);
  }
  if (shape === "S") {
    const a = cuts[0];
    const b = cuts[1];
    if (!a || !b) return [];
    return [
      { u: uSize - a.su, v: vSize - a.sv, su: a.su, sv: a.sv },
      { u: 0, v: 0, su: b.su, sv: b.sv },
    ].filter(keep);
  }
  if (shape === "C") {
    const a = cuts[0];
    const b = cuts[1];
    if (!a || !b) return [];
    const t = uSize - Math.max(a.su, b.su);
    const boxes = [{ u: t, v: a.sv, su: uSize - t, sv: vSize - a.sv - b.sv }];
    if (a.su < b.su) boxes.push({ u: t + a.su, v: 0, su: b.su - a.su, sv: a.sv });
    else if (b.su < a.su) boxes.push({ u: t + b.su, v: vSize - b.sv, su: a.su - b.su, sv: b.sv });
    return boxes.filter(keep);
  }
  if (shape === "Stair") {
    const a = cuts[0];
    const b = cuts[1];
    if (!a || !b) return [];
    return [
      { u: uSize - a.su, v: vSize - a.sv, su: a.su, sv: a.sv },
      { u: uSize - b.su, v: vSize - a.sv - b.sv, su: b.su, sv: b.sv },
    ].filter(keep);
  }
  return [];
}

function axisGap(a0, as, b0, bs) {
  const a1 = a0 + as;
  const b1 = b0 + bs;
  if (a1 < b0) return b0 - a1;
  if (b1 < a0) return a0 - b1;
  return 0;
}

function uvSeparated(a, b) {
  return axisGap(a.u, a.su, b.u, b.su) >= 1 || axisGap(a.v, a.sv, b.v, b.sv) >= 1;
}

function maxCutDim(shape, cuts, index, dim, uSize, vSize) {
  const hi = dim === "su" ? uSize - 1 : vSize - 1;
  if (shape === "C") {
    if (dim === "su") return Math.max(1, hi);
    const other = cuts[1 - index];
    return Math.max(1, hi - Math.max(1, other ? other.sv : 1));
  }
  if (shape === "Stair") {
    // The two voids touch in v, so the generic separation test doesn't apply.
    const other = cuts[1 - index];
    if (dim === "sv") return Math.max(1, hi - Math.max(1, other ? other.sv : 1));
    if (index === 0) return Math.max(1, hi); // a ≤ U-1 (a ≥ b+1 is enforced in clampRoomSplits)
    return Math.max(1, (other ? other.su : uSize) - 1); // b ≤ a-1
  }
  if (cuts.length < 2) return Math.max(1, hi);
  const trial = cloneCuts(cuts);
  for (let s = hi; s >= 1; s--) {
    trial[index][dim] = s;
    const boxes = cutoutUvBoxes(shape, trial, uSize, vSize);
    if (boxes.length < 2 || uvSeparated(boxes[0], boxes[1])) return s;
  }
  return 1;
}

function resolveCuts(room, shape, uSize, vSize) {
  const n = cutCount(shape);
  if (n === 0) return [];
  if (Array.isArray(room.cuts) && room.cuts.length >= n) {
    return cloneCuts(room.cuts).slice(0, n);
  }
  return cutsFromLegacy(room, shape, uSize, vSize);
}

function clampRoomSplits(room, opts) {
  const shape = clampRoomShape(room.shape);
  room.shape = shape;
  room.rx = clampQuarter(room.rx);
  room.ry = clampQuarter(room.ry);
  room.rz = clampQuarter(room.rz);
  // A pit only makes sense with vertical extrusion (w = +y); yaw is still free.
  if (shape === "Pit") {
    room.rx = 0;
    room.rz = 0;
  }
  const basis = roomBasis(room);
  let { uSize, vSize } = basis;
  let wSize = basis.wSize;
  const n = cutCount(shape);
  if (shape === "L") {
    if (uSize < 2) {
      bumpAxis(room, basis.u, 2);
      uSize = 2;
    }
    if (vSize < 2) {
      bumpAxis(room, basis.v, 2);
      vSize = 2;
    }
  } else if (shape === "T" || shape === "S") {
    if (uSize < 3) {
      bumpAxis(room, basis.u, 3);
      uSize = 3;
    }
    if (vSize < 2) {
      bumpAxis(room, basis.v, 2);
      vSize = 2;
    }
  } else if (shape === "C") {
    if (uSize < 2) {
      bumpAxis(room, basis.u, 2);
      uSize = 2;
    }
    if (vSize < 3) {
      bumpAxis(room, basis.v, 3);
      vSize = 3;
    }
  } else if (shape === "Stair" || shape === "Pit") {
    if (uSize < 3) {
      bumpAxis(room, basis.u, 3);
      uSize = 3;
    }
    if (vSize < 3) {
      bumpAxis(room, basis.v, 3);
      vSize = 3;
    }
    if (shape === "Pit" && wSize < 2) {
      bumpAxis(room, basis.w, 2);
      wSize = 2;
    }
  }
  if (n === 0) {
    room.cuts = [];
    stripLegacySplits(room);
    return room;
  }
  const prefer = opts?.preferCut ?? 0;
  const preferDim = opts?.preferDim;
  const cuts = resolveCuts(room, shape, uSize, vSize);
  if (shape === "Pit") {
    // Margins may be 0; the pit stays at least 3x3 and 1..W-1 deep. The edited side wins.
    const keepFirst = prefer !== 1;
    [cuts[0].su, cuts[1].su] = fitMargins(cuts[0].su, cuts[1].su, uSize - 3, keepFirst);
    [cuts[0].sv, cuts[1].sv] = fitMargins(cuts[0].sv, cuts[1].sv, vSize - 3, keepFirst);
    cuts[2].su = clampInt(cuts[2].su, 1, wSize - 1, Math.min(2, wSize - 1));
    cuts[2].sv = 0;
    room.cuts = cuts;
    stripLegacySplits(room);
    return room;
  }
  const dims = preferDim === "sv" ? ["sv", "su"] : ["su", "sv"];
  const order = [prefer, ...cuts.map((_, i) => i).filter((i) => i !== prefer)];
  for (const i of order) {
    for (const dim of dims) {
      const hi = dim === "su" ? uSize - 1 : vSize - 1;
      cuts[i][dim] = clampInt(cuts[i][dim], 1, hi, 1);
      cuts[i][dim] = Math.min(cuts[i][dim], maxCutDim(shape, cuts, i, dim, uSize, vSize));
      if (shape === "Stair" && dim === "su" && i === 0) {
        // Top-row void must be deeper than the middle one (a > b).
        cuts[0].su = Math.min(uSize - 1, Math.max(cuts[0].su, cuts[1].su + 1));
      }
    }
  }
  room.cuts = cuts;
  stripLegacySplits(room);
  return room;
}

/** Two pit margins (>= 0) that must leave `limit` or more for the pit. Over budget: shrink the other one first. */
function fitMargins(a, b, limit, keepFirst) {
  let x = Math.max(0, a | 0);
  let y = Math.max(0, b | 0);
  let over = x + y - Math.max(0, limit);
  if (over > 0) {
    if (keepFirst) {
      const t = Math.min(y, over);
      y -= t;
      x -= over - t;
    } else {
      const t = Math.min(x, over);
      x -= t;
      y -= over - t;
    }
  }
  return [Math.max(0, x), Math.max(0, y)];
}

function clampInt(n, lo, hi, fallback) {
  if (n == null || n === "" || !Number.isFinite(Number(n))) return fallback;
  const x = n | 0;
  if (x === 0 && lo >= 1) return fallback;
  return Math.max(lo, Math.min(hi, x));
}

function bumpAxis(room, hat, minSize) {
  const a = hatAxis(hat);
  const key = a === "x" ? "sx" : a === "y" ? "sy" : "sz";
  if ((room[key] | 0) < minSize) room[key] = minSize;
}

function applyRoomShape(room, shape) {
  room.shape = clampRoomShape(shape);
  stripLegacySplits(room);
  const b = roomBasis(room);
  room.cuts = defaultCuts(room.shape, b.uSize, b.vSize, b.wSize);
  return clampRoomSplits(room);
}

function coordAlongHat(room, t, hat, tSize) {
  const min = room[hatAxis(hat)] | 0;
  return hatSign(hat) > 0 ? min + t : min + tSize - t;
}

function tAlongHat(room, world, hat, tSize) {
  const min = room[hatAxis(hat)] | 0;
  return hatSign(hat) > 0 ? world - min : min + tSize - world;
}

/** Keep inner walls in world space when the AABB is resized from a face/corner. */
function preserveRoomSplits(room, orig) {
  const shape = clampRoomShape(room.shape);
  if (shape === "box" || !orig) return clampRoomSplits(room);
  const basis = roomBasis(orig);
  const newBasis = roomBasis(room);
  const oldU = basis.uSize;
  const oldV = basis.vSize;
  const newU = newBasis.uSize;
  const newV = newBasis.vSize;
  const mapU = (t) => Math.round(tAlongHat(room, coordAlongHat(orig, t, basis.u, oldU), newBasis.u, newU));
  const mapV = (t) => Math.round(tAlongHat(room, coordAlongHat(orig, t, basis.v, oldV), newBasis.v, newV));
  const origCuts = resolveCuts(orig, shape, oldU, oldV);
  const cuts = [];
  if (shape === "L") {
    const c = origCuts[0] || { su: 1, sv: 1 };
    cuts.push({
      su: newU - mapU(oldU - c.su),
      sv: newV - mapV(oldV - c.sv),
    });
  } else if (shape === "T") {
    const a = origCuts[0] || { su: 1, sv: 1 };
    const b = origCuts[1] || { su: 1, sv: 1 };
    cuts.push({ su: mapU(a.su), sv: mapV(a.sv) });
    cuts.push({ su: newU - mapU(oldU - b.su), sv: mapV(b.sv) });
  } else if (shape === "S") {
    const a = origCuts[0] || { su: 1, sv: 1 };
    const b = origCuts[1] || { su: 1, sv: 1 };
    cuts.push({
      su: newU - mapU(oldU - a.su),
      sv: newV - mapV(oldV - a.sv),
    });
    cuts.push({ su: mapU(b.su), sv: mapV(b.sv) });
  } else if (shape === "C") {
    const a = origCuts[0] || { su: 1, sv: 1 };
    const b = origCuts[1] || { su: 1, sv: 1 };
    const oldMax = Math.max(a.su, b.su);
    const oldT = oldU - oldMax;
    const newT = Math.max(1, Math.min(newU - 1, mapU(oldT)));
    // A longest arm keeps reaching the +u face; a shorter arm keeps its end in world space.
    const len = (c) =>
      c.su >= oldMax ? newU - newT : Math.max(1, Math.min(newU - newT, mapU(oldT + c.su) - newT));
    cuts.push({ su: len(a), sv: mapV(a.sv) });
    cuts.push({ su: len(b), sv: newV - mapV(oldV - b.sv) });
  } else if (shape === "Stair") {
    const a = origCuts[0] || { su: 2, sv: 1 };
    const b = origCuts[1] || { su: 1, sv: 1 };
    const topV = mapV(oldV - a.sv);
    cuts.push({ su: newU - mapU(oldU - a.su), sv: newV - topV });
    cuts.push({ su: newU - mapU(oldU - b.su), sv: topV - mapV(oldV - a.sv - b.sv) });
  } else if (shape === "Pit") {
    // Pit walls keep their world positions; depth is unchanged.
    const a = origCuts[0] || { su: 0, sv: 0 };
    const b = origCuts[1] || { su: 0, sv: 0 };
    const d = origCuts[2] || { su: 1, sv: 0 };
    cuts.push({ su: mapU(a.su), sv: mapV(a.sv) });
    cuts.push({ su: newU - mapU(oldU - b.su), sv: newV - mapV(oldV - b.sv) });
    cuts.push({ su: d.su, sv: 0 });
  }
  room.cuts = cuts;
  stripLegacySplits(room);
  return clampRoomSplits(room);
}

function applyRoomSplitDelta(room, orig, key, delta) {
  const shape = clampRoomShape(orig.shape);
  const basis = roomBasis(orig);
  const armKey = /^arm(\d)$/.exec(key);
  if (shape === "C" && (armKey || key === "cut0u")) {
    const cs = resolveCuts(orig, shape, basis.uSize, basis.vSize);
    const d = delta | 0;
    const maxL = Math.max(cs[0].su, cs[1].su);
    const minL = Math.min(cs[0].su, cs[1].su);
    if (armKey) {
      // One arm's end face. The back bar stays put (t = U - max length), so a shorter arm
      // moves within 1..max, and the unique longest arm can't move (use cut0u for that).
      const i = armKey[1] | 0;
      if (i > 1) return clampRoomSplits(room);
      const lo = cs[i].su > cs[1 - i].su ? maxL : 1;
      cs[i].su = Math.max(lo, Math.min(maxL, cs[i].su + d));
    } else {
      // Back bar inner face: arm ends stay put, so both lengths shift together.
      const dd = Math.max(1 - minL, Math.min(basis.uSize - 1 - maxL, d));
      cs[0].su += dd;
      cs[1].su += dd;
    }
    room.cuts = cs;
    room.shape = shape;
    return clampRoomSplits(room);
  }
  const m = /^cut(\d)([uv])$/.exec(key);
  if (!m) return clampRoomSplits(room);
  const i = m[1] | 0;
  const dim = m[2] === "u" ? "su" : "sv";
  const cuts = resolveCuts(orig, shape, basis.uSize, basis.vSize);
  if (i >= cuts.length) return clampRoomSplits(room);
  cuts[i][dim] = (cuts[i][dim] | 0) + (delta | 0);
  room.cuts = cuts;
  room.shape = shape;
  return clampRoomSplits(room, { preferCut: i, preferDim: dim });
}

/** Editor-only. Local cut planes (same places as the split handles). */
function cutPlaneLocals(shape, cuts, uSize, vSize) {
  const planes = [];
  if (shape === "L") {
    const c = cuts[0];
    if (!c) return planes;
    planes.push({ key: "cut0u", axis: "u", t: uSize - (c.su | 0) });
    planes.push({ key: "cut0v", axis: "v", t: vSize - (c.sv | 0) });
  } else if (shape === "T") {
    const a = cuts[0];
    const b = cuts[1];
    if (a) {
      planes.push({ key: "cut0u", axis: "u", t: a.su | 0 });
      planes.push({ key: "cut0v", axis: "v", t: a.sv | 0 });
    }
    if (b) {
      planes.push({ key: "cut1u", axis: "u", t: uSize - (b.su | 0) });
      planes.push({ key: "cut1v", axis: "v", t: b.sv | 0 });
    }
  } else if (shape === "S") {
    const a = cuts[0];
    const b = cuts[1];
    if (a) {
      planes.push({ key: "cut0u", axis: "u", t: uSize - (a.su | 0) });
      planes.push({ key: "cut0v", axis: "v", t: vSize - (a.sv | 0) });
    }
    if (b) {
      planes.push({ key: "cut1u", axis: "u", t: b.su | 0 });
      planes.push({ key: "cut1v", axis: "v", t: b.sv | 0 });
    }
  } else if (shape === "C") {
    // cut0u = back bar inner face. armN = end face of a shorter arm (a longest arm ends on the outer face).
    const a = cuts[0];
    const b = cuts[1];
    if (a && b) {
      const maxL = Math.max(a.su | 0, b.su | 0);
      const t = uSize - maxL;
      planes.push({ key: "cut0u", axis: "u", t });
      planes.push({ key: "cut0v", axis: "v", t: a.sv | 0 });
      planes.push({ key: "cut1v", axis: "v", t: vSize - (b.sv | 0) });
      if ((a.su | 0) < maxL) planes.push({ key: "arm0", axis: "u", t: t + (a.su | 0) });
      if ((b.su | 0) < maxL) planes.push({ key: "arm1", axis: "u", t: t + (b.su | 0) });
    }
  } else if (shape === "Stair") {
    const a = cuts[0];
    const b = cuts[1];
    if (a) {
      planes.push({ key: "cut0u", axis: "u", t: uSize - (a.su | 0) });
      planes.push({ key: "cut0v", axis: "v", t: vSize - (a.sv | 0) });
    }
    if (a && b) {
      planes.push({ key: "cut1u", axis: "u", t: uSize - (b.su | 0) });
      planes.push({ key: "cut1v", axis: "v", t: vSize - (a.sv | 0) - (b.sv | 0) });
    }
  } else if (shape === "Pit") {
    const a = cuts[0];
    const b = cuts[1];
    if (a && b) {
      planes.push({ key: "cut0u", axis: "u", t: a.su | 0 });
      planes.push({ key: "cut1u", axis: "u", t: uSize - (b.su | 0) });
      planes.push({ key: "cut0v", axis: "v", t: a.sv | 0 });
      planes.push({ key: "cut1v", axis: "v", t: vSize - (b.sv | 0) });
    }
  }
  return planes;
}

function axisDeltaOf(axis, dx, dy, dz) {
  if (axis === "x") return dx | 0;
  if (axis === "y") return dy | 0;
  return dz | 0;
}

/** Move min/max of one axis. Unselected side stays. Size stays at least 1. */
function moveSpan(min, max, moveMin, moveMax, d) {
  let a = min;
  let b = max;
  if (moveMin) a += d;
  if (moveMax) b += d;
  if (b - a < 1) {
    if (moveMin && !moveMax) a = b - 1;
    else if (moveMax && !moveMin) b = a + 1;
  }
  return [a, b];
}

/**
 * Hull corners tagged with the planes they sit on.
 * Outer faces are `x0`/`x1`/`y0`/`y1`/`z0`/`z1`. L/T/S/C inner corners also get `cutNu`/`cutNv`.
 */
function roomControlPoints(room) {
  const shape = clampRoomShape(room.shape);
  const basis = roomBasis(room);
  const cuts = resolveCuts(room, shape, basis.uSize, basis.vSize);
  const planes = shape === "box" ? [] : cutPlaneLocals(shape, cuts, basis.uSize, basis.vSize);
  const x0 = room.x | 0;
  const y0 = room.y | 0;
  const z0 = room.z | 0;
  const x1 = x0 + (room.sx | 0);
  const y1 = y0 + (room.sy | 0);
  const z1 = z0 + (room.sz | 0);
  const uAxis = hatAxis(basis.u);
  const vAxis = hatAxis(basis.v);
  return roomGeometry(room).verts.map((v) => {
    const x = Math.round(v.x);
    const y = Math.round(v.y);
    const z = Math.round(v.z);
    const keys = [];
    if (x === x0) keys.push("x0");
    else if (x === x1) keys.push("x1");
    if (y === y0) keys.push("y0");
    else if (y === y1) keys.push("y1");
    if (z === z0) keys.push("z0");
    else if (z === z1) keys.push("z1");
    if (planes.length) {
      const at = { x, y, z };
      const u = Math.round(tAlongHat(room, at[uAxis], basis.u, basis.uSize));
      const vv = Math.round(tAlongHat(room, at[vAxis], basis.v, basis.vSize));
      for (const p of planes) {
        if (p.axis === "u" && u === p.t) keys.push(p.key);
        else if (p.axis === "v" && vv === p.t) keys.push(p.key);
      }
    }
    return { x, y, z, keys };
  });
}

/** True when every control-point plane is selected, so the object translates. */
function controlSelectionTranslates(points, keys) {
  const sel = keys instanceof Set ? keys : new Set(keys || []);
  const need = new Set();
  for (const p of points) for (const k of p.keys) need.add(k);
  if (!need.size) return false;
  for (const k of need) if (!sel.has(k)) return false;
  return true;
}

/**
 * Move the selected outer faces and cut planes by a world delta.
 * A cut that is not selected keeps its world position (the elbow stays put while a wall stretches).
 */
function applyRoomControlDelta(room, orig, keys, dx, dy, dz) {
  const sel = keys instanceof Set ? keys : new Set(keys || []);
  const shape = clampRoomShape(orig.shape);
  room.shape = shape;
  room.rx = orig.rx;
  room.ry = orig.ry;
  room.rz = orig.rz;
  const x0 = orig.x | 0;
  const y0 = orig.y | 0;
  const z0 = orig.z | 0;
  const [nx0, nx1] = moveSpan(x0, x0 + (orig.sx | 0), sel.has("x0"), sel.has("x1"), dx | 0);
  const [ny0, ny1] = moveSpan(y0, y0 + (orig.sy | 0), sel.has("y0"), sel.has("y1"), dy | 0);
  const [nz0, nz1] = moveSpan(z0, z0 + (orig.sz | 0), sel.has("z0"), sel.has("z1"), dz | 0);
  room.x = nx0;
  room.sx = nx1 - nx0;
  room.y = ny0;
  room.sy = ny1 - ny0;
  room.z = nz0;
  room.sz = nz1 - nz0;
  if (shape === "box") {
    room.cuts = [];
    stripLegacySplits(room);
    return clampRoomSplits(room);
  }
  const basis = roomBasis(orig);
  const cuts = resolveCuts(orig, shape, basis.uSize, basis.vSize);
  const planes = cutPlaneLocals(shape, cuts, basis.uSize, basis.vSize);
  const byKey = new Map(planes.map((p) => [p.key, p]));
  const newBasis = roomBasis(room);
  const worldOf = (plane) => {
    const hat = plane.axis === "u" ? basis.u : basis.v;
    const size = plane.axis === "u" ? basis.uSize : basis.vSize;
    const w = coordAlongHat(orig, plane.t, hat, size);
    if (!sel.has(plane.key)) return w;
    return w + axisDeltaOf(hatAxis(hat), dx, dy, dz);
  };
  const localOf = (plane, world) => {
    const hat = plane.axis === "u" ? newBasis.u : newBasis.v;
    const size = plane.axis === "u" ? newBasis.uSize : newBasis.vSize;
    return Math.round(tAlongHat(room, world, hat, size));
  };
  const tOf = (key) => {
    const plane = byKey.get(key);
    if (!plane) return 0;
    return localOf(plane, worldOf(plane));
  };
  const newCuts = [];
  if (shape === "L") {
    newCuts.push({ su: newBasis.uSize - tOf("cut0u"), sv: newBasis.vSize - tOf("cut0v") });
  } else if (shape === "T") {
    newCuts.push({ su: tOf("cut0u"), sv: tOf("cut0v") });
    newCuts.push({ su: newBasis.uSize - tOf("cut1u"), sv: tOf("cut1v") });
  } else if (shape === "S") {
    newCuts.push({ su: newBasis.uSize - tOf("cut0u"), sv: newBasis.vSize - tOf("cut0v") });
    newCuts.push({ su: tOf("cut1u"), sv: tOf("cut1v") });
  } else if (shape === "C") {
    const maxL = Math.max(cuts[0].su, cuts[1].su);
    const newU = newBasis.uSize;
    const newT = Math.max(1, Math.min(newU - 1, tOf("cut0u")));
    const len = (c, i) =>
      c.su >= maxL ? newU - newT : Math.max(1, Math.min(newU - newT, tOf(`arm${i}`) - newT));
    newCuts.push({ su: len(cuts[0], 0), sv: tOf("cut0v") });
    newCuts.push({ su: len(cuts[1], 1), sv: newBasis.vSize - tOf("cut1v") });
  } else if (shape === "Stair") {
    newCuts.push({ su: newBasis.uSize - tOf("cut0u"), sv: newBasis.vSize - tOf("cut0v") });
    newCuts.push({ su: newBasis.uSize - tOf("cut1u"), sv: tOf("cut0v") - tOf("cut1v") });
  } else if (shape === "Pit") {
    newCuts.push({ su: tOf("cut0u"), sv: tOf("cut0v") });
    newCuts.push({ su: newBasis.uSize - tOf("cut1u"), sv: newBasis.vSize - tOf("cut1v") });
    newCuts.push({ su: cuts[2] ? cuts[2].su : 1, sv: 0 });
  }
  room.cuts = newCuts;
  stripLegacySplits(room);
  return clampRoomSplits(room);
}

/** Face-key delta for an AABB (crates, ramps, platforms, triggers). */
function applyAabbControlDelta(obj, orig, keys, dx, dy, dz) {
  const sel = keys instanceof Set ? keys : new Set(keys || []);
  const x0 = orig.x | 0;
  const y0 = orig.y | 0;
  const z0 = orig.z | 0;
  const [nx0, nx1] = moveSpan(x0, x0 + (orig.sx | 0), sel.has("x0"), sel.has("x1"), dx | 0);
  const [ny0, ny1] = moveSpan(y0, y0 + (orig.sy | 0), sel.has("y0"), sel.has("y1"), dy | 0);
  const [nz0, nz1] = moveSpan(z0, z0 + (orig.sz | 0), sel.has("z0"), sel.has("z1"), dz | 0);
  obj.x = nx0;
  obj.sx = nx1 - nx0;
  obj.y = ny0;
  obj.sy = ny1 - ny0;
  obj.z = nz0;
  obj.sz = nz1 - nz0;
  return obj;
}

function keepUv(box) {
  return box.su > 0 && box.sv > 0 && (box.sw === undefined || box.sw > 0);
}

function localFootprint(room, basis) {
  const shape = clampRoomShape(room.shape);
  const uSize = basis.uSize;
  const vSize = basis.vSize;
  const cuts = resolveCuts(room, shape, uSize, vSize);

  if (shape === "box") {
    return [{ u: 0, v: 0, su: uSize, sv: vSize }];
  }
  if (shape === "L") {
    const c = cuts[0] || { su: 1, sv: 1 };
    return [
      { u: 0, v: 0, su: uSize, sv: vSize - c.sv },
      { u: 0, v: vSize - c.sv, su: uSize - c.su, sv: c.sv },
    ].filter(keepUv);
  }
  if (shape === "T") {
    const a = cuts[0] || { su: 1, sv: 1 };
    const b = cuts[1] || { su: 1, sv: 1 };
    const stemU = a.su;
    const stemW = uSize - a.su - b.su;
    if (a.sv === b.sv) {
      return [
        { u: 0, v: a.sv, su: uSize, sv: vSize - a.sv },
        { u: stemU, v: 0, su: stemW, sv: a.sv },
      ].filter(keepUv);
    }
    return [
      { u: stemU, v: 0, su: stemW, sv: vSize },
      { u: 0, v: a.sv, su: a.su, sv: vSize - a.sv },
      { u: uSize - b.su, v: b.sv, su: b.su, sv: vSize - b.sv },
    ].filter(keepUv);
  }
  if (shape === "S") {
    const a = cuts[0] || { su: 1, sv: 1 };
    const b = cuts[1] || { su: 1, sv: 1 };
    const topV0 = vSize - a.sv;
    if (b.sv === topV0) {
      return [
        { u: 0, v: b.sv, su: uSize - a.su, sv: a.sv },
        { u: b.su, v: 0, su: uSize - b.su, sv: b.sv },
      ].filter(keepUv);
    }
    if (b.sv < topV0) {
      return [
        { u: 0, v: topV0, su: uSize - a.su, sv: a.sv },
        { u: 0, v: b.sv, su: uSize, sv: topV0 - b.sv },
        { u: b.su, v: 0, su: uSize - b.su, sv: b.sv },
      ].filter(keepUv);
    }
    return [
      { u: 0, v: b.sv, su: uSize - a.su, sv: vSize - b.sv },
      { u: b.su, v: topV0, su: uSize - a.su - b.su, sv: b.sv - topV0 },
      { u: b.su, v: 0, su: uSize - b.su, sv: topV0 },
    ].filter(keepUv);
  }
  if (shape === "C") {
    const a = cuts[0] || { su: 1, sv: 1 };
    const b = cuts[1] || { su: 1, sv: 1 };
    const t = uSize - Math.max(a.su, b.su);
    return [
      { u: 0, v: 0, su: t, sv: vSize },
      { u: t, v: 0, su: a.su, sv: a.sv },
      { u: t, v: vSize - b.sv, su: b.su, sv: b.sv },
    ].filter(keepUv);
  }
  if (shape === "Stair") {
    const a = cuts[0] || { su: 2, sv: 1 };
    const b = cuts[1] || { su: 1, sv: 1 };
    const h0 = vSize - a.sv - b.sv;
    return [
      { u: 0, v: 0, su: uSize, sv: h0 },
      { u: 0, v: h0, su: uSize - b.su, sv: b.sv },
      { u: 0, v: h0 + b.sv, su: uSize - a.su, sv: a.sv },
    ].filter(keepUv);
  }
  if (shape === "Pit") {
    // Stacked layout: lid over the whole footprint at the rim height, pit slab below it.
    const a = cuts[0] || { su: 0, sv: 0 };
    const b = cuts[1] || { su: 0, sv: 0 };
    const d = Math.max(1, Math.min(basis.wSize - 1, (cuts[2] || { su: 1 }).su));
    return [
      { u: 0, v: 0, su: uSize, sv: vSize, w0: d, sw: basis.wSize - d },
      { u: a.su, v: a.sv, su: uSize - a.su - b.su, sv: vSize - a.sv - b.sv, w0: 0, sw: d },
    ].filter(keepUv);
  }
  return [{ u: 0, v: 0, su: uSize, sv: vSize }];
}

function localCutouts(room, basis) {
  const shape = clampRoomShape(room.shape);
  return cutoutUvBoxes(shape, resolveCuts(room, shape, basis.uSize, basis.vSize), basis.uSize, basis.vSize);
}

function aabbFaces(box) {
  const x0 = box.x;
  const y0 = box.y;
  const z0 = box.z;
  const x1 = box.x + box.sx;
  const y1 = box.y + box.sy;
  const z1 = box.z + box.sz;
  return [
    { axis: "x", sign: -1, plane: x0, a0: y0, a1: y1, b0: z0, b1: z1, faceId: "-x" },
    { axis: "x", sign: 1, plane: x1, a0: y0, a1: y1, b0: z0, b1: z1, faceId: "+x" },
    { axis: "y", sign: -1, plane: y0, a0: x0, a1: x1, b0: z0, b1: z1, faceId: "-y" },
    { axis: "y", sign: 1, plane: y1, a0: x0, a1: x1, b0: z0, b1: z1, faceId: "+y" },
    { axis: "z", sign: -1, plane: z0, a0: x0, a1: x1, b0: y0, b1: y1, faceId: "-z" },
    { axis: "z", sign: 1, plane: z1, a0: x0, a1: x1, b0: y0, b1: y1, faceId: "+z" },
  ];
}

function planeTouches(box, axis, plane) {
  const o0 = box[axis];
  const o1 = box[axis] + box["s" + axis];
  return o0 <= plane && o1 >= plane;
}

function otherOnFace(other, face) {
  if (!planeTouches(other, face.axis, face.plane)) return null;
  let a0;
  let a1;
  let b0;
  let b1;
  if (face.axis === "x") {
    a0 = other.y;
    a1 = other.y + other.sy;
    b0 = other.z;
    b1 = other.z + other.sz;
  } else if (face.axis === "y") {
    a0 = other.x;
    a1 = other.x + other.sx;
    b0 = other.z;
    b1 = other.z + other.sz;
  } else {
    a0 = other.x;
    a1 = other.x + other.sx;
    b0 = other.y;
    b1 = other.y + other.sy;
  }
  return { a0, a1, b0, b1 };
}

function subtractRect(r, c) {
  const ia0 = Math.max(r.a0, c.a0);
  const ia1 = Math.min(r.a1, c.a1);
  const ib0 = Math.max(r.b0, c.b0);
  const ib1 = Math.min(r.b1, c.b1);
  if (ia0 >= ia1 || ib0 >= ib1) return [r];
  const out = [];
  if (r.a0 < ia0) out.push({ a0: r.a0, a1: ia0, b0: r.b0, b1: r.b1 });
  if (ia1 < r.a1) out.push({ a0: ia1, a1: r.a1, b0: r.b0, b1: r.b1 });
  if (r.b0 < ib0) out.push({ a0: ia0, a1: ia1, b0: r.b0, b1: ib0 });
  if (ib1 < r.b1) out.push({ a0: ia0, a1: ia1, b0: ib1, b1: r.b1 });
  return out.filter((q) => q.a1 > q.a0 && q.b1 > q.b0);
}

function composePoint(face, a, b) {
  if (face.axis === "x") return { x: face.plane, y: a, z: b };
  if (face.axis === "y") return { x: a, y: face.plane, z: b };
  return { x: a, y: b, z: face.plane };
}

function weldKey(p) {
  return `${p.x},${p.y},${p.z}`;
}

function vertOnOpenSeg(a, b, p) {
  if (a.x === b.x && a.y === b.y && a.z !== b.z && p.x === a.x && p.y === a.y) {
    return p.z > Math.min(a.z, b.z) && p.z < Math.max(a.z, b.z);
  }
  if (a.x === b.x && a.z === b.z && a.y !== b.y && p.x === a.x && p.z === a.z) {
    return p.y > Math.min(a.y, b.y) && p.y < Math.max(a.y, b.y);
  }
  if (a.y === b.y && a.z === b.z && a.x !== b.x && p.y === a.y && p.z === a.z) {
    return p.x > Math.min(a.x, b.x) && p.x < Math.max(a.x, b.x);
  }
  return false;
}

function faceContainsPoint(f, p) {
  if (f.axis === "x") {
    if (p.x !== f.plane) return false;
    return p.y >= f.a0 && p.y <= f.a1 && p.z >= f.b0 && p.z <= f.b1;
  }
  if (f.axis === "y") {
    if (p.y !== f.plane) return false;
    return p.x >= f.a0 && p.x <= f.a1 && p.z >= f.b0 && p.z <= f.b1;
  }
  if (p.z !== f.plane) return false;
  return p.x >= f.a0 && p.x <= f.a1 && p.y >= f.b0 && p.y <= f.b1;
}

function inPlanePerp(axis, va, vb) {
  if (axis === "y") return va.x !== vb.x ? "z" : "x";
  if (axis === "x") return va.y !== vb.y ? "z" : "y";
  return va.x !== vb.x ? "y" : "x";
}

function buriedOnPlane(va, vb, faces) {
  if (!faces.length) return false;
  const axis = faces[0].axis;
  const mid = {
    x: (va.x + vb.x) / 2,
    y: (va.y + vb.y) / 2,
    z: (va.z + vb.z) / 2,
  };
  const perp = inPlanePerp(axis, va, vb);
  const inside = (p) => faces.some((f) => faceContainsPoint(f, p));
  const a = { ...mid, [perp]: mid[perp] - 0.5 };
  const b = { ...mid, [perp]: mid[perp] + 0.5 };
  return inside(a) && inside(b);
}

/** True if b sits on the axis-aligned segment a–c (not a corner). */
function axisCollinear(a, b, c) {
  const sameX = a.x === b.x && b.x === c.x;
  const sameY = a.y === b.y && b.y === c.y;
  const sameZ = a.z === b.z && b.z === c.z;
  return (sameX ? 1 : 0) + (sameY ? 1 : 0) + (sameZ ? 1 : 0) === 2;
}

/** Drop AABB-union T-junctions that lie mid-edge (silhouette unchanged). */
function dissolveCollinear(verts, edges) {
  let changed = true;
  while (changed) {
    changed = false;
    const adj = verts.map(() => []);
    for (let i = 0; i < edges.length; i++) {
      const e = edges[i];
      adj[e.a].push({ i, o: e.b });
      adj[e.b].push({ i, o: e.a });
    }
    for (let v = 0; v < verts.length; v++) {
      if (adj[v].length !== 2) continue;
      const ia = adj[v][0];
      const ib = adj[v][1];
      if (ia.o === ib.o) continue;
      if (!axisCollinear(verts[ia.o], verts[v], verts[ib.o])) continue;
      const drop = new Set([ia.i, ib.i]);
      const next = edges.filter((_, i) => !drop.has(i));
      next.push({ a: ia.o, b: ib.o });
      edges.length = 0;
      edges.push(...next);
      changed = true;
      break;
    }
  }
}

function unionHull(colliders) {
  const hullFaces = [];
  for (let i = 0; i < colliders.length; i++) {
    const box = colliders[i];
    for (const face of aabbFaces(box)) {
      let pieces = [{ a0: face.a0, a1: face.a1, b0: face.b0, b1: face.b1 }];
      for (let j = 0; j < colliders.length; j++) {
        if (i === j) continue;
        const clip = otherOnFace(colliders[j], face);
        if (!clip) continue;
        pieces = pieces.flatMap((p) => subtractRect(p, clip));
      }
      for (const p of pieces) {
        hullFaces.push({
          axis: face.axis,
          sign: face.sign,
          plane: face.plane,
          faceId: face.faceId,
          a0: p.a0,
          a1: p.a1,
          b0: p.b0,
          b1: p.b1,
          corners: [
            composePoint(face, p.a0, p.b0),
            composePoint(face, p.a1, p.b0),
            composePoint(face, p.a1, p.b1),
            composePoint(face, p.a0, p.b1),
          ],
        });
      }
    }
  }

  const vertMap = new Map();
  const verts = [];
  const addVert = (p) => {
    const k = weldKey(p);
    if (vertMap.has(k)) return vertMap.get(k);
    const i = verts.length;
    verts.push({ x: p.x, y: p.y, z: p.z });
    vertMap.set(k, i);
    return i;
  };

  const raw = [];
  for (const f of hullFaces) {
    const ids = f.corners.map(addVert);
    raw.push([ids[0], ids[1]], [ids[1], ids[2]], [ids[2], ids[3]], [ids[3], ids[0]]);
    f.center = {
      x: (f.corners[0].x + f.corners[2].x) / 2,
      y: (f.corners[0].y + f.corners[2].y) / 2,
      z: (f.corners[0].z + f.corners[2].z) / 2,
    };
  }

  const atomic = new Map();
  const addAtomic = (ia, ib) => {
    if (ia === ib) return;
    const a = Math.min(ia, ib);
    const b = Math.max(ia, ib);
    atomic.set(`${a}-${b}`, [a, b]);
  };
  for (const [ia, ib] of raw) {
    const va = verts[ia];
    const vb = verts[ib];
    const hits = [];
    for (let i = 0; i < verts.length; i++) {
      if (i === ia || i === ib) continue;
      if (vertOnOpenSeg(va, vb, verts[i])) hits.push(i);
    }
    hits.sort((i, j) => {
      const da = (verts[i].x - va.x) ** 2 + (verts[i].y - va.y) ** 2 + (verts[i].z - va.z) ** 2;
      const db = (verts[j].x - va.x) ** 2 + (verts[j].y - va.y) ** 2 + (verts[j].z - va.z) ** 2;
      return da - db;
    });
    const chain = [ia, ...hits, ib];
    for (let k = 0; k < chain.length - 1; k++) addAtomic(chain[k], chain[k + 1]);
  }

  const byPlane = new Map();
  for (const f of hullFaces) {
    const k = `${f.axis}:${f.plane}`;
    if (!byPlane.has(k)) byPlane.set(k, []);
    byPlane.get(k).push(f);
  }

  const kept = [];
  for (const [ia, ib] of atomic.values()) {
    const va = verts[ia];
    const vb = verts[ib];
    const mid = {
      x: (va.x + vb.x) / 2,
      y: (va.y + vb.y) / 2,
      z: (va.z + vb.z) / 2,
    };
    const covering = hullFaces.filter((f) => faceContainsPoint(f, mid));
    let buried = false;
    const seen = new Set();
    for (const f of covering) {
      const k = `${f.axis}:${f.plane}`;
      if (seen.has(k)) continue;
      seen.add(k);
      if (buriedOnPlane(va, vb, byPlane.get(k) || [])) {
        buried = true;
        break;
      }
    }
    if (buried) continue;
    kept.push({ a: ia, b: ib });
  }
  dissolveCollinear(verts, kept);
  const used = new Set();
  for (const e of kept) {
    used.add(e.a);
    used.add(e.b);
  }
  const remap = new Map();
  const compact = [];
  for (let i = 0; i < verts.length; i++) {
    if (!used.has(i)) continue;
    remap.set(i, compact.length);
    compact.push(verts[i]);
  }
  for (const e of kept) {
    e.a = remap.get(e.a);
    e.b = remap.get(e.b);
  }
  return { hullFaces, verts: compact, edges: kept };
}

function innerHandles(room, basis) {
  const shape = clampRoomShape(room.shape);
  if (shape === "box") return [];
  const uSize = basis.uSize;
  const vSize = basis.vSize;
  const w2 = basis.wSize / 2;
  const cuts = resolveCuts(room, shape, uSize, vSize);
  const handles = [];
  const push = (u, w, v, key, alongHat, scale) => {
    const world = localToWorld(room, u, w, v, basis);
    handles.push({
      kind: "split",
      key,
      world,
      axis: hatAxis(alongHat),
      scale: scale * hatSign(alongHat),
    });
  };

  const addCut = (i, u0, v0, growU, growV) => {
    const c = cuts[i];
    if (!c) return;
    const uFace = growU > 0 ? u0 + c.su : u0;
    const vFace = growV > 0 ? v0 + c.sv : v0;
    const uMid = u0 + c.su / 2;
    const vMid = v0 + c.sv / 2;
    push(uFace, w2, vMid, `cut${i}u`, basis.u, growU);
    push(uMid, w2, vFace, `cut${i}v`, basis.v, growV);
  };

  if (shape === "L") {
    const c = cuts[0];
    if (c) addCut(0, uSize - c.su, vSize - c.sv, -1, -1);
  } else if (shape === "T") {
    const a = cuts[0];
    const b = cuts[1];
    if (a) addCut(0, 0, 0, 1, 1);
    if (b) addCut(1, uSize - b.su, 0, -1, 1);
  } else if (shape === "S") {
    const a = cuts[0];
    const b = cuts[1];
    if (a) addCut(0, uSize - a.su, vSize - a.sv, -1, -1);
    if (b) addCut(1, 0, 0, 1, 1);
  } else if (shape === "C") {
    const a = cuts[0];
    const b = cuts[1];
    if (a && b) {
      const t = uSize - Math.max(a.su, b.su);
      push(t, w2, (a.sv + vSize - b.sv) / 2, "cut0u", basis.u, -1);
      push(t + a.su / 2, w2, a.sv, "cut0v", basis.v, 1);
      push(t + b.su / 2, w2, vSize - b.sv, "cut1v", basis.v, -1);
      push(t + a.su, w2, a.sv / 2, "arm0", basis.u, 1);
      push(t + b.su, w2, vSize - b.sv / 2, "arm1", basis.u, 1);
    }
  } else if (shape === "Stair") {
    const a = cuts[0];
    const b = cuts[1];
    if (a) addCut(0, uSize - a.su, vSize - a.sv, -1, -1);
    if (a && b) addCut(1, uSize - b.su, vSize - a.sv - b.sv, -1, -1);
  } else if (shape === "Pit") {
    const a = cuts[0];
    const b = cuts[1];
    const dd = cuts[2];
    if (a && b && dd) {
      const wm = dd.su / 2;
      const pu0 = a.su;
      const pu1 = uSize - b.su;
      const pv0 = a.sv;
      const pv1 = vSize - b.sv;
      const uMid = (pu0 + pu1) / 2;
      const vMid = (pv0 + pv1) / 2;
      push(pu0, wm, vMid, "cut0u", basis.u, 1);
      push(pu1, wm, vMid, "cut1u", basis.u, -1);
      push(uMid, wm, pv0, "cut0v", basis.v, 1);
      push(uMid, wm, pv1, "cut1v", basis.v, -1);
      push(uMid, dd.su, vMid, "cut2u", basis.w, 1);
    }
  }
  return handles;
}

/** Six AABB face-center handles (not one per hull fragment). */
function aabbWallHandles(room) {
  const x0 = room.x | 0;
  const y0 = room.y | 0;
  const z0 = room.z | 0;
  const sx = room.sx | 0;
  const sy = room.sy | 0;
  const sz = room.sz | 0;
  const cx = x0 + sx / 2;
  const cy = y0 + sy / 2;
  const cz = z0 + sz / 2;
  return [
    { kind: "face", side: "x0", axis: "x", world: { x: x0, y: cy, z: cz } },
    { kind: "face", side: "x1", axis: "x", world: { x: x0 + sx, y: cy, z: cz } },
    { kind: "face", side: "y0", axis: "y", world: { x: cx, y: y0, z: cz } },
    { kind: "face", side: "y1", axis: "y", world: { x: cx, y: y0 + sy, z: cz } },
    { kind: "face", side: "z0", axis: "z", world: { x: cx, y: cy, z: z0 } },
    { kind: "face", side: "z1", axis: "z", world: { x: cx, y: cy, z: z0 + sz } },
  ];
}

function roomGeometry(room) {
  const outer = {
    x: room.x | 0,
    y: room.y | 0,
    z: room.z | 0,
    sx: room.sx | 0,
    sy: room.sy | 0,
    sz: room.sz | 0,
  };
  const shape = clampRoomShape(room.shape);
  if (shape === "box") {
    const verts = [
      { x: outer.x, y: outer.y, z: outer.z },
      { x: outer.x + outer.sx, y: outer.y, z: outer.z },
      { x: outer.x + outer.sx, y: outer.y + outer.sy, z: outer.z },
      { x: outer.x, y: outer.y + outer.sy, z: outer.z },
      { x: outer.x, y: outer.y, z: outer.z + outer.sz },
      { x: outer.x + outer.sx, y: outer.y, z: outer.z + outer.sz },
      { x: outer.x + outer.sx, y: outer.y + outer.sy, z: outer.z + outer.sz },
      { x: outer.x, y: outer.y + outer.sy, z: outer.z + outer.sz },
    ];
    const edges = [
      [0, 1],
      [1, 2],
      [2, 3],
      [3, 0],
      [4, 5],
      [5, 6],
      [6, 7],
      [7, 4],
      [0, 4],
      [1, 5],
      [2, 6],
      [3, 7],
    ].map(([a, b]) => ({ a, b }));
    const hullFaces = aabbFaces(outer).map((f) => ({
      ...f,
      corners: [
        composePoint(f, f.a0, f.b0),
        composePoint(f, f.a1, f.b0),
        composePoint(f, f.a1, f.b1),
        composePoint(f, f.a0, f.b1),
      ],
      center: composePoint(f, (f.a0 + f.a1) / 2, (f.b0 + f.b1) / 2),
    }));
    return {
      outer,
      shape: "box",
      colliders: [{ ...outer }],
      cutouts: [],
      verts,
      edges,
      hullFaces,
      handles: aabbWallHandles(room),
    };
  }

  const basis = roomBasis(room);
  const fp = localFootprint(room, basis);
  const colliders = fp.map((box) => uvwBoxToWorld(room, box, basis));
  const cutouts = localCutouts(room, basis).map((box) => uvwBoxToWorld(room, box, basis));
  const { hullFaces, verts, edges } = unionHull(colliders);
  return {
    outer,
    shape,
    colliders,
    cutouts,
    verts,
    edges,
    hullFaces,
    handles: [...aabbWallHandles(room), ...innerHandles(room, basis)],
  };
}

function pointInRoom(p, room) {
  return roomGeometry(room).colliders.some(
    (c) =>
      p.x >= c.x &&
      p.x <= c.x + c.sx &&
      p.y >= c.y &&
      p.y <= c.y + c.sy &&
      p.z >= c.z &&
      p.z <= c.z + c.sz
  );
}

function aabbOverlapsRoom(obj, room) {
  return roomGeometry(room).colliders.some(
    (c) =>
      obj.x <= c.x + c.sx &&
      obj.x + obj.sx >= c.x &&
      obj.y <= c.y + c.sy &&
      obj.y + obj.sy >= c.y &&
      obj.z <= c.z + c.sz &&
      obj.z + obj.sz >= c.z
  );
}

function roomFloorY(room, x, z) {
  const geom = roomGeometry(room);
  let y = room.y | 0;
  let hit = false;
  for (const c of geom.colliders) {
    if (x >= c.x && x <= c.x + c.sx && z >= c.z && z <= c.z + c.sz) {
      // Lowest containing floor, same as the engine's uf_rc_floor.
      if (!hit || c.y < y) y = c.y;
      hit = true;
    }
  }
  return y;
}

const HULL_HIT_EPS = 1e-4;

function rayAxisPlane(origin, dir, axis, plane) {
  const d = dir[axis];
  if (Math.abs(d) < 1e-8) return null;
  const t = (plane - origin[axis]) / d;
  if (t < 0) return null;
  return {
    t,
    point: {
      x: origin.x + dir.x * t,
      y: origin.y + dir.y * t,
      z: origin.z + dir.z * t,
    },
  };
}

function hullFaceUV(face, p) {
  if (face.axis === "x") return { a: p.y, b: p.z };
  if (face.axis === "y") return { a: p.x, b: p.z };
  return { a: p.x, b: p.y };
}

/** Ray vs one hull rectangle. Bounds use a small epsilon; plane equality is not required. */
function rayHullFace(origin, dir, face, eps = HULL_HIT_EPS) {
  if (!face || face.a1 <= face.a0 || face.b1 <= face.b0) return null;
  const hit = rayAxisPlane(origin, dir, face.axis, face.plane);
  if (!hit) return null;
  const { a, b } = hullFaceUV(face, hit.point);
  if (a < face.a0 - eps || a > face.a1 + eps || b < face.b0 - eps || b > face.b1 + eps) return null;
  return { t: hit.t, point: hit.point, face };
}

/** Nearest hull-face hit on a room. `pred(face)` optional. */
function rayRoomHull(room, origin, dir, pred) {
  const faces = roomGeometry(room).hullFaces || [];
  let best = null;
  for (const f of faces) {
    if (pred && !pred(f)) continue;
    const hit = rayHullFace(origin, dir, f);
    if (!hit) continue;
    if (!best || hit.t < best.t) best = hit;
  }
  return best;
}

/** Highest -Y hull fragment covering (x, z), or null if outside the footprint. */
function xzOnRoomFloor(room, x, z) {
  const faces = roomGeometry(room).hullFaces || [];
  let best = null;
  for (const f of faces) {
    if (f.axis !== "y" || f.sign !== -1) continue;
    if (x < f.a0 - HULL_HIT_EPS || x > f.a1 + HULL_HIT_EPS || z < f.b0 - HULL_HIT_EPS || z > f.b1 + HULL_HIT_EPS) {
      continue;
    }
    if (!best || f.plane > best.plane) best = f;
  }
  return best;
}

const DOOR_FACE_IDS = ["+x", "-x", "+z", "-z"];

function faceYRange(f) {
  if (f.axis === "x") return [f.a0, f.a1];
  return [f.b0, f.b1];
}

function hullFaceScore(obj, f) {
  const cx = obj.x + obj.sx / 2;
  const cy = obj.y + obj.sy / 2;
  const cz = obj.z + obj.sz / 2;
  const planeDist = f.axis === "x" ? Math.abs(cx - f.plane) : Math.abs(cz - f.plane);
  const [fy0, fy1] = faceYRange(f);
  const yOverlap = obj.y + obj.sy > fy0 && obj.y < fy1;
  let lat;
  let lat0;
  let lat1;
  if (f.axis === "x") {
    lat = cz;
    lat0 = f.b0;
    lat1 = f.b1;
  } else {
    lat = cx;
    lat0 = f.a0;
    lat1 = f.a1;
  }
  const latOverlap = lat >= lat0 - 1 && lat <= lat1 + 1;
  let score = planeDist;
  if (!yOverlap) {
    score += 1000 + Math.min(Math.abs(cy - fy0), Math.abs(cy - fy1));
  }
  if (!latOverlap) {
    score += 50 + Math.min(Math.abs(lat - lat0), Math.abs(lat - lat1));
  }
  return score;
}

function bestDoorHullFace(obj, room) {
  const geom = roomGeometry(room);
  const faces = geom.hullFaces || [];
  let best = null;
  for (const f of faces) {
    if (f.axis === "y") continue;
    if (!DOOR_FACE_IDS.includes(f.faceId)) continue;
    const score = hullFaceScore(obj, f);
    if (!best || score < best.score) best = { f, score };
  }
  return best?.f || null;
}

/** Best hull face per room, nearest first. Lateral miss is +50; wrong Y is +1000. */
function doorRoomScores(door, rooms) {
  if (!door || !rooms?.length) return [];
  const scored = [];
  for (const room of rooms) {
    const f = bestDoorHullFace(door, room);
    if (!f) continue;
    scored.push({ room, f, score: hullFaceScore(door, f) });
  }
  scored.sort((a, b) => a.score - b.score);
  return scored;
}

/** Thin axis of a door box: from `face` (±x / ±z), else the shorter horizontal side. */
function doorThinAxis(door) {
  const face = String(door?.face || "");
  if (face.endsWith("x")) return "x";
  if (face.endsWith("z")) return "z";
  return (door.sx | 0) <= (door.sz | 0) ? "x" : "z";
}

function overlapLen(a0, a1, b0, b1) {
  return Math.min(a1, b1) - Math.max(a0, b0);
}

/**
 * Rooms whose hull actually touches the door, per side of its thin axis.
 * low:  room's max face (sign +1) lies exactly on the door's low plane.
 * high: room's min face (sign -1) lies exactly on the door's high plane.
 * The face must overlap the door with positive area. No proximity slack.
 * Each list is [{ room, area }], largest contact first.
 */
function doorTouchingRooms(door, rooms) {
  const out = { low: [], high: [] };
  if (!door || !rooms?.length) return out;
  const axis = doorThinAxis(door);
  const latAxis = axis === "x" ? "z" : "x";
  const lat0 = boxLo(door, latAxis);
  const lat1 = boxHi(door, latAxis);
  const y0 = boxLo(door, "y");
  const y1 = boxHi(door, "y");
  const lowPlane = boxLo(door, axis);
  const highPlane = boxHi(door, axis);
  for (const room of rooms) {
    let lowArea = 0;
    let highArea = 0;
    for (const f of roomGeometry(room).hullFaces || []) {
      if (f.axis !== axis) continue;
      const fl0 = axis === "x" ? f.b0 : f.a0;
      const fl1 = axis === "x" ? f.b1 : f.a1;
      const fy0 = axis === "x" ? f.a0 : f.b0;
      const fy1 = axis === "x" ? f.a1 : f.b1;
      const lat = overlapLen(lat0, lat1, fl0, fl1);
      const vert = overlapLen(y0, y1, fy0, fy1);
      if (lat <= 0 || vert <= 0) continue;
      if (f.sign > 0 && f.plane === lowPlane) lowArea += lat * vert;
      if (f.sign < 0 && f.plane === highPlane) highArea += lat * vert;
    }
    if (lowArea > 0) out.low.push({ room, area: lowArea });
    if (highArea > 0) out.high.push({ room, area: highArea });
  }
  out.low.sort((a, b) => b.area - a.area);
  out.high.sort((a, b) => b.area - a.area);
  return out;
}

/** Face of the door AABB closer to the given room (in-game stroke plane). */
function doorNearFaceId(door, room) {
  if (!door) return "+z";
  if (!room) return door.face || "+z";
  const geom = roomGeometry(room);
  const cols = (geom.colliders || []).filter((c) => (c.sx | 0) > 0);
  const zThin = (door.sz | 0) <= (door.sx | 0);
  let best = cols[0] || room;
  for (const c of cols) {
    if (zThin) {
      if (door.x < c.x + c.sx && door.x + door.sx > c.x) {
        best = c;
        break;
      }
    } else if (door.z < c.z + c.sz && door.z + door.sz > c.z) {
      best = c;
      break;
    }
  }
  const cx = best.x + best.sx / 2;
  const cz = best.z + best.sz / 2;
  if (zThin) {
    const d0 = Math.abs(cz - door.z);
    const d1 = Math.abs(cz - (door.z + door.sz));
    return d0 <= d1 ? "-z" : "+z";
  }
  const d0 = Math.abs(cx - door.x);
  const d1 = Math.abs(cx - (door.x + door.sx));
  return d0 <= d1 ? "-x" : "+x";
}

/** If the door sits inside-flush on a hull face, shift the box outside (thickness out). */
function nudgeDoorOutside(door, room) {
  if (!door || !room) return door;
  const f = bestDoorHullFace(door, room);
  if (!f) return door;
  if (f.axis === "x") {
    const thick = door.sx | 0;
    if (f.sign > 0) {
      if (door.x === f.plane - thick) door.x = f.plane;
    } else if (door.x === f.plane) {
      door.x = Math.max(0, f.plane - thick);
    }
  } else {
    const thick = door.sz | 0;
    if (f.sign > 0) {
      if (door.z === f.plane - thick) door.z = f.plane;
    } else if (door.z === f.plane) {
      door.z = Math.max(0, f.plane - thick);
    }
  }
  return door;
}

const DOOR_SIZE = [4, 5, 1];
const SWITCH_SIZE = [2, 3, 1];

/** Keep in sync with doorSizeForScale in model.js. */
function doorSnapSize(door) {
  const s = Number(door?.doorScale);
  if (s === 2) return [8, 10, 1];
  if (s === 1.5) return [6, 8, 1];
  return DOOR_SIZE;
}

function wallDims(size, face) {
  const [a, b, thick] = size;
  if (face.axis === "x") return { sx: thick, sy: b, sz: a };
  return { sx: a, sy: b, sz: thick };
}

/** Flush AABB onto hull face. `inside` puts the box in the room (switch); doors sit outside.
 * Keep Y (and off-face lateral) so a door at the bottom of a shaft does not jump to another fragment.
 * `placeHitY` (placement) centers Y on the ray hit and clamps into the fragment. */
function snapBoxToHullFace(obj, f, size, inside, placeHitY) {
  const cx = obj.x + obj.sx / 2;
  const cz = obj.z + obj.sz / 2;
  const dims = wallDims(size, f);
  obj.face = f.faceId;
  obj.sx = dims.sx;
  obj.sy = dims.sy;
  obj.sz = dims.sz;
  const along = (sign, plane, thick) => {
    if (inside) return sign > 0 ? plane - thick : plane;
    return sign > 0 ? plane : plane - thick;
  };
  if (placeHitY != null && Number.isFinite(placeHitY)) {
    const [fy0, fy1] = faceYRange(f);
    obj.y = Math.round(placeHitY - obj.sy / 2);
    const maxY = fy1 - obj.sy;
    obj.y = maxY >= fy0 ? Math.max(fy0, Math.min(maxY, obj.y)) : fy0;
  } else {
    obj.y = obj.y | 0;
  }
  if (f.axis === "x") {
    obj.x = along(f.sign, f.plane, obj.sx);
    obj.z = Math.round(cz - obj.sz / 2);
    if (cz >= f.b0 - 2 && cz <= f.b1 + 2) {
      obj.z = Math.max(f.b0, Math.min(f.b1 - obj.sz, obj.z));
    }
  } else {
    obj.z = along(f.sign, f.plane, obj.sz);
    obj.x = Math.round(cx - obj.sx / 2);
    if (cx >= f.a0 - 2 && cx <= f.a1 + 2) {
      obj.x = Math.max(f.a0, Math.min(f.a1 - obj.sx, obj.x));
    }
  }
  if (obj.x < 0) obj.x = 0;
  if (obj.y < 0) obj.y = 0;
  if (obj.z < 0) obj.z = 0;
  return obj;
}

function snapToHullFace(obj, face, size, inside, placeHitY) {
  if (!obj || !face) return obj;
  return snapBoxToHullFace(obj, face, size, inside, placeHitY);
}

function snapDoorToFace(door, face, placeHitY) {
  if (!door || !face) return door;
  return snapBoxToHullFace(door, face, doorSnapSize(door), false, placeHitY);
}

function snapSwitchToFace(sw, face, placeHitY) {
  if (!sw || !face) return sw;
  return snapBoxToHullFace(sw, face, SWITCH_SIZE, true, placeHitY);
}

function snapDoorToRoom(door, room) {
  const f = bestDoorHullFace(door, room);
  if (!f) return door;
  return snapBoxToHullFace(door, f, doorSnapSize(door), false);
}

function snapDoorBetweenRooms(door, roomA, roomB) {
  if (!door) return door;
  let best = null;
  for (const room of [roomA, roomB]) {
    if (!room) continue;
    const f = bestDoorHullFace(door, room);
    if (!f) continue;
    const score = hullFaceScore(door, f);
    if (!best || score < best.score) best = { f, score };
  }
  if (!best) return door;
  return snapBoxToHullFace(door, best.f, doorSnapSize(door), false);
}

/** Set door face/size from nearest hull wall; keep world position (no flush snap). */
function orientDoorToRooms(door, roomA, roomB) {
  if (!door) return door;
  let best = null;
  for (const room of [roomA, roomB]) {
    if (!room) continue;
    const f = bestDoorHullFace(door, room);
    if (!f) continue;
    const score = hullFaceScore(door, f);
    if (!best || score < best.score) best = { f, score };
  }
  if (!best) return door;
  const cx = door.x + door.sx / 2;
  const floorY = door.y | 0;
  const cz = door.z + door.sz / 2;
  door.face = best.f.faceId;
  const dims = wallDims(doorSnapSize(door), best.f);
  door.sx = dims.sx;
  door.sy = dims.sy;
  door.sz = dims.sz;
  door.x = Math.round(cx - door.sx / 2);
  door.y = floorY;
  door.z = Math.round(cz - door.sz / 2);
  if (door.x < 0) door.x = 0;
  if (door.y < 0) door.y = 0;
  if (door.z < 0) door.z = 0;
  return door;
}

function snapSwitchToRoom(sw, room) {
  if (!sw || !room) return sw;
  const f = bestDoorHullFace(sw, room);
  if (!f) return sw;
  return snapBoxToHullFace(sw, f, SWITCH_SIZE, true);
}

function boxLo(obj, axis) {
  return obj[axis] | 0;
}

function boxHi(obj, axis) {
  return boxLo(obj, axis) + (obj["s" + axis] | 0);
}

/** 0 when the AABB touches or crosses the plane. */
function aabbPlaneGap(obj, axis, plane) {
  const lo = boxLo(obj, axis);
  const hi = boxHi(obj, axis);
  const p = plane | 0;
  if (hi < p) return p - hi;
  if (lo > p) return lo - p;
  return 0;
}

function rangesTouch(a0, a1, b0, b1) {
  return a1 >= b0 && a0 <= b1;
}

function switchOverlapsFace(sw, f) {
  const [fy0, fy1] = faceYRange(f);
  if (!rangesTouch(boxLo(sw, "y"), boxHi(sw, "y"), fy0, fy1)) return false;
  if (f.axis === "x") return rangesTouch(boxLo(sw, "z"), boxHi(sw, "z"), f.b0, f.b1);
  return rangesTouch(boxLo(sw, "x"), boxHi(sw, "x"), f.a0, f.a1);
}

/** +1 when air is on the +axis side of a room hull face (switch mounts in the air). */
function wallAirSign(f) {
  return f.sign > 0 ? -1 : 1;
}

/** Touching a room wall from the air side, overlapping that fragment. */
function switchMeetsWall(sw, f) {
  if (aabbPlaneGap(sw, f.axis, f.plane) !== 0) return false;
  if (!switchOverlapsFace(sw, f)) return false;
  if (wallAirSign(f) > 0) return boxHi(sw, f.axis) > (f.plane | 0);
  return boxLo(sw, f.axis) < (f.plane | 0);
}

function aabbTouch(a, b) {
  return (
    boxLo(a, "x") <= boxHi(b, "x") &&
    boxHi(a, "x") >= boxLo(b, "x") &&
    boxLo(a, "y") <= boxHi(b, "y") &&
    boxHi(a, "y") >= boxLo(b, "y") &&
    boxLo(a, "z") <= boxHi(b, "z") &&
    boxHi(a, "z") >= boxLo(b, "z")
  );
}

/**
 * Crate sides, wound so snapBoxToHullFace(..., inside) parks the switch in the
 * air with the triangle on the crate surface.
 */
function crateSwitchFaces(crate) {
  const x0 = crate.x | 0;
  const y0 = crate.y | 0;
  const z0 = crate.z | 0;
  const x1 = x0 + (crate.sx | 0);
  const y1 = y0 + (crate.sy | 0);
  const z1 = z0 + (crate.sz | 0);
  return [
    { axis: "x", sign: 1, plane: x0, a0: y0, a1: y1, b0: z0, b1: z1, faceId: "+x" },
    { axis: "x", sign: -1, plane: x1, a0: y0, a1: y1, b0: z0, b1: z1, faceId: "-x" },
    { axis: "z", sign: 1, plane: z0, a0: x0, a1: x1, b0: y0, b1: y1, faceId: "+z" },
    { axis: "z", sign: -1, plane: z1, a0: x0, a1: x1, b0: y0, b1: y1, faceId: "-z" },
  ];
}

function mountDist(sw, f) {
  const c = boxLo(sw, f.axis) + (sw["s" + f.axis] | 0) / 2;
  return Math.abs(c - f.plane);
}

/** Nearest crate side to `p`. `dir` (unit ray) breaks placement ties toward the face being looked at. */
function nearestCrateSide(crate, p, dir) {
  let best = null;
  for (const f of crateSwitchFaces(crate)) {
    const d = Math.abs(p[f.axis] - f.plane);
    const air = f.sign > 0 ? -1 : 1;
    const into = dir ? -air * (dir[f.axis] || 0) : 0;
    const score = d - into * 0.25;
    if (!best || score < best.score) best = { f, score };
  }
  return best?.f || null;
}

function fitSwitchY(sw, f) {
  const [fy0, fy1] = faceYRange(f);
  const sy = sw.sy | 0;
  const maxY = fy1 - sy;
  if (maxY <= fy0) {
    sw.y = fy0 | 0;
    return;
  }
  let y = sw.y | 0;
  if (y >= fy1 || y + sy <= fy0) y = maxY | 0;
  if (y < fy0) y = fy0 | 0;
  if (y > maxY) y = maxY | 0;
  sw.y = y;
}

function betterMount(a, b, sw) {
  if (a.dist < b.dist) return true;
  if (a.dist > b.dist) return false;
  const am = a.f.faceId === sw.face;
  const bm = b.f.faceId === sw.face;
  if (am !== bm) return am;
  return !!a.crate && !b.crate;
}

/**
 * Flush a switch onto a wall or crate it is actually touching.
 * A switch sitting in the room, off every surface, is left where it is.
 */
function alignSwitchToContact(sw, rooms, crates) {
  if (!sw) return sw;
  let best = null;
  const consider = (f, roomId, dist, crate) => {
    const cand = { f, roomId, dist, crate };
    if (!best || betterMount(cand, best, sw)) best = cand;
  };
  for (const room of rooms || []) {
    if (!room) continue;
    for (const f of roomGeometry(room).hullFaces || []) {
      if (f.axis === "y" || !DOOR_FACE_IDS.includes(f.faceId)) continue;
      if (!switchMeetsWall(sw, f)) continue;
      consider(f, room.id, mountDist(sw, f), false);
    }
  }
  for (const crate of crates || []) {
    if (!crate) continue;
    if ((crate.sx | 0) < 1 || (crate.sy | 0) < 1 || (crate.sz | 0) < 1) continue;
    if (!aabbTouch(sw, crate)) continue;
    const c = {
      x: boxLo(sw, "x") + (sw.sx | 0) / 2,
      y: boxLo(sw, "y") + (sw.sy | 0) / 2,
      z: boxLo(sw, "z") + (sw.sz | 0) / 2,
    };
    const f = nearestCrateSide(crate, c, null);
    if (!f) continue;
    consider(f, crate.roomId, mountDist(sw, f), true);
  }
  if (!best) return sw;
  if (best.roomId != null) sw.roomId = best.roomId;
  snapBoxToHullFace(sw, best.f, SWITCH_SIZE, true);
  fitSwitchY(sw, best.f);
  return sw;
}

/** Nearest switch mount on a crate: a side face, or the top mapped to the nearest side. */
function rayCrateSwitchFace(crate, origin, dir) {
  if (!crate || !origin || !dir) return null;
  if ((crate.sx | 0) < 1 || (crate.sy | 0) < 1 || (crate.sz | 0) < 1) return null;
  let bestSide = null;
  for (const f of crateSwitchFaces(crate)) {
    const hit = rayHullFace(origin, dir, f);
    if (hit && (!bestSide || hit.t < bestSide.t)) bestSide = { ...hit, face: f };
  }
  const top = {
    axis: "y",
    sign: 1,
    plane: (crate.y | 0) + (crate.sy | 0),
    a0: crate.x | 0,
    a1: (crate.x | 0) + (crate.sx | 0),
    b0: crate.z | 0,
    b1: (crate.z | 0) + (crate.sz | 0),
    faceId: "+y",
  };
  const topHit = rayHullFace(origin, dir, top);
  if (topHit && (!bestSide || topHit.t < bestSide.t - 1e-6)) {
    const face = nearestCrateSide(crate, topHit.point, dir);
    if (!face) return bestSide;
    return { t: topHit.t, point: topHit.point, face };
  }
  return bestSide;
}

/** Permute AABB sizes for one +90° about axis and re-anchor around AABB center. */
function permuteRoomAabb(room, axis) {
  const x = room.x | 0;
  const y = room.y | 0;
  const z = room.z | 0;
  const sx = room.sx | 0;
  const sy = room.sy | 0;
  const sz = room.sz | 0;
  if (axis === "y") {
    const cx = x + sx / 2;
    const cz = z + sz / 2;
    room.sx = sz;
    room.sz = sx;
    room.x = Math.round(cx - room.sx / 2);
    room.z = Math.round(cz - room.sz / 2);
  } else if (axis === "x") {
    const cy = y + sy / 2;
    const cz = z + sz / 2;
    room.sy = sz;
    room.sz = sy;
    room.y = Math.round(cy - room.sy / 2);
    room.z = Math.round(cz - room.sz / 2);
  } else {
    const cx = x + sx / 2;
    const cy = y + sy / 2;
    room.sx = sy;
    room.sy = sx;
    room.x = Math.round(cx - room.sx / 2);
    room.y = Math.round(cy - room.sy / 2);
  }
}

/** Quarter-turn room orient about world axis. Yaw permutes the AABB; X/Z keep the box. */
function rotateRoom(room, axis, delta) {
  const steps = ((delta | 0) % 4 + 4) % 4;
  for (let i = 0; i < steps; i++) {
    const { u, w, v } = roomBasis(room);
    const r = worldRot90Basis(u, w, v, axis);
    const q = encodeQuartersFromBasis(r.u, r.w, r.v);
    room.rx = q.rx;
    room.ry = q.ry;
    room.rz = q.rz;
    if (axis === "y") permuteRoomAabb(room, axis);
  }
  return clampRoomSplits(room);
}


// ---- js/fontModel.js ----
// 96-glyph 8x8 UI font (ASCII 32..127). Pure data, no DOM.
// A glyph is 8 row bytes, MSB = leftmost pixel (same as tools/genuifont.py).

const FONT_FIRST = 32;
const FONT_COUNT = 96;
const FONT_W = 8;
const FONT_H = 8;
/** Overview / PNG sheet columns. */
const FONT_COLS = 8;
/** Keep in sync with src/menu.asm SPACE_W / FONT_GAP. */
const FONT_SPACE_W = 4;
const FONT_GAP = 1;
const FONT_FILE_VERSION = 1;

function fontBlank() {
  return Array.from({ length: FONT_COUNT }, () => new Array(FONT_H).fill(0));
}

function normalizeFont(raw) {
  const out = fontBlank();
  if (!Array.isArray(raw)) return out;
  for (let i = 0; i < FONT_COUNT; i++) {
    const g = raw[i];
    if (!Array.isArray(g)) continue;
    for (let y = 0; y < FONT_H; y++) out[i][y] = (Number(g[y]) | 0) & 0xff;
  }
  return out;
}

function fontCharLabel(code) {
  if (code === 32) return "SP";
  if (code === 127) return "DEL";
  return String.fromCharCode(code);
}

function fontHex2(n) {
  return (n & 0xff).toString(16).toUpperCase().padStart(2, "0");
}

function fontGetPixel(rows, x, y) {
  return (rows[y] & (0x80 >> x)) !== 0;
}

/** Mutates rows. Returns true when the pixel changed. */
function fontSetPixel(rows, x, y, on) {
  const bit = 0x80 >> x;
  const was = (rows[y] & bit) !== 0;
  if (was === on) return false;
  rows[y] = on ? rows[y] | bit : rows[y] & ~bit & 0xff;
  return true;
}

function fontRowsEqual(a, b) {
  for (let y = 0; y < FONT_H; y++) if (a[y] !== b[y]) return false;
  return true;
}

function popcount8(n) {
  let c = 0;
  for (let x = n & 0xff; x; x &= x - 1) c++;
  return c;
}

/** lead/width match src/menu.asm font_scan: all-zero glyph = lead 0, width 0 (space). */
function fontGlyphStats(rows) {
  let occ = 0;
  let pixels = 0;
  for (let y = 0; y < FONT_H; y++) {
    occ |= rows[y];
    pixels += popcount8(rows[y]);
  }
  if (!occ) return { pixels: 0, lead: 0, width: 0, empty: true };
  let first = 0;
  while (!(occ & (0x80 >> first))) first++;
  let last = 7;
  while (!(occ & (0x80 >> last))) last--;
  return { pixels, lead: first, width: last - first + 1, empty: false };
}

function fontStats(font) {
  let nonEmpty = 0;
  let pixels = 0;
  let widest = 0;
  let touchLeft = 0;
  let touchRight = 0;
  for (const rows of font) {
    const s = fontGlyphStats(rows);
    if (s.empty) continue;
    nonEmpty++;
    pixels += s.pixels;
    if (s.width > widest) widest = s.width;
    if (s.lead === 0) touchLeft++;
    if (s.lead + s.width === FONT_W) touchRight++;
  }
  return { nonEmpty, pixels, widest, touchLeft, touchRight };
}

// ---- transforms (return new rows) ----

/** dx > 0 right, dy > 0 down. No wrap. */
function fontShift(rows, dx, dy) {
  const out = new Array(FONT_H).fill(0);
  for (let y = 0; y < FONT_H; y++) {
    const sy = y - dy;
    if (sy < 0 || sy >= FONT_H) continue;
    const r = rows[sy] & 0xff;
    out[y] = dx >= 0 ? (r >> dx) & 0xff : (r << -dx) & 0xff;
  }
  return out;
}

function reverseBits8(n) {
  let r = 0;
  for (let i = 0; i < 8; i++) if (n & (1 << i)) r |= 0x80 >> i;
  return r;
}

function fontFlipH(rows) {
  return rows.map(reverseBits8);
}

function fontFlipV(rows) {
  return rows.slice().reverse();
}

function fontInvert(rows) {
  return rows.map((r) => ~r & 0xff);
}

// ---- JSON file ----

/** One glyph per line so diffs stay readable. */
function fontToJson(font) {
  const f = normalizeFont(font);
  const lines = f.map((rows, i) => {
    const code = FONT_FIRST + i;
    const ch = code === 127 ? "DEL" : String.fromCharCode(code);
    const hex = rows.map((r) => `"${fontHex2(r)}"`).join(", ");
    return `    { "code": ${code}, "char": ${JSON.stringify(ch)}, "rows": [${hex}] }`;
  });
  return (
    `{\n  "version": ${FONT_FILE_VERSION},\n  "firstChar": ${FONT_FIRST},\n  "glyphs": [\n` +
    `${lines.join(",\n")}\n  ]\n}\n`
  );
}

function parseRowByte(v) {
  if (typeof v === "string") {
    const n = parseInt(v.replace(/^(0x|\$)/i, ""), 16);
    return Number.isFinite(n) ? n & 0xff : 0;
  }
  return (Number(v) | 0) & 0xff;
}

/** Throws on malformed JSON. Entries are placed by `code`, falling back to position. */
function fontFromJson(text) {
  const data = typeof text === "string" ? JSON.parse(text) : text;
  const out = fontBlank();
  const glyphs = Array.isArray(data?.glyphs) ? data.glyphs : [];
  glyphs.forEach((g, pos) => {
    const code = Number.isFinite(Number(g?.code)) ? Number(g.code) | 0 : FONT_FIRST + pos;
    const idx = code - FONT_FIRST;
    if (idx < 0 || idx >= FONT_COUNT || !Array.isArray(g?.rows)) return;
    for (let y = 0; y < FONT_H; y++) out[idx][y] = parseRowByte(g.rows[y]);
  });
  return out;
}

// ---- PNG sheet ----

/**
 * Slice an RGBA image ({width,height,data}) into 8x8 cells, row-major, first cell = ASCII 32.
 * Ink = luma > 128 (PIL "L" formula, as genuifont.py) and alpha >= 128; `invert` makes
 * opaque dark pixels the ink instead. Returns {error} or {glyphs:[{index,rows}], cols, rows, ignored}.
 */
function fontFromImageData(img, opts = {}) {
  const { width, height, data } = img;
  if (!(width >= FONT_W) || !(height >= FONT_H) || width % FONT_W || height % FONT_H) {
    return { error: `Sheet is ${width}x${height}; both sides must be multiples of ${FONT_W}` };
  }
  const cols = width / FONT_W;
  const rowsN = height / FONT_H;
  const cells = cols * rowsN;
  const total = Math.min(FONT_COUNT, cells);
  const glyphs = [];
  for (let i = 0; i < total; i++) {
    const cx = (i % cols) * FONT_W;
    const cy = Math.floor(i / cols) * FONT_H;
    const rows = [];
    for (let y = 0; y < FONT_H; y++) {
      let b = 0;
      for (let x = 0; x < FONT_W; x++) {
        const p = ((cy + y) * width + cx + x) * 4;
        if (data[p + 3] < 128) continue;
        const luma = (data[p] * 19595 + data[p + 1] * 38470 + data[p + 2] * 7471 + 0x8000) >> 16;
        const on = opts.invert ? luma <= 128 : luma > 128;
        if (on) b |= 0x80 >> x;
      }
      rows.push(b);
    }
    glyphs.push({ index: i, rows });
  }
  return { glyphs, cols, rows: rowsN, ignored: cells - total };
}

/** RGBA sheet, white on black, 8 cols x 12 rows. */
function fontToImageData(font) {
  const f = normalizeFont(font);
  const width = FONT_COLS * FONT_W;
  const height = (FONT_COUNT / FONT_COLS) * FONT_H;
  const data = new Uint8ClampedArray(width * height * 4);
  for (let i = 3; i < data.length; i += 4) data[i] = 255;
  f.forEach((rows, i) => {
    const cx = (i % FONT_COLS) * FONT_W;
    const cy = Math.floor(i / FONT_COLS) * FONT_H;
    for (let y = 0; y < FONT_H; y++) {
      for (let x = 0; x < FONT_W; x++) {
        if (!fontGetPixel(rows, x, y)) continue;
        const p = ((cy + y) * width + cx + x) * 4;
        data[p] = data[p + 1] = data[p + 2] = 255;
      }
    }
  });
  return { width, height, data };
}

// ---- text layout (mirrors src/menu.asm) ----

function fontCodeFor(ch) {
  const c = ch.charCodeAt(0);
  return c >= FONT_FIRST && c < FONT_FIRST + FONT_COUNT ? c : FONT_FIRST;
}

/**
 * Proportional: glyph shifted left by its lead, advance = (width || SPACE_W) + GAP.
 * Mono: unshifted, advance 8. Returns {cells:[{x,code,shift}], width} in pixels; x is the pen
 * position, shift the leftward pixel offset to apply when drawing.
 */
function fontLayoutText(font, text, proportional) {
  const cells = [];
  let x = 0;
  for (const ch of text) {
    const code = fontCodeFor(ch);
    const rows = font[code - FONT_FIRST];
    if (proportional) {
      const s = fontGlyphStats(rows);
      cells.push({ x, code, shift: s.lead });
      x += (s.width || FONT_SPACE_W) + FONT_GAP;
    } else {
      cells.push({ x, code, shift: 0 });
      x += FONT_W;
    }
  }
  return { cells, width: x };
}

function a8Hex(byte) {
  const b = byte & 0xfe;
  return A8_HEX[((b >> 4) << 3) | ((b & 15) >> 1)];
}

/** Line colour for this paper: same hue, luminance $0c. Matches the seam DLI. */
function a8InkHex(byte) {
  return a8Hex((byte & 0xf0) | 0x0c);
}

/** Black and white papers are not allowed: black gutters / ink == paper. */
function normalizeBg(value, fallback = ROOM_BG_DEFAULT) {
  const n = Number(value);
  if (value == null || !Number.isFinite(n)) return fallback;
  const b = Math.max(0, Math.min(255, n | 0)) & 0xfe;
  if ((b & 0xf0) === 0) {
    if (b < 0x04) return ROOM_BG_GREY_DARK;
    if (b >= 0x0e) return ROOM_BG_GREY_LIGHT;
  }
  return b;
}

/** Room object -> A8 background byte. Legacy bgColor/skyColor are C64 indices 0-15. */
function roomBgFromJson(o, fallback = ROOM_BG_DEFAULT) {
  if (o == null) return fallback;
  if (o.a8Bg != null) return normalizeBg(o.a8Bg, fallback);
  const legacy = o.bgColor ?? o.skyColor;
  if (legacy != null) {
    const i = Number(legacy);
    if (Number.isFinite(i)) return ROOM_BG_SLOTS[Math.max(0, Math.min(15, i | 0))].byte;
  }
  return fallback;
}

/** Elevator height mode: Auto invents home/dest at cook; off uses elevLow/elevHigh vs room.y. */
function elevHeightsAuto(obj) {
  return obj?.elevAuto !== false;
}

function clampElevHeights(obj) {
  let low = Number.isFinite(Number(obj.elevLow)) ? obj.elevLow | 0 : 0;
  let high = Number.isFinite(Number(obj.elevHigh)) ? obj.elevHigh | 0 : 1;
  if (high <= low) high = low + 1;
  obj.elevLow = low;
  obj.elevHigh = high;
  obj.elevAuto = elevHeightsAuto(obj);
  delete obj.elevType;
}

function xzAabbGap(a, b) {
  const ax1 = (a.x | 0) + (a.sx | 0);
  const bx1 = (b.x | 0) + (b.sx | 0);
  const az1 = (a.z | 0) + (a.sz | 0);
  const bz1 = (b.z | 0) + (b.sz | 0);
  const dx = Math.max(0, (a.x | 0) - bx1, (b.x | 0) - ax1);
  const dz = Math.max(0, (a.z | 0) - bz1, (b.z | 0) - az1);
  return dx + dz;
}

/** XZ interiors overlap. A shared edge is not enough. */
function xzStrictOverlap(a, b) {
  const ax = a.x | 0;
  const bx = b.x | 0;
  const az = a.z | 0;
  const bz = b.z | 0;
  return (
    ax < bx + (b.sx | 0) &&
    bx < ax + (a.sx | 0) &&
    az < bz + (b.sz | 0) &&
    bz < az + (a.sz | 0)
  );
}

/** Highest collider floor under the car, else the room AABB min Y. */
function elevRestFloor(elev, room) {
  const roomY = room.y | 0;
  const elevY = elev.y | 0;
  let best = null;
  for (const c of roomGeometry(room).colliders || []) {
    if ((c.sx | 0) <= 0) continue;
    const cy = c.y | 0;
    if (cy > elevY) continue;
    if (!xzStrictOverlap(elev, c)) continue;
    if (best == null || cy > best) best = cy;
  }
  return best == null ? roomY : best;
}

function nearestFloorHome(elev, room, floorY) {
  const elevSy = elev.sy | 0;
  const elevTop = (elev.y | 0) + elevSy;
  let bestKey = null;
  let bestHome = null;
  for (const c of roomGeometry(room).colliders || []) {
    if ((c.sx | 0) <= 0) continue;
    const cy = c.y | 0;
    if (cy <= floorY) continue;
    const home = cy - elevSy;
    if (home <= floorY) continue;
    const key = [xzAabbGap(elev, c), Math.abs(cy - elevTop)];
    if (
      bestKey == null ||
      key[0] < bestKey[0] ||
      (key[0] === bestKey[0] && key[1] < bestKey[1])
    ) {
      bestKey = key;
      bestHome = home;
    }
  }
  return bestHome;
}

/** Upper stop so elev top meets nearest same-room solid platform top, or null. */
function nearestPlatHome(elev, roomId, plats, floorY) {
  const elevSy = elev.sy | 0;
  const elevTop = (elev.y | 0) + elevSy;
  let bestKey = null;
  let bestHome = null;
  for (const p of plats) {
    if (p.roomId !== roomId) continue;
    if (p.collide === false) continue;
    const surface = (p.y | 0) + ((p.sy | 0) || 1);
    const home = surface - elevSy;
    if (home <= floorY) continue;
    const key = [xzAabbGap(elev, p), Math.abs(surface - elevTop)];
    if (
      bestKey == null ||
      key[0] < bestKey[0] ||
      (key[0] === bestKey[0] && key[1] < bestKey[1])
    ) {
      bestKey = key;
      bestHome = home;
    }
  }
  return bestHome;
}

/** Upper stop so elev top meets a doorway sill on this room, or null. */
function nearestDoorHome(elev, roomId, doors, floorY) {
  const elevSy = elev.sy | 0;
  const elevTop = (elev.y | 0) + elevSy;
  let bestKey = null;
  let bestHome = null;
  for (const d of doors) {
    if (d.roomId !== roomId && d.otherRoomId !== roomId) continue;
    const surface = d.y | 0;
    const home = surface - elevSy;
    if (home <= floorY) continue;
    const key = [xzAabbGap(elev, d), Math.abs(surface - elevTop)];
    if (
      bestKey == null ||
      key[0] < bestKey[0] ||
      (key[0] === bestKey[0] && key[1] < bestKey[1])
    ) {
      bestKey = key;
      bestHome = home;
    }
  }
  return bestHome;
}

/**
 * Absolute elev_y bottoms for dest (low) and home (high), matching tools/genmap.py.
 * @returns {{ dest: number, home: number }}
 */
function elevStopBottoms(doc, elev) {
  const room = roomUnderObject(doc, elev) || roomById(doc, elev.roomId);
  const roomY = room ? room.y | 0 : 0;
  if (!elevHeightsAuto(elev)) {
    clampElevHeights(elev);
    return { dest: roomY + elev.elevLow, home: roomY + elev.elevHigh };
  }
  const floorY = room ? elevRestFloor(elev, room) : roomY;
  let home = elev.y | 0;
  let dest = floorY;
  if ((elev.y | 0) <= floorY && room) {
    dest = elev.y | 0;
    const map = activeMap(doc);
    const objs = map?.objects || [];
    const plats = objs.filter((o) => o.kind === "platform");
    const doors = objs.filter((o) => o.kind === "doorway");
    let raised = nearestFloorHome(elev, room, floorY);
    if (raised == null) raised = nearestPlatHome(elev, elev.roomId, plats, floorY);
    if (raised == null) raised = nearestDoorHome(elev, room.id, doors, floorY);
    if (raised != null) home = raised;
  }
  return { dest, home };
}
